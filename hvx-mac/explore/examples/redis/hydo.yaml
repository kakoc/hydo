# The hvx/onboard/examples/redis manifest for the Mac backend (hvx-mac/explore): the same
# service, workload, knob and invariant, with the aarch64-linux Redis 7.2.4 from the nixpkgs
# binary cache and only the shared libraries its loader opens (hvx-mac/services/elfdeps.py).
# Build on the Linux box:  hvx/onboard/hydo-build <this> --arch arm64 --build-dir <dir>
# Try:  disk=none | run                    -> OK (every acknowledged write survives)
#       disk=cut | run C=12 R=everysec     -> Redis's documented fsync window after a power cut
name: redis
description: Redis with an append-only file; every acknowledged SET must survive.

