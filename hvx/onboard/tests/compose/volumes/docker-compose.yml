services:
  db:
    image: postgres:16.4
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - ./missing-dir:/var/backups
    secrets: [db_password]
    tmpfs:
      - /var/cache/pg:size=32m
  app:
    image: example/app:1
    volumes:
      - type: volume
        source: shared
        target: /srv/shared
      - type: bind
        source: ./conf
        target: /etc/app
        read_only: true
      - /var/lib/app/cache
volumes:
  pgdata:
  shared:
    external: true
secrets:
  db_password:
    file: ./secret.txt
