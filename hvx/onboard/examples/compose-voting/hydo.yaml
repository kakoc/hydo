# Docker's example voting app (github.com/dockersamples/example-voting-app, commit 63e9150c,
# docker-compose.images.yml copied unmodified as docker-compose.yml) imported with hydo-compose:
#   hvx/onboard/hydo-compose docker-compose.yml     # -> hydo.generated.yaml (kept for comparison)
# then edited BY HAND in four places, each marked "hand-written:": the workload, the invariants,
# guest.ram_mib, and the result service's port (vote and result both listen on 0.0.0.0:80).
# vote (Python) pushes each vote to a Redis list; worker (.NET) pops it and upserts it into
# PostgreSQL; result (Node) reads PostgreSQL.
# Try:  disk=none | run            -> OK: every acknowledged vote is counted in PostgreSQL
#       disk=none | run K=worker@5+5   -> OK: votes queue in Redis while the worker is down
#
# Generated by hvx/onboard/hydo-compose from docker-compose.yml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the Compose
# file; the workload and the invariants are TODO (search for TODO). The hydo-onboard skill
# (.claude/skills/hydo-onboard) fills them in. MANIFEST.md, "From Docker Compose", explains
# every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. write the workload and the invariants below
# 3. HYDO_SEEDRNG=<pinned hvx_seedrng> hvx/onboard/hydo-build hydo.yaml   (or: hydo build)
#
# WARNINGS (also printed by hydo-compose):
# - service worker: no healthcheck and no port: readiness is just `started`; write a ready: check
# - service redis: bind mount ./healthchecks:/healthchecks is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - service db: bind mount ./healthchecks:/healthchecks is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - networks front-tier, back-tier: all services share one loopback network in the guest, so the isolation between Compose networks is not modelled (every service can reach every other)
# - services vote, result all use container port 80. In Compose each has its own network; in the guest they share one, so if they listen on 0.0.0.0:80 only the first starts. Make each listen on its own addr: (vote=127.0.0.11, result=127.0.0.12) or move one to another port, e.g. with env:/cmd:
name: compose-voting
description: "imported from docker-compose.yml (5 services); TODO: what is tested"

guest:
  ram_mib: 2048   # hand-written: the generated guess was 1536 (1504 MiB for the services and the kernel)
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1280   # the data disk: every volume lives here (the fault target)
  dirs: [vol/db-data]

root:
  files:                 # bind-mount sources, copied into the read-only root
    - {src: healthchecks, dst: /etc/hydo/compose/bind/0-healthchecks}
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      127.0.0.11 vote
      127.0.0.12 result
      127.0.0.13 worker
      127.0.0.14 redis
      127.0.0.15 db

services:
  # Compose service vote
  # image dockersamples/examplevotingapp_vote = docker.io/dockersamples/examplevotingapp_vote@sha256:7102d3b952ec84e3541ee12e7217e320c52aed60b13501c3158f46376a907466
  #   linux/amd64: sha256:e63c2cb6732d6e5026ec0c3ede7bd3052321068b91d30fa16561e0f334d807b8
  #   linux/arm64: sha256:0ab82675962403d98735aa431ca116e8014051d5a8f145d302e04f21346f9b58
  # ready: no healthcheck; a TCP connect to its port (TODO: a real readiness check, e.g. a query, if the port opens before the service can serve)
  - name: vote
    image: {x86_64: images/dockersamples-examplevotingapp_vote-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_vote-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_vote:latest"
    port: 80
    addr: 127.0.0.11
    depends_on: [redis]
    ready: "nc -z -w 2 127.0.0.11 80"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Compose service result
  # image dockersamples/examplevotingapp_result = docker.io/dockersamples/examplevotingapp_result@sha256:06c50992ab258e1d83406784040842bb920f6938eabac19261e7ec634f878935
  #   linux/amd64: sha256:7583fe9ceb85e658335e66d8d1f01c43b2bcdf9684f60e53f3989d6fc36a3bd0
  #   linux/arm64: sha256:c87f44054a409c8a457b19089efbb9bb039b4539af62b2f4906bf6f05d380c31
  # ready: no healthcheck; a TCP connect to its port (TODO: a real readiness check, e.g. a query, if the port opens before the service can serve)
  - name: result
    image: {x86_64: images/dockersamples-examplevotingapp_result-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_result-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_result:latest"
    env:                            # hand-written: vote already listens on 0.0.0.0:80 in the guest
      PORT: "81"
    port: 81
    addr: 127.0.0.12
    depends_on: [db]
    ready: "nc -z -w 2 127.0.0.12 81"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Compose service worker
  # image dockersamples/examplevotingapp_worker = docker.io/dockersamples/examplevotingapp_worker@sha256:c8a8571065479c12567e8e440836e543d185c678cd4781a32b100f71e8f39c86
  #   linux/amd64: sha256:8820615213ade73a83f930a90fffe4aa6c01865c2f277f2c9506e8a904a8ecbe
  #   linux/arm64: sha256:374f13009def417269e568e3796746605a4efc4e166e7ccda69312face04b963
  # ready: TODO no healthcheck and no port -- `true` means started
  - name: worker
    image: {x86_64: images/dockersamples-examplevotingapp_worker-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_worker-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_worker:latest"
    addr: 127.0.0.13
    depends_on: [redis, db]
    ready: "true"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Compose service redis
  # image redis:alpine = docker.io/library/redis@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
  #   linux/amd64: sha256:16b124a2d3eacd620d917ead6fd26cbf1f1d7117fa94122398971931cfe2d403
  #   linux/arm64/v8: sha256:0819246a2bb1979f7745a8bae2559a2ffa49071ef7a5e7213b3e347e162aeb26
  # port from the image's EXPOSE [6379]
  # ready: from Compose healthcheck
  - name: redis
    image: {x86_64: images/redis-alpine-amd64.docker.tar, arm64: images/redis-alpine-arm64-oci}
    image_ref: "redis:alpine"
    port: 6379
    addr: 127.0.0.14
    ready: "timeout 30 hydo-oci redis /bin/sh -c /healthchecks/redis.sh"
    ready_timeout: 120
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/0-healthchecks, dst: /healthchecks}
  # Compose service db
  # image postgres:15-alpine = docker.io/library/postgres@sha256:a8e042598834300dfaa17a54f695b87b7f25d3490433bbbe2ef3bffbb9747f24
  #   linux/amd64: sha256:1d4031d6ed0a9b774b365f99a3c16127217eb19f699d8d43fc43b732748601ef
  #   linux/arm64/v8: sha256:188e422ad801eaf156d9b9e276064d931553a81f4281a18db98752178dbc061d
  # port from the image's EXPOSE [5432]
  # ready: from Compose healthcheck
  - name: db
    image: {x86_64: images/postgres-15-alpine-amd64.docker.tar, arm64: images/postgres-15-alpine-arm64-oci}
    image_ref: "postgres:15-alpine"
    env:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    port: 5432
    addr: 127.0.0.15
    ready: "timeout 30 hydo-oci db /bin/sh -c /healthchecks/postgres.sh"
    ready_timeout: 120
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/db-data, dst: /var/lib/postgresql/data, copy_up: true}
      - {src: /etc/hydo/compose/bind/0-healthchecks, dst: /healthchecks}

# hand-written: step i = one vote by voter<i> (a on even steps, b on odd) through the vote app's
# web form; acknowledged = HTTP 200 (the vote is then in the Redis list "votes").
workload:
  steps: 20
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      v=a; [ $((i % 2)) = 1 ] && v=b
      if wget -q -T 5 -O /dev/null --header "Cookie: voter_id=voter$i" --post-data "vote=$v" http://vote/ 2>/dev/null; then
        echo voter$i >> $HYDO_ACKED; echo "voter$i ack" >> $HYDO_OUTCOMES
      else
        echo "voter$i unknown" >> $HYDO_OUTCOMES
      fi
      i=$((i + 1))
    done
  timeout: 300
  process: wget

shell: |
  # hand-written: every acknowledged vote is a row (voter, vote) in PostgreSQL's votes table
  votes_counted() {
    got=$(hydo-oci db psql -U postgres -tAc "select id || ' ' || vote from votes" 2>/dev/null) || { echo "db not answering"; return 2; }
    n=0
    for id in $(cat $HYDO_ACKED); do
      i=${id#voter}; v=a; [ $((i % 2)) = 1 ] && v=b
      echo "$got" | grep -qx "$id $v" || { echo "$id (vote $v) acknowledged but not counted"; return 1; }
      n=$((n + 1))
    done
    echo "all $n acknowledged votes counted"
  }

# hand-written invariants
invariants:
  - id: votes.counted_soon
    msg: every acknowledged vote reaches PostgreSQL within 60 s after the faults end
    type: eventually
    within: 60
    cmd: votes_counted
  - id: votes.counted
    msg: every acknowledged vote is counted, with the choice the voter made
    cmd: votes_counted

faults: [kill, pause, network, oneway, cut, clock, disk]
