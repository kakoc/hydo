[package]
name = "hydo-test"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.70"
description = "hydo's test SDK for Rust: write the test as drivers and checks plus a system() builder; the binary emits hydo's plan (on the host) and runs the drivers and checks (in the guest)"
publish = false

# Its own workspace: the repository root's Cargo.toml is the (unrelated) hydo KVM crate.
[workspace]
members = ["macros"]

[dependencies]
hydo-test-macros = { path = "macros", version = "0.1.0" }
hydo-assert = { path = "../rust", version = "0.1.0" }   # the assertion SDK (sdk/rust), re-exported
inventory = "0.3"

[[bin]]
name = "cargo-hydo"
path = "src/bin/cargo-hydo.rs"
