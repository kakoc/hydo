[package]
name = "hydo-test-macros"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.70"
description = "The #[driver] and #[check] attributes of hydo-test, the test SDK for hydo (a deterministic hypervisor); use them through hydo-test"
repository = "https://github.com/kakoc/hydo"
homepage = "https://github.com/kakoc/hydo"
documentation = "https://docs.rs/hydo-test"
readme = "README.md"
keywords = ["testing", "deterministic", "hydo"]
categories = ["development-tools::testing"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
# Not published until the user decides about code-first tests (docs/PUBLISHING.md).
publish = false

[lib]
proc-macro = true
