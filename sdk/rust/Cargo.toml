[package]
name = "hydo-assert"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.70"
description = "Assertion SDK for programs tested under hydo, a deterministic hypervisor: always, sometimes, reachable, unreachable and eventually properties, BUGGIFY fault points and operation histories"
repository = "https://github.com/kakoc/hydo"
homepage = "https://github.com/kakoc/hydo"
documentation = "https://docs.rs/hydo-assert"
readme = "README.md"
keywords = ["testing", "assertions", "deterministic", "fault-injection", "simulation"]
categories = ["development-tools::testing"]
# The tests read the shared cases in ../cases, which are not in the package.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

# Its own workspace: not a member of the repository's workspace, because this crate is compiled
# into recorded guest programs (rust-kv's rkv) and Cargo's symbol hashes depend on the package's
# path and lock file.
[workspace]

[features]
default = []
# Compile every assertion, catalog and lifecycle call to nothing and make every BUGGIFY point
# return false (conditions are still evaluated). For builds that must not touch the console.
noop = []
# Steered values (`minimize`, `maximize`) for `hydo explore --steer`. Off by default, so a program
# built without it keeps its bytes (the SDK examples inside recorded guest images).
steer = []
# `From<serde_json::Value>` for `Value` and `From<serde_json::Map>` for `Details`.
serde_json = ["dep:serde_json"]
# `history::messages`: the recorder of messaging histories (send, recv, ack, ...). Opt-in, so
# that programs built without it keep their bytes.
messages = []

[dependencies]
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
# the tests use the messaging recorder (the feature `messages`)
hydo-assert = { path = ".", features = ["messages"] }
