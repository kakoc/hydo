# The KVM engine's x86-64-v3 check (hv/kvm/v3-check.sh; docs/design/kvm-engine.md, "x86-64-v3"):
# the avx2 example (hydo/onboard/examples/avx2) without its Nix glibc, so that any x86_64 Linux
# machine with the release can build it. No services: each workload step runs hydoavx, a static
# four-thread AVX2 + FMA program that checks its vector results against scalar code and folds the
# threads' results into one order-dependent value; the first step also writes the guest's view of
# the CPU to the console (the flags line of /proc/cpuinfo and the kernel's x86/fpu lines).
name: kvm-v3
description: AVX2/FMA math across four threads, checked against scalar code, on a v3 guest CPU.

guest:
  cpu: v3

root:
  files:
    - {src: hydoavx, dst: /bin/hydoavx, mode: "0755"}

data:
  size_mib: 64
  dirs: [avx]

workload:
  steps: 8
  run: |
    i=$HYDO_FROM
    if [ "$i" = 0 ]; then
      { grep -m1 '^flags' /proc/cpuinfo
        dmesg | grep 'x86/fpu'
      } 2>&1 | sed 's/^/hydo-avx-cpu: /' > /dev/ttyS0
    fi
    while [ $i -lt $HYDO_TO ]; do
      out=$(/bin/hydoavx $i)
      if [ $? = 0 ]; then echo "$out" >> /data/avx/out; sync; echo $i >> $HYDO_ACKED; fi
      echo "hydo-avx: $out" > /dev/ttyS0
      i=$((i + 1))
    done

invariants:
  - id: avx.results_match_scalar
    msg: every hydoavx run had AVX2 + FMA and its vector results equal the scalar ones
    cmd: |
      n=$(wc -l < $HYDO_ACKED)
      good=$(grep -c ' avx2=1 ok=1 ' /data/avx/out 2>/dev/null)
      if [ "$n" = 8 ] && [ "${good:-0}" -ge "$n" ]; then echo "steps=$n all AVX2 results equal the scalar ones"; exit 0; fi
      echo "acked=$n good=${good:-0}"; exit 1
  - id: cpu.avx_enabled
    msg: the guest kernel sees AVX2 and uses XSAVE with x87|SSE|AVX
    cmd: |
      grep -qw avx2 /proc/cpuinfo || { echo "no avx2 in /proc/cpuinfo"; exit 1; }
      dmesg | grep -q 'Enabled xstate features 0x7' || { echo "no xstate 0x7 line"; exit 1; }
      echo "avx2 in /proc/cpuinfo; xstate features 0x7"

faults: [clock]
