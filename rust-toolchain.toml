# The toolchain of the hydo workspace (docs/BUILD-PINS.md, "Rust"). The release binaries are built
# for x86_64-unknown-linux-musl (static, the Linux release) and aarch64-apple-darwin (the Mac
# release). sdk/ and the Rust examples keep their own workspaces; an example that needs a fixed
# compiler pins it in its own rust-toolchain.toml.
[toolchain]
channel = "1.90.0"
components = ["clippy", "rustfmt"]
