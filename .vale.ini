# Vale (https://vale.sh), the prose linter for hydo's documentation. docs/STYLE.md is the
# standard; this file checks the parts of it that a program can check.
#
# Run it with `sh ci/vale.sh`. The script downloads the pinned Vale and the pinned Google and
# proselint packages, checks their sha256, and runs Vale on the files it lists.
# .vale/styles/hydo is this project's own style. .vale/styles/Google and .vale/styles/proselint
# are downloaded and are not tracked. .vale/styles/config/vocabularies/hydo/accept.txt lists
# the proper nouns that Google's capitalization checks must accept.
StylesPath = .vale/styles
Vocab = hydo
# Every warning and every error fails ci/vale.sh; suggestions are not shown.
MinAlertLevel = warning

[*.md]
BasedOnStyles = Google, proselint, hydo
# From Vale's built-in style only the check for a repeated word ("the the").
Vale.Repetition = YES

# Narrow exceptions, each with its reason:
# - HTML comments are not prose.
# - "kill" is the name of a fault that hydo injects (the schedule token K=) and of the Unix
#   command. Google.WordListCase asks for "stop" instead, which is a different fault (P=, a
#   pause). Only this word is hidden from the checks.
TokenIgnores = (<!--[^>]*-->), \b(?:kill|kills|killed|killing)\b
