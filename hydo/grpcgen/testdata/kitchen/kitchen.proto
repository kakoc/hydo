// Every field shape the value generator handles (unit tests only).
syntax = "proto3";
package kitchen;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";
import "legacy.proto";

enum Color { COLOR_UNSPECIFIED = 0; RED = 1; GREEN = 2; BLUE = 5; }

message Leaf { string name = 1; sint32 n = 2; }

message Node {                       // recursive: generation must stop at the depth limit
  string label = 1;
  Node left = 2;
  repeated Node kids = 3;
}

message Sink {
  int32 i32 = 1; int64 i64 = 2; uint32 u32 = 3; uint64 u64 = 4;
  sint32 s32 = 5; sint64 s64 = 6; fixed32 f32 = 7; fixed64 f64 = 8;
  sfixed32 sf32 = 9; sfixed64 sf64 = 10; float fl = 11; double db = 12;
  bool b = 13; string s = 14; bytes by = 15; Color color = 16;
  Leaf leaf = 17;
  repeated int32 ri = 18;
  repeated Leaf rl = 19;
  repeated Color rc = 20;
  map<string, int64> ms = 21;
  map<int32, Leaf> ml = 22;
  map<bool, string> mb = 23;
  oneof choice { string c_str = 24; Leaf c_leaf = 25; int64 c_num = 26; }
  optional string opt = 27;
  google.protobuf.Timestamp ts = 28;
  google.protobuf.Duration dur = 29;
  google.protobuf.StringValue wrapped = 30;
  google.protobuf.Struct st = 31;
  google.protobuf.Any any = 32;
  Node tree = 33;
  google.protobuf.Value val = 34;
  legacy.Old old = 35;
}

message Ids { string id = 1; int64 n = 2; Color color = 3; repeated string tags = 4; }

service Kitchen {
  rpc Put(Sink) returns (Ids);
  rpc Fetch(Ids) returns (Sink);
  rpc Watch(Ids) returns (stream Ids);
  rpc Upload(stream Ids) returns (Ids);
}
