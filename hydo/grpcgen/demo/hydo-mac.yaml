    - {src: /nix/store/ywz8lg1h600a888z67hpj632b8gri6wx-zstd-1.5.6/lib/libzstd.so.1.5.6, dst: /nix/store/ywz8lg1h600a888z67hpj632b8gri6wx-zstd-1.5.6/lib/libzstd.so.1.5.6}
    - {src: build/orderd-arm64, dst: /bin/orderd, mode: "0755"}
    # the generated drivers: the arm64 client (hydo-grpc-gen --arch amd64,arm64)
    - {src: build/gen/hydo-grpc.arm64, dst: /bin/hydo-grpc, mode: "0755"}
    - {src: build/gen/grpc, dst: /etc/hydo/grpc}
  text:
    /etc/redis.conf: |
      port 6379
      bind 127.0.0.1
      dir /data/redis
      save ""
      appendonly yes
      appendfsync always
      hz 1
      dynamic-hz no

data:
  size_mib: 64
  dirs: [redis]

env:
  HYDO_GRPC_SEED: "1"             # requests: a function of this seed and each composer entry's HYDO_SEED

services:
  - name: redis
    cmd: /bin/redis-server /etc/redis.conf
    ready: /bin/redis-cli ping | grep -q PONG
    port: 6379
  - name: orderd
    cmd: /bin/orderd serve --mode {{mode}}
    ready: /bin/hydo-grpc call List '{"page_size":1}' > /dev/null
    port: 7070
    depends_on: [redis]

# from build/gen/hydo.grpc.yaml: the test composer runs one generated driver per RPC; the
# schedule's W= token decides which run when and with which requests
test:
  commands:
    - {name: create, kind: parallel_driver, run: [/bin/hydo-grpc, drive, orders.v1.Orders/Create], timeout: 21}
    - {name: get, kind: parallel_driver, run: [/bin/hydo-grpc, drive, orders.v1.Orders/Get], timeout: 12}
    - {name: cancel, kind: parallel_driver, run: [/bin/hydo-grpc, drive, orders.v1.Orders/Cancel], timeout: 14}
    - {name: list, kind: parallel_driver, run: [/bin/hydo-grpc, drive, orders.v1.Orders/List], timeout: 12}

workload:
  steps: 30                       # composer rounds; faults are placed at round numbers
  retry: /bin/hydo-grpc retry     # unknown outcomes, re-sent with the same request after the faults heal
  timeout: 400

invariants:
  - id: orders.consistent
    msg: no request_id creates two orders; every acknowledged Create and Cancel is stored
    cmd: /bin/orderd check

faults: [kill, pause, network, oneway, cut, clock, disk]
