# ./hydo.yaml for the Mac backend (arm64 guest; Milestone 96): the same service, generated
# drivers, workload and invariant, with the aarch64-linux Redis 7.2.4 of
# hvx-mac/explore/examples/redis/hydo.yaml, orderd built for arm64 and the generated client's
# arm64 build. Build the programs on any machine with Go 1.26.5 (no Nix needed):
#   (cd hvx/grpcgen && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOFLAGS=-mod=readonly GOTOOLCHAIN=local \
#      go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o demo/build/orderd-arm64 ./demo/orderd)
#   hvx/onboard/hydo-grpc-gen hvx/grpcgen/demo/proto --hints hvx/grpcgen/demo/hints.yaml \
#      --out hvx/grpcgen/demo/build/gen --arch amd64,arm64
# then the image with hydo-build --arch arm64 (the Redis store paths must exist; on a Mac, point
# them at the release's examples/redis/files) and --set mode=buggy|fixed.
name: grpcorders
description: a gRPC order service on Redis, driven by generated gRPC drivers

params:
  mode: buggy                     # buggy | fixed (build.sh builds both)

root:
  files:
