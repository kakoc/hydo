# A task queue whose writes are acknowledged at once and processed later (hydo guide messages,
# "Read back the final states"): every acknowledged task ends succeeded, or failed with an error
# that the client caused, and the read-back records whether each task's effect is there.
format: 1
name: messages-acked-outcome
services:
  - name: search
    cmd: /bin/search-server --data /data/search
    ready: /bin/tasks-client ready
workload:
  steps: 30
  run: /bin/tasks-client enqueue --from $HYDO_FROM --to $HYDO_TO
checks:
  - id: tasks
    type: messages
    history: tasks
    final: /bin/tasks-client read-back
    claims:
      acked_outcome:
        client_errors: [index_already_exists, "invalid_*"]
        effect: recorded
  - id: jobs
    type: messages
    history: jobs
    final: /bin/tasks-client read-back-jobs
    claims:
      acked_outcome: success
