# hvx/onboard/examples/redis/hydo-hist.yaml for the Mac backend (arm64 guest; Milestone 96): the
# same histories, workload, knob and checks, with the aarch64-linux Redis 7.2.4 of ./hydo.yaml.
# Each step records SET k:<i> v<i> in history kv (a register per key) and RPUSH/LRANGE in history
# log (append-only lists); the final: commands read everything back in the same or the recovery
# boot, and the host checks kv for linearizability and log with the list-append checker
# (hvx/history/hydohist.py, run by explore.py --backend hvm and by the Mac `hydo run`).
# Build on the Linux box:  hvx/onboard/hydo-build <this> --arch arm64 --build-dir <dir>
# or on the Mac with the release (its examples/redis/files hold the same store paths).
# Try:  disk=cut | run C=12              -> OK: every acknowledged SET and RPUSH survives
#       disk=cut | run C=12 R=everysec   -> VIOLATION: an acknowledged write is lost
name: redis-hist
description: Redis with an append-only file; histories checked for linearizability and lost appends.

