# Milestone 195: guest.cpu_cache, the CPUID cache leaves (an image service on the glibc 2.28 of
# Red Hat Enterprise Linux 8's family needs them).
format: 1
name: cpu-cache
description: "a guest whose CPUID describes its caches"
guest:
  cpu: v3
  cpu_cache: true
services:
  - name: app
    image: {x86_64: images/app-amd64.docker.tar}
    image_ref: "almalinux:8.10"
    cmd: [sleep, infinity]
    ready: "true"
workload:
  steps: 1
  run: |
    hydo-oci app /usr/libexec/platform-python -c 'print(len(bytearray(1 << 20)))'
invariants:
  - id: app.ran
    cmd: "true"
