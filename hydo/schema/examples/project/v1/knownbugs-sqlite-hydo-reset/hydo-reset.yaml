# Variant of hydo.yaml: the same walrace program and invariant, but run in walrace's "reset"
# mode (README "A workload that restarts the WAL often"): small transactions, checkpoints back
# to back from 1..3 connections, writers whose busy handler may yield instead of sleeping,
# readers that reconnect. Its shape is drawn from the same S knob (its own random stream).
#   hvx/onboard/hydo-build hvx/knownbugs/sqlite/hydo-reset.yaml                    # 3.51.2
#   hvx/onboard/hydo-build hvx/knownbugs/sqlite/hydo-reset.yaml --set v=3510300    # 3.51.3
# The acked list goes to $HYDO_ACKED.r (tens of thousands of ids; the console holds 64 KiB).
name: kb-sqlite-reset-{{v}}
description: SQLite {{v}} in WAL mode, walrace reset mode (frequent WAL restarts).

params:
  v: "3510200"

root:
  files:
    - {src: bin/walrace-{{v}}, dst: /bin/walrace, mode: "0755"}

data:
  size_mib: 256
  dirs: [db]

services: []

workload:
  steps: 4
  run: WALRACE_MODE=reset /bin/walrace run /data/db/t.db $HYDO_ACKED $HYDO_OUTCOMES $HYDO_FROM $HYDO_TO
  timeout: 900
  process: walrace

knobs:
  - token: S
    name: workload seed (reset-mode shape)
    default: "0"
    set: echo $HYDO_VALUE > /tmp/walrace.seed

invariants:
  - id: sqlite.committed_durable_and_intact
    msg: every committed write is present with its value and PRAGMA integrity_check is ok
    cmd: /bin/walrace check /data/db/t.db $HYDO_ACKED

faults: [clock]
