# Milestone 209: steer:, a number in the console lines that says how close a run came to failing
# (hydo explore --steer queue_len; docs/design/steered-search.md).
format: 1
name: steer-value
description: "a flaky test whose output says how close it came to failing"
root:
  files:
    - {src: bin/pkg.test, dst: /bin/pkg.test, mode: "0755"}
data:
  dirs: [t]
workload:
  kind: test
  steps: 1
  run: |
    [ "$HYDO_FROM" = 0 ] || exit 0
    cd /data/t && /bin/pkg.test > out 2>&1; cat out > /dev/console
    echo 0 >> $HYDO_ACKED
invariants:
  - id: test.passes
    cmd: "grep -q '^test result: ok' /data/t/out"
steer:
  - id: queue_len
    match: 'queue length: (\d+)'
    goal: min
    description: "the test fails when the queue is empty when it looks"
