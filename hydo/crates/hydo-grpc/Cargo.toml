[package]
name = "hydo-grpc"
description = "The generic gRPC driver that runs inside a hydo guest (hydo-grpc), and what the generator shares with it: the plan, the seeded value generator, outcomes, call records and the HTTP/2 client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published to crates.io: `cargo install hydo` does not need it (docs/PUBLISHING.md).
publish = false

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false
path = "src/lib.rs"

[[bin]]
name = "hydo-grpc"
path = "src/bin/hydo-grpc.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dependencies]
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
h2 = "0.4"
http = "1"
bytes = "1"
libc = "0.2"
ryu = "1"

[dev-dependencies]
sha2 = { workspace = true }
