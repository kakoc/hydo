[package]
name = "hydo-composer"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "The test composer, host side: the plan's W= token in its seed, resolved and saved forms, the shrinker's candidates, saved regressions, and the files a plan stages into an image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
hydo-manifest = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
sha2 = { workspace = true }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
