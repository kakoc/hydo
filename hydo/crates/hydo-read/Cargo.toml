# hydo-read (also run as hydo-check): the in-guest store readers and set-style checks
# (hydo/onboard/MANIFEST.md, "Reading the stores"; docs/HISTORY.md M88, M112).
#
# Not a member of the repository's workspace, on purpose: its bytes are inside recorded guest
# images, so it keeps its own lock file and its own small dependency set (pure Rust only, no C
# library), and a dependency update elsewhere in the workspace never changes those images.
# Build the static guest binaries with build.sh (docs/BUILD-PINS.md, "hydo-read").
[package]
name = "hydo-read"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
publish = false

[lib]
name = "hydo_read"
path = "src/lib.rs"

[[bin]]
name = "hydo-read"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hmac = "0.12"
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
md-5 = "0.10"
ruzstd = { version = "0.7", default-features = false, features = ["std"] }
sha1 = "0.10"
sha2 = "0.10"
snap = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[workspace]
