[package]
name = "hydo-explore"
description = "hydo's fault explorer: schedules from seeds, a worker pool over one engine, re-runs, shrinking and reports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[lib]
path = "src/lib.rs"

# The explorer on its own (the repository's counterpart of explore.py; `hydo explore` is the
# release's entry point and calls the same library).
[[bin]]
name = "hydo-explore"
path = "src/bin/hydo-explore.rs"

[dependencies]
hydo-config = { workspace = true }
hydo-schedule = { workspace = true }
hydo-manifest = { workspace = true }
hydo-engine = { workspace = true }
hydo-history = { workspace = true }
hydo-errors = { workspace = true }
hydo-results = { workspace = true }
hydo-image = { workspace = true }
hydo-control = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
regex = "1"
libc = "0.2"

# The scripted engine is this test binary itself (run with HYDO_FAKE_ENGINE=1), so the test has its
# own main().
[[test]]
name = "fake_engine"
path = "tests/fake_engine.rs"
harness = false
