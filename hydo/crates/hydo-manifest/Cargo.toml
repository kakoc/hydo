[package]
name = "hydo-manifest"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo's project format as types: hydo.yaml, a plan's test: section and the hydo/ folder"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
sha2 = "0.10"
libc = "0.2"
schemars = { version = "1.2.1", features = ["indexmap2", "preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
serde_path_to_error = "0.1.20"
hydo-schedule = { workspace = true }

[dev-dependencies]
hydo-schema-compat = { path = "../hydo-schema-compat" }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
