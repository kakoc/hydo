[package]
name = "hydo-engine"
description = "One interface to hydo's run engines: hvx (the Rust engine hydo-hvx, in-process or as a program) and hvm (the Rust engine hydo-hvm, as a program or in-process)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hydo-config = { workspace = true }
hydo-schedule = { workspace = true }
hydo-engine-proto = { workspace = true }
hydo-image = { workspace = true }
hydo-hvx = { workspace = true }
hydo-hvm = { workspace = true }
libc = "0.2"
flate2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# the agent_boot_check example (M121) drives hydo-agent through the protocol's host session
hydo-agent-proto = { workspace = true }
