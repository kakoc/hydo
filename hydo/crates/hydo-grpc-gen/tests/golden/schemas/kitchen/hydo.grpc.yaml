# Generated by hydo-grpc-gen from proto:kitchen.proto, proto:legacy.proto.
# Merge into hydo.yaml; paths are relative to the directory hydo.yaml is in.
# RPCs (hydo-grpc list):
#   put                  kitchen.Kitchen/Put weight=1 deadline=2000ms retry=0
#   fetch                kitchen.Kitchen/Fetch weight=1 deadline=2000ms retry=0
#   watch                kitchen.Kitchen/Watch weight=1 deadline=2000ms retry=0
#   upload               kitchen.Kitchen/Upload weight=1 deadline=2000ms retry=0
root:
  files:
    - {src: out/hydo-grpc, dst: /bin/hydo-grpc, mode: "0755"}
    - {src: out/grpc, dst: /etc/hydo/grpc}

env:
  HYDO_GRPC_SEED: "1"           # requests: a function of this seed and the composer entry (HYDO_SEED) or the step

# The test composer (MANIFEST.md "The test composer") composes these commands; the schedule
# token W= decides which run when, and each entry's HYDO_SEED decides its requests.
# The same commands are files in out/workload/ (the hydo/workload/ layout).
test:
  commands:
    - {name: put, kind: parallel_driver, run: [/bin/hydo-grpc, drive, kitchen.Kitchen/Put], timeout: 14}
    - {name: fetch, kind: parallel_driver, run: [/bin/hydo-grpc, drive, kitchen.Kitchen/Fetch], timeout: 14}
    - {name: watch, kind: parallel_driver, run: [/bin/hydo-grpc, drive, kitchen.Kitchen/Watch], timeout: 14}
    - {name: upload, kind: parallel_driver, run: [/bin/hydo-grpc, drive, kitchen.Kitchen/Upload], timeout: 14}

workload:
  steps: 30                       # composer rounds; faults are placed at round numbers

# Without the composer (numbered steps), drop test: and use instead:
# workload:
#   steps: 30
#   run: /bin/hydo-grpc steps $HYDO_FROM $HYDO_TO   # 2 call(s) x 1 worker(s) per step
#   timeout: 180
#   process: hydo-grpc

# Invariants stay yours. Call records: /tmp/hydo/grpc/calls (HYDO-HIST lines, history grpc).
# hydo-grpc call <rpc> '<json>' prints a response and exits 0 ok / 1 failed / 2 unknown,
# for read-backs in invariants. Outcomes of RPCs with outcome_id: also go to $HYDO_ACKED and $HYDO_OUTCOMES.
