[package]
name = "hydo-grpc-gen"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo-grpc-gen: gRPC drivers for a hydo project from its .proto files, a descriptor set or a server's reflection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published to crates.io: `cargo install hydo` does not need it (docs/PUBLISHING.md).
publish = false

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false
path = "src/lib.rs"

[[bin]]
name = "hydo-grpc-gen"
path = "src/bin/hydo-grpc-gen.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dependencies]
hydo-config = { workspace = true }
hydo-grpc = { workspace = true }
prost = "0.14"
prost-reflect = "0.16"
protox = "0.9"
libyaml-safer = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

[dev-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
h2 = "0.4"
http = "1"
bytes = "1"

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"

# its own test program (ci/consolidate-tests.sh): it sets HYDO_SEED, HYDO_OUTCOMES, HYDO_ACKED
# and HYDO_GRPC_CONSOLE in the process environment (under its own lock); the other tests of the
# crate would see them under cargo test, which runs one program's tests as threads of one process
[[test]]
name = "client"
path = "tests/client.rs"
