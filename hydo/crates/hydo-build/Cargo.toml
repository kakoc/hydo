[package]
name = "hydo-build"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo's image builder: a project manifest compiled into a guest image (x86_64 ext4 disk, arm64 initramfs)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[[bin]]
name = "hydo-build"
path = "src/bin/hydo-build.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dependencies]
hydo-config = { workspace = true }
hydo-manifest = { workspace = true }
hydo-agent-proto = { workspace = true }
hydo-image = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
regex = "1"
libc = "0.2"

# zlib's own deflate, so an arm64 initramfs gets the bytes Python's gzip module wrote. The static
# musl build (the Linux release) has no zlib to link and keeps the pure-Rust backend; it does not
# build arm64 images (hydo-build says so).
[target.'cfg(not(target_env = "musl"))'.dependencies]
flate2 = { workspace = true, features = ["zlib"] }

# SHA-256 with the ARMv8 instructions on the Mac (a build hashes gigabytes: the layer checks and
# the printed digests); the portable code elsewhere (the musl cross-build cannot assemble sha2-asm).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
