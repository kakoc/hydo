[package]
name = "hydo-hvm"
description = "The Mac run engine: the deterministic arm64 VMM on Hypervisor.framework (ported from the C hvm.c, its virtio devices, its spin observer and hvmx, deleted in M147); in-process or as the hydo-hvm program"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
libc = "0.2"
# the C library's number parsing as the engines read schedules (hydo_hvx::cstr)
hydo-hvx = { workspace = true }
# the typed engine calls (M142) and the one schedule parser
hydo-engine-proto = { workspace = true }
hydo-schedule = { workspace = true }
# the engine's options, read once by the program's main (M144)
hydo-config = { workspace = true }

[[bin]]
name = "hydo-hvm"
path = "src/bin/hydo-hvm.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false
