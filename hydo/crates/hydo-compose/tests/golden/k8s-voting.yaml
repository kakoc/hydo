# Generated by hydo k8s from the manifests in ../m/voting.
# A STARTING POINT: the services, images, readiness checks and volumes come from the
# manifests; the workload and the invariant below are placeholders (search for TODO).
# docs/design/k8s-import.md (`hydo guide workflow`, "From Kubernetes manifests") explains every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. delete workload.run and the TODO invariant below (keep workload.steps and
#    workload.timeout), and write the test as commands in hydo/workload/ and hydo/checks/
#    (or a test: section): hydo guide workflow
# 3. hydo build hydo.yaml
#
# WARNINGS (also printed by hydo k8s):
# - Service result: port 8081 goes to the container's port 80; hydo has no proxy between them, so a client must use result:80 (or make the program listen on 8081)
# - Service vote: port 8080 goes to the container's port 80; hydo has no proxy between them, so a client must use vote:80 (or make the program listen on 8080)
# - pod worker, container worker: no readiness probe and no port: readiness is just `started`; write a ready: check
# - service db: image postgres:15-alpine is not pinned by digest (--no-resolve)
# - service redis: image redis:alpine is not pinned by digest (--no-resolve)
# - service result: image dockersamples/examplevotingapp_result is not pinned by digest (--no-resolve)
# - service vote: image dockersamples/examplevotingapp_vote is not pinned by digest (--no-resolve)
# - service worker: image dockersamples/examplevotingapp_worker is not pinned by digest (--no-resolve)
#
# Notes:
# - Service result is a NodePort: there are no nodes or load balancers in hydo; clients in the guest use the name result
# - Service vote is a NodePort: there are no nodes or load balancers in hydo; clients in the guest use the name vote
# - service redis: volume redis-redis-data on /data: the data disk also holds another service's volume, so it is mounted as this service's /data
format: 1
name: voting
description: "imported from the manifests in ../m/voting (5 services); TODO: what is tested"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 1536   # a guess: 1504 MiB for the services and the kernel; raise it if a service runs out
  clock_start: 1794096000   # 2026-11-08 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1536   # the data disk: every volume lives here (the fault target)
  dirs: [vol/db-db-data, vol/redis-redis-data]

root:
  text:
    /etc/hosts: |   # Kubernetes Service and pod names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 db db.default db.default.svc db.default.svc.cluster.local
      10.89.0.12 redis redis.default redis.default.svc redis.default.svc.cluster.local
      10.89.0.13 result result.default result.default.svc result.default.svc.cluster.local
      10.89.0.14 vote vote.default vote.default.svc vote.default.svc.cluster.local
      10.89.0.15 worker

services:
  # Kubernetes Deployment db, container postgres
  # from ../m/voting/db-deployment.yaml
  # image postgres:15-alpine: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # restartPolicy Always (the default): restart: always
  # setup: an empty claim or emptyDir is mode 0777 at first, as most Kubernetes volume provisioners make it
  # ready: no probe; a TCP connect to its first port (TODO: a real readiness check if the port opens before the service can serve)
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: db
    image: {x86_64: images/postgres-15-alpine-amd64.docker.tar, arm64: images/postgres-15-alpine-arm64-oci}
    image_ref: "postgres:15-alpine"
    env:
      HOSTNAME: "db"
      DB_SERVICE_HOST: "10.89.0.11"
      DB_SERVICE_PORT: "5432"
      DB_SERVICE_PORT_DB_SERVICE: "5432"
      REDIS_SERVICE_HOST: "10.89.0.12"
      REDIS_SERVICE_PORT: "6379"
      REDIS_SERVICE_PORT_REDIS_SERVICE: "6379"
      RESULT_SERVICE_HOST: "10.89.0.13"
      RESULT_SERVICE_PORT: "80"
      RESULT_SERVICE_PORT_RESULT_SERVICE: "80"
      VOTE_SERVICE_HOST: "10.89.0.14"
      VOTE_SERVICE_PORT: "80"
      VOTE_SERVICE_PORT_VOTE_SERVICE: "80"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    port: 5432
    addr: 10.89.0.11
    setup: "mkdir -p /data/vol/db-db-data && { [ -n \"$(ls -A /data/vol/db-db-data)\" ] || chmod 0777 /data/vol/db-db-data; }"
    ready: "tcp:5432"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/db-db-data, dst: /var/lib/postgresql/data}
  # Kubernetes Deployment redis, container redis
  # from ../m/voting/redis-deployment.yaml
  # image redis:alpine: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # restartPolicy Always (the default): restart: always
  # setup: an empty claim or emptyDir is mode 0777 at first, as most Kubernetes volume provisioners make it
  # ready: no probe; a TCP connect to its first port (TODO: a real readiness check if the port opens before the service can serve)
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: redis
    image: {x86_64: images/redis-alpine-amd64.docker.tar, arm64: images/redis-alpine-arm64-oci}
    image_ref: "redis:alpine"
    env:
      HOSTNAME: "redis"
      DB_SERVICE_HOST: "10.89.0.11"
      DB_SERVICE_PORT: "5432"
      DB_SERVICE_PORT_DB_SERVICE: "5432"
      REDIS_SERVICE_HOST: "10.89.0.12"
      REDIS_SERVICE_PORT: "6379"
      REDIS_SERVICE_PORT_REDIS_SERVICE: "6379"
      RESULT_SERVICE_HOST: "10.89.0.13"
      RESULT_SERVICE_PORT: "80"
      RESULT_SERVICE_PORT_RESULT_SERVICE: "80"
      VOTE_SERVICE_HOST: "10.89.0.14"
      VOTE_SERVICE_PORT: "80"
      VOTE_SERVICE_PORT_VOTE_SERVICE: "80"
    port: 6379
    addr: 10.89.0.12
    setup: "mkdir -p /data/vol/redis-redis-data && { [ -n \"$(ls -A /data/vol/redis-redis-data)\" ] || chmod 0777 /data/vol/redis-redis-data; }"
    ready: "tcp:6379"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/redis-redis-data, dst: /data}
  # Kubernetes Deployment result, container result
  # from ../m/voting/result-deployment.yaml
  # image dockersamples/examplevotingapp_result: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # restartPolicy Always (the default): restart: always
  # ready: no probe; a TCP connect to its first port (TODO: a real readiness check if the port opens before the service can serve)
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: result
    image: {x86_64: images/dockersamples-examplevotingapp_result-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_result-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_result:latest"
    env:
      HOSTNAME: "result"
      DB_SERVICE_HOST: "10.89.0.11"
      DB_SERVICE_PORT: "5432"
      DB_SERVICE_PORT_DB_SERVICE: "5432"
      REDIS_SERVICE_HOST: "10.89.0.12"
      REDIS_SERVICE_PORT: "6379"
      REDIS_SERVICE_PORT_REDIS_SERVICE: "6379"
      RESULT_SERVICE_HOST: "10.89.0.13"
      RESULT_SERVICE_PORT: "80"
      RESULT_SERVICE_PORT_RESULT_SERVICE: "80"
      VOTE_SERVICE_HOST: "10.89.0.14"
      VOTE_SERVICE_PORT: "80"
      VOTE_SERVICE_PORT_VOTE_SERVICE: "80"
    port: 80
    addr: 10.89.0.13
    ready: "tcp:80"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Kubernetes Deployment vote, container vote
  # from ../m/voting/vote-deployment.yaml
  # image dockersamples/examplevotingapp_vote: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # restartPolicy Always (the default): restart: always
  # ready: no probe; a TCP connect to its first port (TODO: a real readiness check if the port opens before the service can serve)
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: vote
    image: {x86_64: images/dockersamples-examplevotingapp_vote-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_vote-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_vote:latest"
    env:
      HOSTNAME: "vote"
      DB_SERVICE_HOST: "10.89.0.11"
      DB_SERVICE_PORT: "5432"
      DB_SERVICE_PORT_DB_SERVICE: "5432"
      REDIS_SERVICE_HOST: "10.89.0.12"
      REDIS_SERVICE_PORT: "6379"
      REDIS_SERVICE_PORT_REDIS_SERVICE: "6379"
      RESULT_SERVICE_HOST: "10.89.0.13"
      RESULT_SERVICE_PORT: "80"
      RESULT_SERVICE_PORT_RESULT_SERVICE: "80"
      VOTE_SERVICE_HOST: "10.89.0.14"
      VOTE_SERVICE_PORT: "80"
      VOTE_SERVICE_PORT_VOTE_SERVICE: "80"
    port: 80
    addr: 10.89.0.14
    ready: "tcp:80"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Kubernetes Deployment worker, container worker
  # from ../m/voting/worker-deployment.yaml
  # image dockersamples/examplevotingapp_worker: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # restartPolicy Always (the default): restart: always
  # ready: TODO no probe and no port: `true` means started
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: worker
    image: {x86_64: images/dockersamples-examplevotingapp_worker-latest-amd64.docker.tar, arm64: images/dockersamples-examplevotingapp_worker-latest-arm64-oci}
    image_ref: "dockersamples/examplevotingapp_worker:latest"
    env:
      HOSTNAME: "worker"
      DB_SERVICE_HOST: "10.89.0.11"
      DB_SERVICE_PORT: "5432"
      DB_SERVICE_PORT_DB_SERVICE: "5432"
      REDIS_SERVICE_HOST: "10.89.0.12"
      REDIS_SERVICE_PORT: "6379"
      REDIS_SERVICE_PORT_REDIS_SERVICE: "6379"
      RESULT_SERVICE_HOST: "10.89.0.13"
      RESULT_SERVICE_PORT: "80"
      RESULT_SERVICE_PORT_RESULT_SERVICE: "80"
      VOTE_SERVICE_HOST: "10.89.0.14"
      VOTE_SERVICE_PORT: "80"
      VOTE_SERVICE_PORT_VOTE_SERVICE: "80"
    addr: 10.89.0.15
    ready: "true"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}

# TODO(workload): one step = one client operation against the system (an HTTP request, a
# query), appended to $HYDO_ACKED only when the system acknowledged it. Faults are placed
# at step numbers. Each Kubernetes Service and pod name resolves (e.g. db -> 10.89.0.11); run tools inside
# an image with `hydo-oci <service> <command>`. Ask the onboard skill (/hydo:onboard) to write it.
workload:
  steps: 20
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      # TODO: one operation, e.g.
      #   wget -q -T 5 -O /dev/null --post-data "id=$i" http://db:5432/ && echo $i >> $HYDO_ACKED
      echo "hydo-compose: TODO write the workload (hydo.yaml)" > /dev/console; exit 1
      i=$((i + 1))
    done
  timeout: 300

