# Generated by hydo k8s from ../m/cluster.yaml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the
# manifests; the workload and the invariant below are placeholders (search for TODO).
# docs/design/k8s-import.md (`hydo guide workflow`, "From Kubernetes manifests") explains every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. delete workload.run and the TODO invariant below (keep workload.steps and
#    workload.timeout), and write the test as commands in hydo/workload/ and hydo/checks/
#    (or a test: section): hydo guide workflow
# 3. hydo build hydo.yaml
#
# WARNINGS (also printed by hydo k8s):
# - NetworkPolicy kv: not imported; isolation between pods is not modelled: every service reaches every other; hydo's network faults (N=, O=) cut links on purpose instead
# - Ingress api: not imported; there is no ingress controller in hydo: the workload reaches the Services by their names
# - Deployment api: replicas: 2: one pod is imported (the pods of a Deployment are alike, and a Service name resolves to one address in hydo, without load balancing); copy the service for more
# - Service api: port 80 goes to the container's port 8080; hydo has no proxy between them, so a client must use api:8080 (or make the program listen on 80)
# - StatefulSet kv: affinity: scheduling does not apply, hydo runs every pod on one machine; ignored
# - service kv-0-init-volume-permissions: image busybox:1.36 is not pinned by digest (--no-resolve)
# - service kv-0: image registry.example.com/kv/server:2.1 is not pinned by digest (--no-resolve)
# - service kv-1-init-volume-permissions: image busybox:1.36 is not pinned by digest (--no-resolve)
# - service kv-1: image registry.example.com/kv/server:2.1 is not pinned by digest (--no-resolve)
# - service kv-2-init-volume-permissions: image busybox:1.36 is not pinned by digest (--no-resolve)
# - service kv-2: image registry.example.com/kv/server:2.1 is not pinned by digest (--no-resolve)
# - service api: image registry.example.com/kv/api:2.1 is not pinned by digest (--no-resolve)
#
# Notes:
# - ServiceAccount kv: ignored; there is no API server in hydo, so service accounts and their tokens are not needed
# - Pod kv-test-connection: a Helm test, left out; its command can become a check (hydo/checks/)
# - Service kv-headless selects 3 pods (kv-0, kv-1, kv-2): the name kv-headless resolves to the first; there is no load balancing in hydo
# - Service api is a LoadBalancer: there are no nodes or load balancers in hydo; clients in the guest use the name api
# - pod kv-0, container kv: volume tmp on /tmp is not mounted: an image's /tmp is the guest's, shared by every service
# - pod kv-1, container kv: volume tmp on /tmp is not mounted: an image's /tmp is the guest's, shared by every service
# - pod kv-2, container kv: volume tmp on /tmp is not mounted: an image's /tmp is the guest's, shared by every service
format: 1
name: cluster
description: "imported from ../m/cluster.yaml (7 services); TODO: what is tested"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 2048   # a guess: 2048 MiB for the services and the kernel; raise it if a service runs out
  clock_start: 1794096000   # 2026-11-08 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1024   # the data disk: every volume lives here (the fault target)
  dirs: [vol/data-kv-0, vol/data-kv-1, vol/data-kv-2]

root:
  files:                 # bind-mount sources, copied into the read-only root
    - {src: k8s-import/configmap/kv-scripts-9ad8008c, dst: /etc/hydo/compose/bind/0-kv-scripts-9ad8008c}
  text:
    /etc/hosts: |   # Kubernetes Service and pod names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 kv-0-init-volume-permissions
      10.89.0.12 kv-0 kv-headless kv-headless.default kv-headless.default.svc kv-headless.default.svc.cluster.local kv-0.kv-headless kv-0.kv-headless.default kv-0.kv-headless.default.svc kv-0.kv-headless.default.svc.cluster.local
      10.89.0.13 kv-1-init-volume-permissions
      10.89.0.14 kv-1 kv-1.kv-headless kv-1.kv-headless.default kv-1.kv-headless.default.svc kv-1.kv-headless.default.svc.cluster.local
      10.89.0.15 kv-2-init-volume-permissions
      10.89.0.16 kv-2 kv-2.kv-headless kv-2.kv-headless.default kv-2.kv-headless.default.svc kv-2.kv-headless.default.svc.cluster.local
      10.89.0.17 api api.default api.default.svc api.default.svc.cluster.local
  # kv_0_init_volume_permissions, kv_1_init_volume_permissions and kv_2_init_volume_permissions
  # run one image, busybox:1.36.
  # kv_0, kv_1 and kv_2 run one image, registry.example.com/kv/server:2.1.
  # They share one unpacked copy of their image in the root, each service with its own
  # /tmp and mounts. false gives each service a copy of its own, and on the Mac the root
  # lives in the guest's RAM (MANIFEST.md, "root").
  share_images: true

services:
  # Kubernetes StatefulSet kv, pod kv-0 (replica 1 of 3), init container volume-permissions
  # from kv/templates/statefulset.yaml
  # image busybox:1.36: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # setup: the volumes become group 1001's (securityContext.fsGroup), as Kubernetes does; an empty claim or emptyDir is mode 0777 at first
  # a one-shot job: it idles here, its command runs in the setup: of each service that waits for it (before the service's own command, once per boot), and job: true keeps the explorer's faults off it
  - name: kv_0_init_volume_permissions
    image: {x86_64: images/busybox-1.36-amd64.docker.tar, arm64: images/busybox-1.36-arm64-oci}
    image_ref: "busybox:1.36"
    entrypoint: [/.hydo/busybox, sleep, "2147483647"]
    env:
      HOSTNAME: "kv-0"
      API_SERVICE_HOST: "10.89.0.17"
      API_SERVICE_PORT: "8080"
    user: "0"
    addr: 10.89.0.11
    setup: "mkdir -p /data/vol/data-kv-0 && { [ -n \"$(ls -A /data/vol/data-kv-0)\" ] || chmod 0777 /data/vol/data-kv-0; } && chgrp -R 1001 /data/vol/data-kv-0 && chmod -R g+rwX /data/vol/data-kv-0"
    ready: "true"
    job: true   # a one-shot job: never a fault target (MANIFEST.md "One-shot jobs")
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/data-kv-0, dst: /var/lib/kv}
  # Kubernetes StatefulSet kv, pod kv-0 (replica 1 of 3), container kv
  # from kv/templates/statefulset.yaml
  # image registry.example.com/kv/server:2.1: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
  # env_file: KV_PASSWORD come from Secrets; their values are in k8s-import/secrets/, which version control ignores
  # restartPolicy Always (the default): restart: always
  # resources.limits.cpu 250m: not modelled; a CPU limit's effect is a pause of the workload (P=workload, hydo guide faults)
  # livenessProbe: not modelled; hydo does not restart a service whose probe fails (restart: covers a process that ends)
  # setup: the volumes become group 1001's (securityContext.fsGroup), as Kubernetes does; an empty claim or emptyDir is mode 0777 at first
  # ready: from the readinessProbe's exec command, run inside the image
  # restart: always: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: kv_0
    image: {x86_64: images/registry.example.com-kv-server-2.1-amd64.docker.tar, arm64: images/registry.example.com-kv-server-2.1-arm64-oci}
    image_ref: "registry.example.com/kv/server:2.1"
    entrypoint: [/bin/sh]
    cmd: [/scripts/start.sh]
    env:
      HOSTNAME: "kv-0"
      API_SERVICE_HOST: "10.89.0.17"
      API_SERVICE_PORT: "8080"
      KV_POD: "kv-0"
    env_file: "k8s-import/secrets/kv-0.env"   # values kept out of this file (MANIFEST.md "Values from a file")
    user: "1001:1001"
    port: 7000
    addr: 10.89.0.12
    depends_on: [kv_0_init_volume_permissions]
    setup: "{ mkdir -p /data/vol/data-kv-0 && { [ -n \"$(ls -A /data/vol/data-kv-0)\" ] || chmod 0777 /data/vol/data-kv-0; } && chgrp -R 1001 /data/vol/data-kv-0 && chmod -R g+rwX /data/vol/data-kv-0; } && { [ -f /tmp/hydo/job.kv_0_init_volume_permissions.done ] || { hydo-oci kv_0_init_volume_permissions /bin/sh -ec 'mkdir -p /var/lib/kv/log' && : > /tmp/hydo/job.kv_0_init_volume_permissions.done; }; }"
    ready: "timeout 5 hydo-oci kv_0 /.hydo/busybox chpst -u 1001:1001 /bin/sh /scripts/ready.sh"
    ready_timeout: 120
    restart: "always"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/data-kv-0, dst: /var/lib/kv}
      - {src: /etc/hydo/compose/bind/0-kv-scripts-9ad8008c, dst: /scripts}
  # Kubernetes StatefulSet kv, pod kv-1 (replica 2 of 3), init container volume-permissions
  # from kv/templates/statefulset.yaml
