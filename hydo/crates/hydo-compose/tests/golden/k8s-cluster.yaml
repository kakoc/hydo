    setup: "mkdir -p /data/vol/data-kv-1 && { [ -n \"$(ls -A /data/vol/data-kv-1)\" ] || chmod 0777 /data/vol/data-kv-1; } && chgrp -R 1001 /data/vol/data-kv-1 && chmod -R g+rwX /data/vol/data-kv-1"
