      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/data-kv-1, dst: /var/lib/kv}
  # Kubernetes StatefulSet kv, pod kv-1 (replica 2 of 3), container kv
  # from kv/templates/statefulset.yaml
  # image registry.example.com/kv/server:2.1: NOT resolved to a digest (--no-resolve); fetch-images.sh fetches the tag, which can change
