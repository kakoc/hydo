    user: "1001:1001"
    port: 7000
    addr: 10.89.0.14
    depends_on: [kv_1_init_volume_permissions]
    setup: "{ mkdir -p /data/vol/data-kv-1 && { [ -n \"$(ls -A /data/vol/data-kv-1)\" ] || chmod 0777 /data/vol/data-kv-1; } && chgrp -R 1001 /data/vol/data-kv-1 && chmod -R g+rwX /data/vol/data-kv-1; } && { [ -f /tmp/hydo/job.kv_1_init_volume_permissions.done ] || { hydo-oci kv_1_init_volume_permissions /bin/sh -ec 'mkdir -p /var/lib/kv/log' && : > /tmp/hydo/job.kv_1_init_volume_permissions.done; }; }"
    ready: "timeout 5 hydo-oci kv_1 /.hydo/busybox chpst -u 1001:1001 /bin/sh /scripts/ready.sh"
