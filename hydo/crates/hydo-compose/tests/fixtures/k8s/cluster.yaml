# A small rendered chart for the golden test of hydo k8s (Milestone 243): a key-value store as a
# StatefulSet of three replicas behind a headless Service, its scripts and settings in ConfigMaps,
# its password in a Secret, an init container, and an API Deployment that names the store.
---
# Source: kv/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kv-auth
type: Opaque
data:
  password: czNjcjN0LXBhc3N3b3Jk
---
# Source: kv/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kv-scripts
data:
  start.sh: |
    #!/bin/sh
    exec kv-server --data /var/lib/kv --peers kv-0.kv-headless,kv-1.kv-headless,kv-2.kv-headless
  ready.sh: |
    #!/bin/sh
    kv-cli -h 127.0.0.1 ping
---
# Source: kv/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kv
spec:
  podSelector: {}
---
# Source: kv/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv
---
# Source: kv/templates/headless.yaml
apiVersion: v1
kind: Service
metadata:
  name: kv-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kv
  ports:
    - name: client
      port: 7000
      targetPort: client
---
# Source: kv/templates/api-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 80
      targetPort: 8080
---
# Source: kv/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv
spec:
  replicas: 3
  serviceName: kv-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: kv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv
    spec:
      securityContext:
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: [/bin/sh, -ec, "mkdir -p /var/lib/kv/log"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/kv
      containers:
        - name: kv
          image: registry.example.com/kv/server:2.1
          command: [/bin/sh]
          args: [/scripts/start.sh]
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
          env:
            - name: KV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kv-auth
                  key: password
            - name: KV_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 7000
          readinessProbe:
            exec:
              command: [/bin/sh, /scripts/ready.sh]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: client
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: data
              mountPath: /var/lib/kv
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
              subPath: tmp
      volumes:
        - name: scripts
          configMap:
            name: kv-scripts
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Source: kv/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: registry.example.com/kv/api:2.1
          env:
            - name: KV_ADDR
              value: kv-headless.default.svc.cluster.local:7000
            - name: KV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kv-auth
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
---
# Source: kv/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: kv-test-connection
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: [wget, api:80]
---
# Source: kv/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  rules:
    - host: kv.example.com
