[package]
name = "hydo-agents"
description = "hydo's AI-facing commands: hydo guide, hydo skill install, hydo init (the onboarding skill is built in)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/build.rs", "/embed/**"]
build = "build.rs"

[dependencies]
hydo-manifest = { workspace = true }
regex = "1"
# the skill's release archive (src/release.rs, Milestone 170): the same versions and features as
# hydo-cli's, so no crate is added to the program
tar = { version = "0.4", default-features = false }
flate2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
