[package]
name = "hydo-hvx"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "The hvx run engine in Rust: drives /dev/hvx through its ioctls (hv/hvx/hvx_abi.h); in-process or as the hydo-hvx program (the C hvx_explore's command line and protocol)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md", "/build.rs", "/pt/**"]
build = "build.rs"

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[features]
# coverage decoding with libipt (pt/ptedges.c; Linux, libipt-dev): off by default, so the default
# build needs no libipt. Without it a traced run still writes its stats, with edges=-1.
pt = ["dep:cc"]

[dependencies]
hydo-config = { workspace = true }
libc = "0.2"
hydo-schedule = { workspace = true }
hydo-engine-proto = { workspace = true }

[build-dependencies]
cc = { version = "1", optional = true }

[[bin]]
name = "hydo-hvx"
path = "src/bin/hydo-hvx.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dev-dependencies]
sha2 = { workspace = true }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
