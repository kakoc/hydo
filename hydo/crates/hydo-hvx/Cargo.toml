[package]
name = "hydo-hvx"
description = "The hvx run engine in Rust: drives /dev/hvx through its ioctls (hv/hvx/hvx_abi.h); hvx_explore's protocol, in-process or as the hydo-hvx program"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"

[[bin]]
name = "hydo-hvx"
path = "src/bin/hydo-hvx.rs"
