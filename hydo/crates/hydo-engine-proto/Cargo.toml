[package]
name = "hydo-engine-proto"
description = "The calls between hydo and its run engines as Rust types (requests, host commands, engine messages, results) and their one text form, the engines' line protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
hydo-schedule = { workspace = true }
