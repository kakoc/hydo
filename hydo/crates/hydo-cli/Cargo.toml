# The package is named `hydo` (the crates.io name, so that `cargo install hydo` installs the `hydo`
# command); its directory keeps the name hydo-cli (docs/PUBLISHING.md).
[package]
name = "hydo"
description = "Deterministic fault testing of whole systems: runs unmodified services in a deterministic hypervisor (Apple Silicon, x86_64 Linux) under process kills, pauses, network faults, power cuts, clock jumps and disk faults, and replays every failure bit for bit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["testing", "deterministic", "fault-injection", "hypervisor", "simulation"]
categories = ["development-tools::testing", "command-line-utilities"]
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/pins/**", "/README.md"]

[[bin]]
name = "hydo"
path = "src/main.rs"

[dependencies]
hydo-config = { workspace = true }
hydo-schedule = { workspace = true }
hydo-manifest = { workspace = true }
hydo-engine = { workspace = true }
hydo-kvm = { workspace = true }
hydo-explore = { workspace = true }
hydo-composer = { workspace = true }
hydo-errors = { workspace = true }
hydo-agents = { workspace = true }
hydo-compose = { workspace = true }
hydo-history = { workspace = true }
hydo-build = { workspace = true }
hydo-results = { workspace = true }
hydo-image = { workspace = true }
hydo-control = { workspace = true }
serde_json = { workspace = true }

libc = "0.2"

[dev-dependencies]
sha2 = { workspace = true }
