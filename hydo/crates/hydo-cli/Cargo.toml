[package]
name = "hydo-cli"
description = "The hydo command: one CLI over both engines (hvx on Linux, hvm on the Mac)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hydo"
path = "src/main.rs"

[dependencies]
hydo-config = { workspace = true }
hydo-schedule = { workspace = true }
hydo-manifest = { workspace = true }
hydo-engine = { workspace = true }
hydo-kvm = { workspace = true }
hydo-explore = { workspace = true }
hydo-composer = { workspace = true }
hydo-errors = { workspace = true }
hydo-agents = { workspace = true }
hydo-compose = { workspace = true }
hydo-history = { workspace = true }
hydo-build = { workspace = true }
hydo-results = { workspace = true }
hydo-image = { workspace = true }
hydo-control = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
# the install cache (src/fetch.rs, src/cache.rs, Milestone 162): the same versions and features
# as hydo-compose's, which is compiled into hydo already, so no crate is added to the program
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

libc = "0.2"

[dev-dependencies]
sha2 = { workspace = true }
