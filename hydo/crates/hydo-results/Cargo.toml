[package]
name = "hydo-results"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo's results format: the run and exploration documents, the exploration's event stream, the lenient reader and the generated JSON Schema"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false
# no unit test, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"

[dev-dependencies]
hydo-schema-compat = { path = "../hydo-schema-compat" }


# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
