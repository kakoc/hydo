[package]
name = "hydo-results"
description = "hydo's results format: the run and exploration documents, the exploration's event stream, the lenient reader and the generated JSON Schema"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"

[dev-dependencies]
hydo-schema-compat = { path = "../hydo-schema-compat" }

