# hydo-agent-proto: the protocol between hydo's host and hydo-agent, the guest's first process
# (docs/design/guest-control.md; docs/HISTORY.md M117).
#
# No dependencies, on purpose: the guest agent (hydo/crates/hydo-agent, std and libc only, its own
# workspace and lock file because its bytes are inside guest images) compiles this crate into
# itself, so the host and the agent read and write lines with the same code. The fields are written
# out here rather than inherited from the workspace, so that the agent's workspace reads this file
# on its own.
[package]
name = "hydo-agent-proto"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo's host-agent protocol: messages, canonical JSON, console framing, the host session with the version rule, the generated schema and the example transcripts"
readme = "README.md"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/kakoc/hydo"
homepage = "https://github.com/kakoc/hydo"
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests, the
# example transcripts they check and the schema stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]

[dev-dependencies]
hydo-schema-compat = { path = "../hydo-schema-compat" }
serde_json = { version = "1", features = ["preserve_order"] }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
