[package]
name = "hydo-bench"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "The bug benchmark runner: how well the explorer's strategies find the planted defects d0-d12 of hydo/bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published to crates.io: `cargo install hydo` does not need it (docs/PUBLISHING.md).
publish = false

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false
path = "src/lib.rs"

# A development tool, not part of either release: the benchmark images are built on the build
# machine from the project's own order service (hydo/bench/README.md), so no user has them.
[[bin]]
name = "hydo-bench"
path = "src/bin/hydo-bench.rs"
# no unit test of its own, so no test program (hydo-release tests/test_tiers.rs checks it)
test = false

[dependencies]
hydo-config = { workspace = true }
hydo-explore = { workspace = true }
hydo-engine = { workspace = true }
hydo-control = { workspace = true }
hydo-manifest = { workspace = true }
hydo-image = { workspace = true }
hydo-results = { workspace = true }
serde_json = { workspace = true }
regex = "1"
sha2 = { workspace = true }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
