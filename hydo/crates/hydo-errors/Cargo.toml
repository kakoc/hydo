[package]
name = "hydo-errors"
description = "Error logs as findings, host side: error kinds and signatures from a run's consoles, the known list hydo/known-errors.yaml, and hydo errors list|accept|check"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[dependencies]
hydo-manifest = { workspace = true }
hydo-results = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
fancy-regex = "0.16"
libc = "0.2"
