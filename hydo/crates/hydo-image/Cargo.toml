[package]
name = "hydo-image"
# every tests/<name>.rs is a module of the one test program `it` (tests/main.rs,
# ci/consolidate-tests.sh)
autotests = false
description = "hydo's image record: what shapes an image's runs but is not inside it (the guest kernel by sha256, the fingerprint epoch) in /etc/hydo/image.json, and the build record <image>.json next to it; the kernels this hydo knows and how a run finds the one an image names"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md", "/build.rs", "/pins/**"]
build = "build.rs"

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
schemars = "1"

[dev-dependencies]
hydo-schema-compat = { path = "../hydo-schema-compat" }

# the integration tests, one program (ci/consolidate-tests.sh)
[[test]]
name = "it"
path = "tests/main.rs"
