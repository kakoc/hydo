# hydo-control: the host-side controller of guest control (docs/design/guest-control.md, step B1;
# docs/HISTORY.md M120). Nothing calls it yet: the engines' callers start using it in step C1.
[package]
name = "hydo-control"
description = "hydo's host controller for agent images: the Controller trait, the ScheduleController that runs today's schedules through hydo-agent's commands, the control transcript and its replay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# What is published to crates.io (docs/PUBLISHING.md): the sources only; the tests and their
# recorded answers stay in the repository.
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[lib]
# no documentation example to test (hydo-release tests/test_tiers.rs checks it stays so)
doctest = false

[dependencies]
hydo-config = { workspace = true }
hydo-agent-proto = { workspace = true }
hydo-schedule = { workspace = true }
hydo-manifest = { workspace = true }
hydo-engine = { workspace = true }
hydo-results = { workspace = true }
hydo-composer = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# the error-log scan's POSIX expressions (M123): leftmost-longest needs regex-automata's DFA
regex = "1"
regex-automata = "0.4"

[dev-dependencies]
# Path only (no version), so they are left out of the published manifest: hydo-explore depends on
# this crate, and a versioned dev-dependency cycle cannot be published (docs/PUBLISHING.md).
hydo-explore = { path = "../hydo-explore" }
hydo-errors = { path = "../hydo-errors" }
hydo-history = { path = "../hydo-history" }
flate2 = { workspace = true }
# tests/fakes.rs and tests/features.rs: the init, manifest.sh and compose.list hydo-build writes
hydo-build = { path = "../hydo-build" }
