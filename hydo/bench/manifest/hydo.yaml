# The bug benchmark's guest as a hydo manifest (Milestone 129, docs/C2-BENCH.md).
#
# The benchmark images (hydo/bench/build-bench*.sh) run the four-service stack under its own
# hand-written init (hv/hvx/images/build-stack.sh's /sbin/init and /etc/stack-explore.sh), which
# the host controller cannot drive: it drives manifests. This manifest describes the same guest
# so that `hydo build` and `hydo build --control agent` give a shell image and an agent image of
# each defect, built by the same builder from the same files:
#   - the files are those of the -pin-kr control image (explore-bench-m59-control-pin-kr), dumped
#     to ./root by hydo/bench/build-bench-manifest.sh: the MySQL and OpenJDK closures (./store:
#     that image's /nix/store without the iproute2 closure, which hydo-build stages itself from
#     the same pinned path), Kafka's libs and the pinned Redis; ./front-door is the defect's order
#     service (/bin/hydostack of its benchmark image);
#   - the configuration is build-stack.sh's: the same my.cnf (skip-log-bin, as the benchmark
#     images have it) with the line the init appends (innodb_flush_log_at_trx_commit=1), the same
#     Kafka properties with log.retention.ms=-1 (the -pin-kr fix) and the appended
#     log.flush.interval.messages=1, Redis with appendfsync always;
#   - stack-explore.sh's tokens that the generic init does not have are knobs here: Q=<n>[d]
#     (client concurrency, every order twice with d) and M= sets sync_binlog=0 as well as the redo
#     log setting, as stack-explore.sh does. X= (the stack's timed kill) is driven by the host
#     controller only (hydo-control HANDOFF.md decision 12; the shell init ignores it);
#   - the oracle is stack-explore.sh's (`hydostack oracle`), and the M59 crash oracle (the order
#     service must not panic, hydo-bench's crash_verdict) is the second invariant;
#   - stack-explore.sh's M67 path (an order service that cannot come back after the workload, for
#     example after a cf= power cut when MySQL's sessions hang on the dead disk: the un-ACKed
#     orders stay un-ACKed, there is no retry, and the power cut's recovery boot gives the verdict;
#     without a cut the run ends in ERROR) is written with the format's existing features
#     (Milestone 135): the order service runs under /etc/hydo-bench/front.sh, which stays up and
#     says so when the order service exits after the workload's last step; its ready: accepts
#     that line, the retry: skips the retry pass then, and the invariant front.restarted gives the
#     ERROR when the run ends without a cut. The format has no key for "a restart that may fail"
#     (docs/HISTORY.md "Milestone 135");
#   - buggify: true, so B= reaches the order service's BUGGIFY points as on the stack images
#     (stack-explore.sh writes /tmp/hydo-buggify too).
# Since M135 these images are the benchmark's default (hydo-bench --kind agent; --kind shell for the
# shell images); the stack images stay only as the engine's regression baselines. What stays
# different from the stack images: the generic init's workload loop, restarts and markers instead
# of stack-explore.sh's (for example a restart of every dead service before the retry pass, and no
# periodic checks), so fingerprints and some timings differ from M54-M108's.
format: 1
name: bench
description: the bug benchmark's stack guest (MySQL, Kafka, Redis, the order service) as a manifest
buggify: true

