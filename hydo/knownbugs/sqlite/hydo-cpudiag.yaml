# Diagnostic copy of hydo.yaml (SMP sanity, see README "Several vCPUs"): the same walrace
# binary and invariant, but the workload step also prints, on the console, the guest's
# per-CPU time counters before and after the step and which CPU each walrace thread was
# seen on (field 39 of /proc/<pid>/task/<tid>/stat, sampled while the step runs). Not used
# for the hunt; it only shows that walrace's threads run on more than one CPU.
#   hvx/onboard/hydo-build hvx/knownbugs/sqlite/hydo-cpudiag.yaml
name: kb-sqlite-cpudiag-{{v}}
description: SQLite {{v}} walrace with per-CPU diagnostics on the console.

params:
  v: "3510200"

root:
  files:
    - {src: bin/walrace-{{v}}, dst: /bin/walrace, mode: "0755"}

data:
  size_mib: 256
  dirs: [db]

services: []

workload:
  steps: 4
  run: |
    grep '^cpu' /proc/stat | sed "s/^/hydo-cpudiag: step $HYDO_FROM before: /" > /dev/console
    /bin/walrace run /data/db/t.db $HYDO_ACKED $HYDO_OUTCOMES $HYDO_FROM $HYDO_TO &
    p=$!
    n=0
    while [ $n -lt 200 ] && [ -d /proc/$p ]; do
      for t in /proc/$p/task/*; do
        [ -r $t/stat ] && echo "${t##*/} $(cut -d' ' -f39 $t/stat 2>/dev/null)"
      done
      n=$((n+1))
    done > /tmp/cpudiag.$HYDO_FROM
    wait $p
    rc=$?
    awk -v s=$HYDO_FROM 'NF==2 && $2!="" { n[$2]++; seen[$1" "$2]=1 }
      END { for (c in n) printf "hydo-cpudiag: step %s samples on cpu%s: %d\n", s, c, n[c];
            for (k in seen) { split(k, a, " "); cpus[a[1]] = cpus[a[1]] " " a[2] }
            both=0; tot=0; for (t in cpus) { tot++; if (cpus[t] ~ / 0/ && cpus[t] ~ / 1/) both++ }
            printf "hydo-cpudiag: step %s threads sampled: %d, seen on both cpu0 and cpu1: %d\n", s, tot, both }' \
      /tmp/cpudiag.$HYDO_FROM > /dev/console
    grep '^cpu' /proc/stat | sed "s/^/hydo-cpudiag: step $HYDO_FROM after: /" > /dev/console
    exit $rc
  timeout: 900
  process: walrace

knobs:
  - token: S
    name: workload seed (writer count, transaction sizes, checkpoint modes, autocheckpoint)
    default: "0"
    set: echo $HYDO_VALUE > /tmp/walrace.seed

invariants:
  - id: sqlite.committed_durable_and_intact
    msg: every committed write is present with its value and PRAGMA integrity_check is ok
    cmd: /bin/walrace check /data/db/t.db $HYDO_ACKED

faults: [clock]
