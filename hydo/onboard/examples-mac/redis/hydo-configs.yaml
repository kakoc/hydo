# The Mac Redis example (hydo.yaml beside this file) with Redis's appendfsync as a setting that
# hydo explores (Milestone 299): `hydo explore --configs hydo-configs.yaml` builds one image per
# value (always, everysec, no), explores each with the same seeds, and says which values lose
# acknowledged writes under which faults. The knob R= of hydo.yaml changes the same setting at
# run time; here it is a build parameter, so each image starts with its own value.
# Build one value by hand:  hydo build hydo-configs.yaml --set appendfsync=everysec
format: 1
name: redis
description: Redis with an append-only file and appendfsync as a build parameter; every acknowledged SET must survive.

params:
  appendfsync: always

configs:
  appendfsync:
    values: [always, everysec, "no"]
    service: redis
    doc: "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"
    tradeoff:
      everysec: "fsync every second: Redis's documentation says you may lose 1 second of data if there is a disaster"
      "no": "never fsync, the operating system flushes the data: Redis's documentation calls it the faster and less safe method"

