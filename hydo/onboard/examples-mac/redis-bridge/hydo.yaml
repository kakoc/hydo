# The hvx/onboard/examples/redis-bridge manifest for the Mac backend (Milestone 99): the same two
# Redis servers in their own network namespaces, both on port 6379, the same proxy, workload and
# invariants, with the aarch64-linux Redis 7.2.4 of ../redis/hydo.yaml (the nixpkgs binary cache;
# a Mac release has these files under examples/redis/files). network: bridge makes
# `hydo-build --arch arm64` build the image for the second guest kernel, Image-explore-netns
# (hvx-mac/explore/build-guest-netns.sh), and record that in the image (/etc/hydo/kernel).
# Build (Mac release, from a copy whose srcs point at examples/redis/files):  hydo build hydo.yaml
# Try:  disk=none | run                                    -> OK, lag 0 after every step
#       disk=none | run N=primary-replica@5-10:loss,100%   -> OK; the replica falls behind, catches up
#       disk=none | run O=primary-replica@5-10:req:loss,100%  -> OK; only primary -> replica dropped
#       disk=none | run K=replica@5+3                      -> OK; the replica resyncs after its restart
#       disk=cut | run C=8                                 -> OK; both servers recover in their namespaces
#       disk=none | run F=replica<primary@5#3:2000         -> OK; the replica frozen at a replication packet
name: redis-bridge
description: A Redis primary and replica in their own network namespaces; every acknowledged SET survives on the primary and reaches the replica.

network: bridge

