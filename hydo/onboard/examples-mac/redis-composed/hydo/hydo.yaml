# examples/redis-composed for the Mac backend (hvx-mac): the same plan, the same hydo/ folder
# (workload/, checks/, regressions/ are symlinks to hvx/onboard/examples/redis-composed/hydo/),
# with the aarch64-linux Redis 7.2.4 of hvx-mac/explore/examples/redis. Build on the Linux box:
#   hvx/onboard/hydo-build <this> --arch arm64 --build-dir <dir>      (--set transfer=racy: the race)
name: redis-composed
description: Redis with an append-only file, driven by composed commands (SETs, transfers, AOF rewrites).
hydo_version: "0.3"
format: 1

