    - {src: /nix/store/ywz8lg1h600a888z67hpj632b8gri6wx-zstd-1.5.6/lib/libzstd.so.1.5.6, dst: /nix/store/ywz8lg1h600a888z67hpj632b8gri6wx-zstd-1.5.6/lib/libzstd.so.1.5.6}
  text:
    /etc/redis.conf: |
      port 6379
      bind 127.0.0.1
      dir /data/redis
      save ""
      appendonly yes
      appendfsync always
      hz 1
      dynamic-hz no

data:
  size_mib: 64
  dirs: [redis]

env:
  TRANSFER: atomic                # racy: the lost-update race (arm64 builds take no params:)
  ACCOUNTS: "5"
  TOTAL: "500"

services:
  - name: redis
    cmd: /bin/redis-server /etc/redis.conf
    ready: /bin/redis-cli ping | grep -q PONG
    port: 6379

workload:
  steps: 20                         # rounds of the composition; faults are placed at round numbers
  timeout: 120

test:
  parallel: 4                       # at most 4 commands at once (W= draws p in 1..4)
  per_round: 2                      # parallel drivers started per round (W= draws q in 1..2)
  round_ms: 100                     # a round every 100 ms of guest time (W= draws r: 50, 100 or 200)
  command_timeout: 20
  drain_timeout: 30

knobs:
  - token: R
    name: Redis appendfsync
    default: always
    values: [always, everysec, "no"]
    set: /bin/redis-cli CONFIG SET appendfsync $HYDO_VALUE

faults: [kill, pause, cut, clock, disk]
