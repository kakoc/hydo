# The keys of the image's conf/broker.conf that the two brokers change (pconf.sh). Each broker's
# address and the ack quorum come from its command (advertisedAddress, managedLedgerDefaultAckQuorum).
metadataStoreUrl=zk:zk1:2181,zk2:2181,zk3:2181
configurationMetadataStoreUrl=zk:zk1:2181,zk2:2181,zk3:2181
clusterName=c1
# every entry on 3 bookies (the durable settings of the documentation)
managedLedgerDefaultEnsembleSize=3
managedLedgerDefaultWriteQuorum=3
# producer deduplication and transactions on
brokerDeduplicationEnabled=true
transactionCoordinatorEnabled=true
# production's ledgers roll over after hours or 50,000 entries; these roll after 100 entries, so
# that a run of a minute rolls ledgers and cursor ledgers over as a long-lived topic does
managedLedgerMaxEntriesPerLedger=100
managedLedgerMinLedgerRolloverTimeMinutes=0
managedLedgerCursorMaxEntriesPerLedger=100
# keep the idle topics of the test
brokerDeleteInactiveTopicsEnabled=false
functionsWorkerEnabled=false
webSocketServiceEnabled=false
