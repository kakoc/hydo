# The keys of the image's conf/zookeeper.conf that the three ZooKeeper servers change (pconf.sh).
# Each server's data directory is a file system of its own; the server's id comes from its
# command (myid).
dataDir=/pulsar/data/zookeeper
server.1=zk1:2888:3888
server.2=zk2:2888:3888
server.3=zk3:2888:3888
admin.enableServer=false
