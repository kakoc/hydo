# The keys of the image's conf/bookkeeper.conf that the three bookies change (pconf.sh). Each
# bookie's journal and ledger directories are on a file system of its own; its address and the
# journal's sync come from its command (advertisedAddress, journalSyncData).
zkServers=zk1:2181,zk2:2181,zk3:2181
metadataServiceUri=metadata-store:zk:zk1:2181,zk2:2181,zk3:2181/ledgers
journalDirectory=/pulsar/data/bookkeeper/journal
ledgerDirectories=/pulsar/data/bookkeeper/ledgers
# small caches for a bookie of 192 MiB of heap and 160 MiB of direct memory
dbStorage_writeCacheMaxSizeMb=16
dbStorage_readAheadCacheMaxSizeMb=16
dbStorage_rocksDB_blockCacheSize=8388608
dbStorage_rocksDB_writeBufferSizeMB=8
# files that fit a file system of 384 MiB
journalMaxSizeMB=64
logSizeLimit=67108864
