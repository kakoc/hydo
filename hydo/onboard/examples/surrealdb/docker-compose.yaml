# SurrealDB 4.0.1 as its documentation starts a file-backed server: one node on SurrealKV, the
# only disk engine of 4.0, with the default sync=every (every commit synced before it returns).
services:
  surrealdb:
    image: surrealdb/surrealdb:v4.0.1
    command: ["start", "--user", "root", "--pass", "root", "--bind", "0.0.0.0:8000", "surrealkv:///data/db"]
    user: root
    ports:
      - "8000:8000"
    volumes:
      - surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  surreal-data:
