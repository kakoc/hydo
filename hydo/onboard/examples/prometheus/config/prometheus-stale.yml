# config/prometheus.yml with one more setting: the server compacts the stale series of its head
# into blocks once they are 30 % of the head's series (stale_series_compaction_threshold, off by
# default). The agent's exporter makes a new series at every scrape, so most series of the head
# turn stale a second after they start. Build with --set server_config=prometheus-stale.
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

storage:
  tsdb:
    out_of_order_time_window: 10m
    stale_series_compaction_threshold: 0.3
    retention:
      time: 1d

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
