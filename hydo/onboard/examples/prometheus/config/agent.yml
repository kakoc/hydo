# The Prometheus agent of the example: it scrapes the exporter every second and forwards every
# sample to the central server with remote write, as an agent in front of a central server does.
# The queue sends a batch at least every second.
global:
  scrape_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: exporter
    static_configs:
      - targets: ["exporter:9100"]

remote_write:
  - url: http://prometheus:9090/api/v1/write
    queue_config:
      batch_send_deadline: 1s
      min_backoff: 50ms
      max_backoff: 2s
