# A fake outside service made from an OpenAPI description (Milestone 249, `hydo guide
# outside-services`).
#
# market (src/, Go) takes orders over HTTP and pays each order's seller out through a payouts
# provider, whose API is api/payouts.yaml. The fake below is what this command wrote, unedited:
#   hydo fake from-openapi api/payouts.yaml --name payouts --port 9001 --stateful --ref json:order \
#     --add-to hydo.yaml
# One route per operation, the spec's examples and error answers, the idempotency header the spec
# declares, and save:/load: so that reading a payout back answers what the create stored.
#
# One planted bug (src/retry_buggy.go): only the first try of a create carries the idempotency key,
# so a payout that took effect but whose answer was lost is paid again by the retry. build.sh
# builds both programs.
#   disk=none | run                                                         -> OK
#   disk=none | run H=payouts.create_payout@3-4:status=500,effect=yes       -> buggy: VIOLATION
#                                       [payouts.paid_at_most_once]; fixed: OK (a replay)
name: openapi-payouts
description: a marketplace service that pays sellers out through a provider faked from its OpenAPI description.

params:
  variant: fixed                 # fixed | buggy: which market program goes into the image
  bin: "../../../../build"       # where build.sh put market-fixed and market-buggy

guest:
  ram_mib: 512

root:
  files:
    - {src: "{{bin}}/market-{{variant}}", dst: /bin/market, mode: "0755"}

services:
  - name: market
    cmd: /bin/market server
    ready: tcp:8080
    port: 8080

workload:
  steps: 8                       # step i: place order i
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      if market place $i 2>> /tmp/hydo/market-client.log; then echo $i >> $HYDO_ACKED; echo "$i ack" >> $HYDO_OUTCOMES
      else echo "$i unknown" >> $HYDO_OUTCOMES; fi
      i=$((i + 1))
    done
  timeout: 300
  process: market place

invariants:
  - id: payouts.paid_at_most_once
    msg: the provider paid each order's seller out at most once
    cmd: hydo-world check at-most-once payouts.create_payout
  - id: payouts.acked_order_paid
    msg: every order the service acknowledged was paid out
    cmd: hydo-world check effect-for-acked payouts.create_payout --ref 'o{id}'

faults: [kill, pause, protocol]

fakes:
  # Generated by `hydo fake from-openapi payouts.yaml --name payouts --port 9001 --stateful --ref json:order`
  # from "Payouts API" 2026-11-01 (OpenAPI 3.1.0, sha256 ac1f9d8c133b8497).
  # 3 routes. Edit it freely; `hydo guide outside-services` explains each key.
  # The routes start with the first server's path, /v1.
  # An SDK that calls https://api.payouts.example needs `tls: {hosts: [api.payouts.example]}` (--tls).
  - name: payouts
    port: 9001
    idempotency: 'header:Idempotency-Key'
    ref: 'json:order'
    routes:
      - name: create_payout
        method: POST
        path: /v1/payouts
        status: 201
        body: '{"id":"po_{seq}","object":"payout","amount":{json:amount},"currency":"{json:currency}","order":"{json:order}","status":"pending","created":1767225600}'
        idempotent: true
        save:
          key: 'po_{seq}'
          fields:
            amount: '{json:amount}'
            currency: '{json:currency}'
            order: '{json:order}'
        errors:
          '400': '{"error":{"type":"invalid_request_error","message":"amount must be a positive integer"}}'
          '409': '{"error":{"type":"idempotency_error","message":"Keys for idempotent requests can only be used with the same parameters they were first used with."}}'
          '429': '{"error":{"type":"rate_limit_error","message":"Too many requests. Try again later."}}'
          '5XX': '{"error":{"type":"api_error","message":"An error occurred on our side."}}'
        description: 'Create a payout'
      - name: get_balance
        method: GET
        path: /v1/balance
        status: 200
        body: '{"available":[{"amount":250000,"currency":"eur"}],"pending":[]}'
        description: 'Read the platform''s balance'
      - name: get_payout
        method: GET
        path: '/v1/payouts/{id}'
        status: 200
        body: '{"id":"{path:id}","object":"payout","amount":{obj:amount},"currency":"{obj:currency}","order":"{obj:order}","status":"pending","created":1767225600}'
        load: '{path:id}'
        errors:
          '404': '{"error":{"type":"invalid_request_error","message":"No such payout."}}'
          '5XX': '{"error":{"type":"api_error","message":"An error occurred on our side."}}'
        description: 'Read a payout'
