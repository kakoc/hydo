# hydo-sql's configuration (MANIFEST.md, "SQL systems"): Saleor's database as the guest reaches
# it. The `.sql` checks and `hydo rules check` read it from /hydo/workload/helper_sql.conf.
dialect postgres
endpoint db postgres://saleor:saleor@10.89.0.11:5432/saleor?sslmode=disable primary
isolation serializable
workloads
timeout_ms 5000
retries 2
