# Generated by hydo compose from ../docker-compose.yaml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the Compose
# file; the workload and the invariant below are placeholders (search for TODO). `hydo guide
# services` and MANIFEST.md, "From Docker Compose", explain every mapping.
#
# 1. sh hydo/fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. delete workload.run and the TODO invariant below (keep workload.steps and
#    workload.timeout), and write the test as commands in hydo/workload/ and hydo/checks/
#    (or a test: section): hydo guide workflow
# 3. hydo build hydo/hydo.generated.yaml
#
# Notes:
# - service redis: volume saleor_redis on /data: the data disk also holds another service's volume, so it is mounted as this service's /data
format: 1
name: saleor
description: "imported from docker-compose.yaml (5 services); TODO: what is tested"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 1536   # a guess: 1504 MiB for the services and the kernel; raise it if a service runs out
  clock_start: 1794614400   # 2026-11-14 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1792   # the data disk: every volume lives here (the fault target)
  dirs: [vol/saleor_db, vol/saleor_redis, vol/saleor_media]

root:
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 db
      10.89.0.12 redis
      10.89.0.13 migrate
      10.89.0.14 api
      10.89.0.15 worker

services:
  # Compose service db
  # image postgres:16.16-alpine3.24 = docker.io/library/postgres@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
  #   linux/amd64: sha256:a2f7e20374cd8fd8ed4a588b79549e10589bea7b1686e77922f5ac741b80b8a1
  #   linux/arm64/v8: sha256:40e58641410e030f5769096bca8372f68f243e1859c8ecdf11f227da390d514d
  # port from the image's EXPOSE [5432]
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: db
    image: {x86_64: images/postgres-16.16-alpine3.24-amd64.docker.tar, arm64: images/postgres-16.16-alpine3.24-arm64-oci}
    image_ref: "postgres:16.16-alpine3.24"
    env:
      POSTGRES_USER: "saleor"
      POSTGRES_PASSWORD: "saleor"
      POSTGRES_DB: "saleor"
    port: 5432
    addr: 10.89.0.11
    ready: "timeout 5 hydo-oci db /bin/sh -c 'pg_isready -U saleor -d saleor -h localhost -p 5432'"
    ready_timeout: 160
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/saleor_db, dst: /var/lib/postgresql/data, copy_up: true}
  # Compose service redis
  # image redis:7.4.7-alpine = docker.io/library/redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
