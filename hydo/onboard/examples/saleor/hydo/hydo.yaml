# Saleor 3.23.49 (e-commerce: a Django GraphQL API, a Celery worker with its beat scheduler,
# PostgreSQL and Redis), from `hydo compose ../docker-compose.yaml --out hydo.generated.yaml
# --images-dir images` (the raw import is hydo.generated.yaml); hand changes are marked `hand:`.
# The shop sells three variants from one warehouse, with vouchers and gift cards; customers pay
# through a payment app that Saleor calls synchronously (the fake `payments` below) or with a
# gift card (Saleor's own gift card gateway). RESULTS.md (next to this folder) says what was
# hunted and found.
#
#   sh fetch-images.sh                       # the three images by digest (network, once)
#   hydo build hydo.yaml
#   hydo run "disk=none | run"
#   hydo explore --seeds 1-20 --strategy process --new-faults
format: 1
hydo_version: "0.3"
name: saleor
description: "Saleor checkouts, payments, gift cards and refunds: every acknowledged order exists once, money moves once, gift cards and vouchers stay within their limits"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 3072   # hand: the importer guessed 1536; uvicorn's two workers, Celery's worker, its pool and beat, and PostgreSQL. 4096 ran too, but the shared bare-metal machine's out-of-memory killer ended such runs
  clock_after_cut: 60       # hand: the recovery boot continues the clock (checkout and voucher times depend on it)
  outcomes_after_cut: true  # hand: the business-result check reads $HYDO_OUTCOMES, also after a power cut
  clock_start: 1794614400   # 2026-11-14 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 768   # hand: the import gave 1792; PostgreSQL's files are 79 MiB after the migrations and a run (natively), and a smaller disk takes less of the host's memory
                  # the data disk: every volume lives here (the fault target)
  dirs: [vol/saleor_db, vol/saleor_redis, vol/saleor_media]

root:
  share_images: true   # hand: migrate, api and worker run one image; one unpacked tree, not three
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 db
      10.89.0.12 redis
      10.89.0.13 migrate
      10.89.0.14 api
      10.89.0.15 worker
      10.89.0.1 payments

# hand: the payment app. Saleor calls it synchronously for each transaction action (the webhooks
# that helper_client.py setup creates, with the subscription queries there): it answers that the
# charge, refund or cancelation succeeded. A repeat of an idempotency key gets the first answer
# and makes no new effect, as a payment provider's own idempotency does. `ref` is the checkout of
# an initialize call and the transaction of the other calls.
fakes:
  - name: payments
    port: 9001
    idempotency: json:idempotencyKey
    ref: json:ref.id
    routes:
      - name: initialize
        method: POST
        path: /initialize
        status: 200
        headers: {Content-Type: application/json}
        body: '{"pspReference":"in_{seq}","result":"CHARGE_SUCCESS","amount":{json:action.amount}}'
        idempotent: true
      - name: charge
        method: POST
        path: /charge
        status: 200
        headers: {Content-Type: application/json}
        body: '{"pspReference":"ch_{seq}","result":"CHARGE_SUCCESS","amount":{json:action.amount}}'
        idempotent: true
      - name: refund
        method: POST
        path: /refund
        status: 200
        headers: {Content-Type: application/json}
        body: '{"pspReference":"re_{seq}","result":"REFUND_SUCCESS","amount":{json:action.amount}}'
        idempotent: true
      - name: cancel
        method: POST
        path: /cancel
        status: 200
        headers: {Content-Type: application/json}
        body: '{"pspReference":"ca_{seq}","result":"CANCEL_SUCCESS","amount":{json:action.amount}}'
        idempotent: true

services:
  # Compose service db
  # image postgres:16.16-alpine3.24 = docker.io/library/postgres@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
  #   linux/amd64: sha256:a2f7e20374cd8fd8ed4a588b79549e10589bea7b1686e77922f5ac741b80b8a1
  #   linux/arm64/v8: sha256:40e58641410e030f5769096bca8372f68f243e1859c8ecdf11f227da390d514d
  # port from the image's EXPOSE [5432]
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: db
    image: {x86_64: images/postgres-16.16-alpine3.24-amd64.docker.tar, arm64: images/postgres-16.16-alpine3.24-arm64-oci}
    image_ref: "postgres:16.16-alpine3.24"
    env:
      POSTGRES_USER: "saleor"
      POSTGRES_PASSWORD: "saleor"
      POSTGRES_DB: "saleor"
    port: 5432
    addr: 10.89.0.11
    ready: "timeout 5 hydo-oci db /bin/sh -c 'pg_isready -U saleor -d saleor -h localhost -p 5432'"
    ready_timeout: 160
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/saleor_db, dst: /var/lib/postgresql/data, copy_up: true}
  # Compose service redis
  # image redis:7.4.7-alpine = docker.io/library/redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
  #   linux/amd64: sha256:b9f6cf0cab55fdd102fd2182deeae150457943d33439d18c6e2fc5666d3228c1
  #   linux/arm64/v8: sha256:eaa5baba4031beadea0a970d578807f96ff6caf9282f1878f316059ed889a178
  # port from the image's EXPOSE [6379]
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: redis
    image: {x86_64: images/redis-7.4.7-alpine-amd64.docker.tar, arm64: images/redis-7.4.7-alpine-arm64-oci}
    image_ref: "redis:7.4.7-alpine"
    port: 6379
    addr: 10.89.0.12
    ready: "timeout 5 hydo-oci redis redis-cli ping"
    ready_timeout: 160
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/saleor_redis, dst: /data}
  # Compose service migrate
  # image ghcr.io/saleor/saleor:3.23.49 = ghcr.io/saleor/saleor@sha256:bb59cbf1efd764d9010390a4f08d681f17f771528b5e0688c641158e9c16680b
  #   linux/amd64: sha256:671845a6b5d92b93417095d5a8d1d88de85096a846b698499395c638ccfd1ff8
  #   linux/arm64: sha256:1a9d2807214087dbd41bf78c44c951441f48c40f8afcc83f2d79f31e8efe79bd
  # a one-shot job (others depend on it with service_completed_successfully): it idles here, its command runs in the setup: of each service that waits for it, and job: true keeps the explorer's faults off it
  # port from the image's EXPOSE [8000]
  - name: migrate
    image: {x86_64: images/ghcr.io-saleor-saleor-3.23.49-amd64.docker.tar, arm64: images/ghcr.io-saleor-saleor-3.23.49-arm64-oci}
    image_ref: "ghcr.io/saleor/saleor:3.23.49"
    entrypoint: [/.hydo/busybox, sleep, "2147483647"]
    env:
      DATABASE_URL: "postgres://saleor:saleor@db:5432/saleor"
      CACHE_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      SECRET_KEY: "changeme"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DEFAULT_CHANNEL_SLUG: "default-channel"
      DEFAULT_FROM_EMAIL: "noreply@example.com"
      HTTP_IP_FILTER_ENABLED: "False"
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: "True"
      SEND_USAGE_TELEMETRY: "False"
    port: 8000
    addr: 10.89.0.13
    depends_on: [db]
    ready: "true"
    job: true   # a one-shot job: never a fault target (MANIFEST.md "One-shot jobs")
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Compose service api
  # image ghcr.io/saleor/saleor:3.23.49 = ghcr.io/saleor/saleor@sha256:bb59cbf1efd764d9010390a4f08d681f17f771528b5e0688c641158e9c16680b
  #   linux/amd64: sha256:671845a6b5d92b93417095d5a8d1d88de85096a846b698499395c638ccfd1ff8
  #   linux/arm64: sha256:1a9d2807214087dbd41bf78c44c951441f48c40f8afcc83f2d79f31e8efe79bd
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: api
    image: {x86_64: images/ghcr.io-saleor-saleor-3.23.49-amd64.docker.tar, arm64: images/ghcr.io-saleor-saleor-3.23.49-arm64-oci}
    image_ref: "ghcr.io/saleor/saleor:3.23.49"
    env:
      DATABASE_URL: "postgres://saleor:saleor@db:5432/saleor"
      CACHE_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      SECRET_KEY: "changeme"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DEFAULT_CHANNEL_SLUG: "default-channel"
      DEFAULT_FROM_EMAIL: "noreply@example.com"
      HTTP_IP_FILTER_ENABLED: "False"
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: "True"
      SEND_USAGE_TELEMETRY: "False"
      DJANGO_SUPERUSER_EMAIL: "staff@example.com"   # hand: the staff user that first_setup creates
      DJANGO_SUPERUSER_PASSWORD: "hydo-staff-password"
    port: 8000
    addr: 10.89.0.14
    depends_on: [migrate, db, redis]
    setup: "[ -f /tmp/hydo/job.migrate.done ] || { hydo-oci migrate python3 manage.py migrate --no-input && : > /tmp/hydo/job.migrate.done; }"
    ready: "timeout 10 hydo-oci api python3 -c 'import urllib.request; urllib.request.urlopen('\"'\"'http://localhost:8000/health/'\"'\"', timeout=5)'"
    ready_timeout: 210
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/saleor_media, dst: /app/media, copy_up: true}
      - {src: /hydo/workload, dst: /hydo/workload}   # hand: the test client runs with the image's Python
  # Compose service worker
  # image ghcr.io/saleor/saleor:3.23.49 = ghcr.io/saleor/saleor@sha256:bb59cbf1efd764d9010390a4f08d681f17f771528b5e0688c641158e9c16680b
  #   linux/amd64: sha256:671845a6b5d92b93417095d5a8d1d88de85096a846b698499395c638ccfd1ff8
  #   linux/arm64: sha256:1a9d2807214087dbd41bf78c44c951441f48c40f8afcc83f2d79f31e8efe79bd
  # hand: the importer took port 8000 from the image's EXPOSE, but the worker serves no port;
  # it is ready when Celery answers a ping
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: worker
    image: {x86_64: images/ghcr.io-saleor-saleor-3.23.49-amd64.docker.tar, arm64: images/ghcr.io-saleor-saleor-3.23.49-arm64-oci}
    image_ref: "ghcr.io/saleor/saleor:3.23.49"
    # hand: beat keeps its schedule in the working directory, /app, which is read-only in the
    # guest; without this option beat stops at start ("Read-only file system:
    # 'celerybeat-schedule'") and no periodic task runs. /run is a tmpfs, as /app is writable in Docker.
    cmd: [celery, "--app=saleor.celeryconf:app", worker, "--loglevel=info", "-B", "--concurrency=2", "--schedule=/run/celerybeat-schedule"]
    env:
      DATABASE_URL: "postgres://saleor:saleor@db:5432/saleor"
      CACHE_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      SECRET_KEY: "changeme"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DEFAULT_CHANNEL_SLUG: "default-channel"
      DEFAULT_FROM_EMAIL: "noreply@example.com"
      HTTP_IP_FILTER_ENABLED: "False"
      HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS: "True"
      SEND_USAGE_TELEMETRY: "False"
    addr: 10.89.0.15
    depends_on: [migrate, db, redis]
    setup: "[ -f /tmp/hydo/job.migrate.done ] || { hydo-oci migrate python3 manage.py migrate --no-input && : > /tmp/hydo/job.migrate.done; }"
    ready: "timeout 30 hydo-oci worker celery --app=saleor.celeryconf:app inspect ping --timeout 10"
    ready_timeout: 210
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/saleor_media, dst: /app/media, copy_up: true}

workload:
  steps: 16
  timeout: 900

test:
  parallel: 4
  per_round: 3
  round_ms: 1500
  command_timeout: 120
  drain_timeout: 120
  check_within: 120

faults: [kill, pause, network, oneway, cut, clock, protocol]
# hand: the voucher WELCOME ends at 00:40 of the guest's first day (first_setup); the explorer's
# clock faults also step to 1 s before that end (MANIFEST.md "Clock steps to a time")
clock_points: ["@:40-1s"]
