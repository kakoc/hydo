# A primary and a replica with Valkey's default settings (diskless full sync, a 5-second
# repl-diskless-sync-delay). Only the primary runs under libfaketime: the offset in
# /clock/offset (for example "-120s") moves its wall clock; its monotonic clock runs on.
name: vk-native
services:
  primary:
    build: .
    image: vk-native-faketime:9.1.3
    command: ["valkey-server", "--save", ""]
    environment:
      LD_PRELOAD: /usr/local/lib/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /clock/offset
      FAKETIME_NO_CACHE: "1"
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
    volumes: ["clock:/clock"]
  replica:
    image: vk-native-faketime:9.1.3
    command: ["valkey-server", "--save", "", "--replicaof", "primary", "6379"]
    profiles: [replica]
volumes:
  clock: {}
