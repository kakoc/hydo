# TiKV v8.5.8 (the newest release) with three PD members and three TiKV stores, sized small: each
# store reads conf/tikv.toml (a 64 MB block cache, 1 GB of memory, small regions), each PD member
# conf/pd.toml. The client (client/, built by build.sh) talks to PD at pd1..pd3:2379.
#
#   sh build.sh && docker compose up -d
#   docker compose run --rm client /tk/tkc-arm64 init
services:
  pd1:
    image: pingcap/pd:v8.5.8
    command: ["--name=pd1", "--data-dir=/data", "--client-urls=http://0.0.0.0:2379",
              "--advertise-client-urls=http://pd1:2379", "--peer-urls=http://0.0.0.0:2380",
              "--advertise-peer-urls=http://pd1:2380",
              "--initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380",
              "--config=/etc/pd/pd.toml"]
    restart: on-failure
    volumes:
      - ./conf/pd.toml:/etc/pd/pd.toml:ro
      - pd1-data:/data
  pd2:
    image: pingcap/pd:v8.5.8
    command: ["--name=pd2", "--data-dir=/data", "--client-urls=http://0.0.0.0:2379",
              "--advertise-client-urls=http://pd2:2379", "--peer-urls=http://0.0.0.0:2380",
              "--advertise-peer-urls=http://pd2:2380",
              "--initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380",
              "--config=/etc/pd/pd.toml"]
    restart: on-failure
    volumes:
      - ./conf/pd.toml:/etc/pd/pd.toml:ro
      - pd2-data:/data
  pd3:
    image: pingcap/pd:v8.5.8
    command: ["--name=pd3", "--data-dir=/data", "--client-urls=http://0.0.0.0:2379",
              "--advertise-client-urls=http://pd3:2379", "--peer-urls=http://0.0.0.0:2380",
              "--advertise-peer-urls=http://pd3:2380",
              "--initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380",
              "--config=/etc/pd/pd.toml"]
    restart: on-failure
    volumes:
      - ./conf/pd.toml:/etc/pd/pd.toml:ro
      - pd3-data:/data
  tikv1:
    image: pingcap/tikv:v8.5.8
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv1:20160", "--status-addr=0.0.0.0:20180",
              "--advertise-status-addr=tikv1:20180", "--data-dir=/data",
              "--pd=pd1:2379,pd2:2379,pd3:2379", "--config=/etc/tikv/tikv.toml"]
    restart: on-failure
    depends_on: [pd1, pd2, pd3]
    volumes:
      - ./conf/tikv.toml:/etc/tikv/tikv.toml:ro
      - tikv1-data:/data
  tikv2:
    image: pingcap/tikv:v8.5.8
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv2:20160", "--status-addr=0.0.0.0:20180",
              "--advertise-status-addr=tikv2:20180", "--data-dir=/data",
              "--pd=pd1:2379,pd2:2379,pd3:2379", "--config=/etc/tikv/tikv.toml"]
    restart: on-failure
    depends_on: [pd1, pd2, pd3]
    volumes:
      - ./conf/tikv.toml:/etc/tikv/tikv.toml:ro
      - tikv2-data:/data
  tikv3:
    image: pingcap/tikv:v8.5.8
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv3:20160", "--status-addr=0.0.0.0:20180",
              "--advertise-status-addr=tikv3:20180", "--data-dir=/data",
              "--pd=pd1:2379,pd2:2379,pd3:2379", "--config=/etc/tikv/tikv.toml"]
    restart: on-failure
    depends_on: [pd1, pd2, pd3]
    volumes:
      - ./conf/tikv.toml:/etc/tikv/tikv.toml:ro
      - tikv3-data:/data
  client:
    image: busybox:1.36
    command: ["sleep", "100000"]
    profiles: [client]
    volumes:
      - ./bin:/tk:ro
volumes:
  pd1-data:
  pd2-data:
  pd3-data:
  tikv1-data:
  tikv2-data:
  tikv3-data:
