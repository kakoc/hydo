# Generated by hvx/onboard/hydo-compose from ../docker-compose.yaml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the Compose
# file; the workload and the invariants are TODO (search for TODO). The hydo-onboard skill
# (`hydo guide`) fills them in. MANIFEST.md, "From Docker Compose", explains
# every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. write the workload and the invariants below
# 3. HYDO_SEEDRNG=<pinned hvx_seedrng> hvx/onboard/hydo-build hydo.yaml   (or: hydo build)
#
# hand: changes made after the import are marked "hand:". The workload and its checks are hydo's
# ready-made SQL workloads (workload/, checks/), written by
#   hydo sql-gen --dialect libsql --endpoint primary=10.89.0.11:8080 --endpoint replica=10.89.0.12:8080,replica
# bank transfers and Elle-style list-append transactions over sqld's HTTP API, batch and
# interactive, sent to the primary or the replica as the seed chooses (RESULTS.md). Until
# Milestone 177 they were a hand-written client, ../client (sqlgen, about 850 lines of Rust).
format: 1
name: libsql-replica
description: "libSQL server (sqld): a primary and a read replica; seeded SQL transactions checked for a constant bank total, serializable list-append histories and replica convergence"
hydo_version: "0.1"

# hand: what the primary's ready command runs after its health check. By default it sets sqld's
# durability mode again after every start, because sqld keeps it only in memory (RESULTS.md,
# finding 3); `hydo build --set 'mode_on_start=&& true'` builds the image that sets it only once
# (workload/first_sqld_durability), which loses acknowledged transactions at a power cut after a
# kill of the primary.
params:
  mode_on_start: "&& sh /etc/sqld-durability.sh"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 1024   # a guess: 768 MiB for the services and the kernel; raise it if a service runs out
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 512   # the data disk: every volume lives here (the fault target)
  dirs: [vol/primary-data, vol/replica-data]

root:
  text:
    # hand: sets sqld's durability mode through the admin API: the knob's value, or the last
    # one set (strong at first); the primary's ready command runs it after every start
    /etc/sqld-durability.sh: |
      m=${1:-$(cat /tmp/sqld-durability 2>/dev/null || echo strong)}
      echo "$m" > /tmp/sqld-durability
      exec wget -q -T 2 -O /dev/null --header 'Content-Type: application/json' \
        --post-data '{"block_reads":false,"block_writes":false,"durability_mode":"'"$m"'"}' \
        http://10.89.0.11:9090/v1/namespaces/default/config
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 primary
      10.89.0.12 replica

services:
  # Compose service primary
  # image ghcr.io/tursodatabase/libsql-server:v0.24.33 = ghcr.io/tursodatabase/libsql-server@sha256:f8ca0134cdded747793888e48591aece07647d9d598d3ac229aabfa93159ca88
  #   linux/amd64: sha256:756fb4d34447cfa9507dceb3a8e680435d7f2173e2aa680f44a1329e774f7d31
  #   linux/arm64: sha256:d2184b6faf4ccea9b480180467279d682e7aca9217cd8234655885dabfac8a23
  # ports [5001, 8080]: network faults (N=/O=) act on the first, 8080
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: primary
    image: {x86_64: images/ghcr.io-tursodatabase-libsql-server-v0.24.33-amd64.docker.tar, arm64: images/ghcr.io-tursodatabase-libsql-server-v0.24.33-arm64-oci}
    image_ref: "ghcr.io/tursodatabase/libsql-server:v0.24.33"
    env:
      SQLD_NODE: "primary"
      SQLD_DB_PATH: "/var/lib/sqld/primary.db"
      SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
      SQLD_GRPC_LISTEN_ADDR: "0.0.0.0:5001"
      # hand: the admin API, through which the durability knob below is set
      SQLD_ADMIN_LISTEN_ADDR: "0.0.0.0:9090"
    port: 8080
    addr: 10.89.0.11
    # hand: the image has no curl (the Compose healthcheck could never pass); busybox wget from the
    # guest. Then the durability mode, again after every start: sqld keeps it only in memory
    # (RESULTS.md, finding 3), so a restarted primary would fall back to relaxed.
    ready: "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/health {{mode_on_start}}"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/primary-data, dst: /var/lib/sqld, copy_up: true}
  # Compose service replica
  # image ghcr.io/tursodatabase/libsql-server:v0.24.33 = ghcr.io/tursodatabase/libsql-server@sha256:f8ca0134cdded747793888e48591aece07647d9d598d3ac229aabfa93159ca88
  #   linux/amd64: sha256:756fb4d34447cfa9507dceb3a8e680435d7f2173e2aa680f44a1329e774f7d31
  #   linux/arm64: sha256:d2184b6faf4ccea9b480180467279d682e7aca9217cd8234655885dabfac8a23
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: replica
    image: {x86_64: images/ghcr.io-tursodatabase-libsql-server-v0.24.33-amd64.docker.tar, arm64: images/ghcr.io-tursodatabase-libsql-server-v0.24.33-arm64-oci}
    image_ref: "ghcr.io/tursodatabase/libsql-server:v0.24.33"
    env:
      SQLD_NODE: "replica"
      SQLD_PRIMARY_URL: "http://primary:5001"
      SQLD_DB_PATH: "/var/lib/sqld/replica.db"
      SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
    port: 8080
    addr: 10.89.0.12
    depends_on: [primary]
    # hand: as for the primary
    ready: "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/health"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/replica-data, dst: /var/lib/sqld, copy_up: true}

# hand: the imported numbered-steps workload and TODO invariant were replaced by the test
# composer (workload/, checks/).
workload:
  steps: 60
  timeout: 300

test:
  parallel: 6
  per_round: 3
  round_ms: 300
  command_timeout: 30
  drain_timeout: 30
  check_every: 2

# hand: sqld's durability mode is the PRAGMA synchronous of its connections: relaxed (NORMAL,
# sqld's default), strong (FULL) or extra. With relaxed, a commit in WAL mode is not synced
# until a checkpoint, so a power cut loses acknowledged transactions (RESULTS.md). The image
# starts with the safe value (the primary's ready command sets it through the admin API, after
# every start, because sqld does not keep it across a restart); D=relaxed restores sqld's default.
knobs:
  - token: D
    name: sqld durability_mode
    default: strong
    values: [strong, relaxed]
    set: sh /etc/sqld-durability.sh $HYDO_VALUE

faults: [kill, pause, network, oneway, cut, clock, disk]
