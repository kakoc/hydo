# A broker of the replica group broker-a in controller mode (RocketMQ's
# docs/en/controller/deploy.md, "Broker Controller mode deployment", and
# distribution/conf/controller/quick-start/broker-n0.conf). The controller chooses the master;
# every node starts as a slave with brokerId -1. start-broker.sh puts in the @...@ values.
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = -1
brokerRole = SLAVE
brokerIP1 = @ADDR@
listenPort = 10911
namesrvAddr = 10.89.0.10:9876
enableControllerMode = true
controllerAddr = 10.89.0.10:9878
# The documented durable settings: a message is acknowledged after every replica of the
# SyncStateSet has it ("this parameter can ensure that the message is not lost"), and after the
# master flushed it to its disk.
allAckInSyncStateSet = @ALLACK@
flushDiskType = @FLUSH@
minInSyncReplicas = @MININSYNC@
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
# Small files for a guest: the commit log in files of 64 MiB, the consume queues in files of
# 60,000 entries.
mappedFileSizeCommitLog = 67108864
mappedFileSizeConsumeQueue = 1200000
# Keep every file: the default deletes files older than 72 hours at 04:00, which a forward clock
# step reaches.
fileReservedTime = 876000
# The broker's check of a transaction whose producer sent no commit or rollback comes every
# @TXCHECK@ ms (60,000 in RocketMQ's Helm chart), so that it comes within a run.
transactionCheckInterval = @TXCHECK@
transactionTimeOut = 6000
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
