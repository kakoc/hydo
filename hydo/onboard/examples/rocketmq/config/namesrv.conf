# The NameServer with the controller embedded (RocketMQ's docs/en/controller/deploy.md, "Embed
# NameServer deployment", and distribution/conf/controller/quick-start/namesrv.conf). One
# controller: "Controller can also complete Broker Failover with only one deployment".
listenPort = 9876
enableControllerInNamesrv = true
controllerDLegerGroup = group1
controllerDLegerPeers = n0-10.89.0.10:9878
controllerDLegerSelfId = n0
controllerStorePath = /home/rocketmq/store/DledgerController
enableElectUncleanMaster = false
notifyBrokerRoleChanged = true
