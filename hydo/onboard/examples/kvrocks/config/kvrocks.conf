# The settings of the three Kvrocks nodes that differ from the defaults of the image's
# kvrocks.conf (Kvrocks 2.17.0). Every other setting keeps its default. start.sh copies this file
# into the node's data directory at the first start, sets the two durability settings from the
# environment, and adds `slaveof` to the replicas. Kvrocks rewrites the copy at every start and at
# CONFIG REWRITE, so it lives on the data volume, not in the image.

bind 0.0.0.0
port 6666
dir /var/lib/kvrocks
log-dir stdout

# The same db-name on every node: a replica refuses a master of another name.
db-name hydo.db

# Durability (kvrocks.conf: "If this flag is disabled, and the machine crashes, some recent
# writes may be lost"). start.sh sets it from KVROCKS_SYNC; the durable value is yes.
rocksdb.write_options.sync yes

# PSYNC with the replication id and the sequence (kvrocks.conf: "master only checks sequence
# number when replica asks for PSYNC, that is not enough since they may have different
# replication histories"). start.sh sets it from KVROCKS_RSID; the safe value is yes.
use-rsid-psync yes

# Memory only: the guest is small. The defaults reserve a 4 GiB block cache and 64 MiB memtables
# for each of Kvrocks's column families, which only grow with the data.
workers 4
rocksdb.block_cache_size 64
rocksdb.write_buffer_size 8
rocksdb.max_write_buffer_number 2
rocksdb.max_open_files 256
rocksdb.max_background_jobs 2
