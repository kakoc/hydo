# miniflux + PostgreSQL (examples/miniflux/hydo.yaml) with its PostgreSQL invariants written
# with the ready-made store readers (hvx/readers: hydo-check; MANIFEST.md "Reading the stores")
# instead of psql loops. The periodic API check stays shell: it reads miniflux's HTTP API, not
# a store. Everything else is the same as hydo.yaml.
# Build on the build box: HYDO_MINIFLUX_BIN=<binary> hvx/onboard/examples/miniflux/build-read.sh
#   -> build/explore-ob-miniflux-read-disk.img
name: miniflux
description: miniflux + PostgreSQL; every acknowledged category must be stored exactly once.

root:
  nix:
    - /nix/store/6mr1dkqqgkm6lhnkvir9i1jim2dnrl8j-postgresql-15.6
    - /nix/store/4wi4ck9lxpp37fijcna3c1wkm80zzs8v-curl-8.7.1-bin
  files:
    - {src: miniflux, dst: /bin/miniflux, mode: "0755"}
  text:
    /etc/passwd: |
      root:x:0:0:root:/root:/bin/sh
      postgres:x:70:70:postgres:/tmp:/bin/sh
    /etc/group: |
      root:x:0:
      postgres:x:70:

data:
  size_mib: 256
  dirs: [pg]

env:
  PG: /nix/store/6mr1dkqqgkm6lhnkvir9i1jim2dnrl8j-postgresql-15.6
  CURL: /nix/store/4wi4ck9lxpp37fijcna3c1wkm80zzs8v-curl-8.7.1-bin/bin/curl
  DATABASE_URL: postgres://miniflux@127.0.0.1/miniflux?sslmode=disable
  LISTEN_ADDR: 127.0.0.1:8080
  BASE_URL: http://127.0.0.1:8080
  RUN_MIGRATIONS: "1"
  CREATE_ADMIN: "1"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: hydo-admin
  DISABLE_SCHEDULER_SERVICE: "1"     # feed polling needs the internet; the guest has none
  DATABASE_MAX_CONNS: "4"
  GOMAXPROCS: "1"

shell: |
  PSQL() { "$PG/bin/psql" -h 127.0.0.1 -U miniflux -d miniflux -tA -c "$1"; }
  API() { $CURL -s -u "$ADMIN_USERNAME:$ADMIN_PASSWORD" "$@"; }

services:
  - name: postgres
    setup: |
      if [ ! -f /data/pg/PG_VERSION ]; then
        chown postgres /data/pg
        su postgres -s /bin/sh -c "$PG/bin/initdb -D /data/pg -U postgres --auth=trust"
      fi
    cmd: su postgres -s /bin/sh -c "exec $PG/bin/postgres -D /data/pg -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp -c shared_buffers=32MB -c max_connections=20 -c dynamic_shared_memory_type=mmap"
    ready: '"$PG/bin/pg_isready" -h 127.0.0.1 -U postgres'
    ready_timeout: 120
    port: 5432
  - name: front
    description: miniflux itself (named front so the explorer's generators target it)
    setup: |
      P() { "$PG/bin/psql" -h 127.0.0.1 -U postgres -tA -c "$1"; }
      P "SELECT 1 FROM pg_roles WHERE rolname='miniflux'" | grep -q 1 || P "CREATE ROLE miniflux LOGIN"
      P "SELECT 1 FROM pg_database WHERE datname='miniflux'" | grep -q 1 || P "CREATE DATABASE miniflux OWNER miniflux"
    cmd: /bin/miniflux
    ready: /bin/miniflux -healthcheck http://127.0.0.1:8080/healthcheck
    port: 8080
    depends_on: [postgres]
    recovery: false                    # the final checks read PostgreSQL directly

workload:
  steps: 30                            # step i = create category "c<i>"
  timeout: 180
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      code=$(API -o /tmp/hydo/resp.$i -w '%{http_code}' --max-time 3 \
             -H 'Content-Type: application/json' -d "{\"title\":\"c$i\"}" \
             http://127.0.0.1:8080/v1/categories)
      case $code in
        201) echo $i >> $HYDO_ACKED; echo "$i ack" >> $HYDO_OUTCOMES;;
        4??) echo "$i failed" >> $HYDO_OUTCOMES;;     # validation error: not applied
        *)   echo "$i unknown" >> $HYDO_OUTCOMES;;    # timeout, 5xx, no connection
      esac
      i=$((i + 1))
    done
  retry: |
    i=0
    while [ $i -lt $HYDO_STEPS ]; do
      if ! grep -qx $i $HYDO_ACKED; then
        code=$(API -o /tmp/hydo/resp.$i -w '%{http_code}' --max-time 3 \
               -H 'Content-Type: application/json' -d "{\"title\":\"c$i\"}" \
               http://127.0.0.1:8080/v1/categories)
        # a 400 "already exists" means an earlier attempt was applied: the title is the id
        if [ "$code" = 201 ] || grep -q "already exists" /tmp/hydo/resp.$i; then
          echo $i >> $HYDO_ACKED; echo "$i ack" >> $HYDO_OUTCOMES
        fi
      fi
      i=$((i + 1))
    done
  process: curl

knobs:
  - token: S
    name: PostgreSQL synchronous_commit
    default: "on"
    safe: "on"
    values: ["on", "off"]
    set: '"$PG/bin/psql" -h 127.0.0.1 -U postgres -c "ALTER SYSTEM SET synchronous_commit=$HYDO_VALUE" -c "SELECT pg_reload_conf()"'

invariants:
  # PostgreSQL as a source: postgres <dsn> "<query>"; the client's ids: hydo acked / failed.
  # Category i is titled c<i>, so the ids get the prefix c before they are compared.
  - id: categories.acked_exactly_once
    msg: every category the client saw created (HTTP 201) is stored exactly once
    cmd: >-
      hydo-check exactly-once --left 'acked=hydo acked --add-prefix c'
      --right 'categories=postgres postgres://miniflux@127.0.0.1/miniflux?sslmode=disable "SELECT title FROM categories"'
  - id: categories.failed_not_applied
    msg: a create the server rejected with a 4xx was not applied
    cmd: >-
      hydo-check disjoint --left 'failed=hydo failed --add-prefix c'
      --right 'categories=postgres postgres://miniflux@127.0.0.1/miniflux?sslmode=disable "SELECT title FROM categories"'
  - id: api.reads_acked_categories
    msg: while the workload runs, every acknowledged category is visible through the API
    type: always_or_unreachable
    every: 2
    final: false
    cmd: |
      # only what was acknowledged before the read began must be in it: a create that is still
      # in flight while the read runs may be answered 201 after the read's snapshot (M206)
      acked=$(cat $HYDO_ACKED)
      code=$(API -o /tmp/hydo/cats -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/v1/categories)
      [ "$code" = 200 ] || exit 2          # server or database down: cannot evaluate now
      list=$(cat /tmp/hydo/cats)
      for i in $acked; do
        echo "$list" | grep -q "\"title\":\"c$i\"" || { echo "acked c$i missing from the API"; exit 1; }
      done
      echo "api shows all $(echo "$acked" | grep -c .) acked before the read"

faults: [kill, pause, network, oneway, cut, clock, disk]
