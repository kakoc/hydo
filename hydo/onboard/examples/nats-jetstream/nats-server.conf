# nats-server configuration shared by the three cluster nodes (docker-compose.yaml).
server_name: $NATS_NAME
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  # sync_interval is left at its default (about two minutes): writes are acknowledged
  # before they are flushed to disk. "always" flushes every write before the ack.
}

cluster {
  name: JSC
  listen: 0.0.0.0:6222
  routes: [
    nats://n1:6222
    nats://n2:6222
    nats://n3:6222
  ]
}
