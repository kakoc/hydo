# nats-server configuration shared by the three cluster nodes (docker-compose.yaml).
server_name: $NATS_NAME
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  sync_interval: 10s   # flush every 10 seconds (the setting of the single-node power loss, 3.5)
}

cluster {
  name: JSC
  listen: 0.0.0.0:6222
  routes: [
    nats://n1:6222
    nats://n2:6222
    nats://n3:6222
  ]
}
