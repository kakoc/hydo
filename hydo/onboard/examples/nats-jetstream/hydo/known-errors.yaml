# Known error kinds: lines a service writes to its log that are expected (hydo/onboard/MANIFEST.md,
# "Error logs as findings"). Each entry needs a reason; `hydo errors accept` appends them.
#   sig:    the kind's signature (or match: a regular expression on its template)
#   with:   only in runs whose schedule has one of these faults (K=mysql, C, disk, R=everysec)
#   during: only for lines written while one of these faults was on
format: 1
unknown: report       # report: a new kind is a finding; fail: it also fails the run
known:
  - sig: 3c649592d131
    service: n1
    tpl: "[#] <date> <time> [ERR] Error trying to connect to route (attempt #): dial tcp #.#.#.#:6222: connect: connection refused"
    example: "[62] 2026/01/01 00:00:00.017770 [ERR] Error trying to connect to route (attempt 1): dial tcp 10.89.0.12:6222: connect: connection refused"
    reason: "a route to a peer that is not listening yet (at start-up, or while it restarts after a kill); NATS retries the route"
    by: "M141 onboarding"
    date: "2026-11-02"
  - sig: db1959faad7b
    service: n2
    tpl: "[#] <date> <time> [ERR] Error trying to connect to route (attempt #): dial tcp #.#.#.#:6222: connect: connection refused"
    example: "[124] 2026/01/01 00:00:01.024757 [ERR] Error trying to connect to route (attempt 1): dial tcp 10.89.0.13:6222: connect: connection refused"
    reason: "a route to a peer that is not listening yet (at start-up, or while it restarts after a kill); NATS retries the route"
    by: "M141 onboarding"
    date: "2026-11-02"
  - sig: b9f3285f75db
    service: n3
    tpl: "[#] <date> <time> [ERR] Error trying to connect to route (attempt #): dial tcp #.#.#.#:6222: connect: connection refused"
    example: "[183] 2026/01/01 00:00:08.211794 [ERR] Error trying to connect to route (attempt 1): dial tcp 10.89.0.12:6222: connect: connection refused"
    reason: "a route to a peer that is not listening yet (at start-up, or while it restarts after a kill); NATS retries the route"
    by: "M141 onboarding"
    date: "2026-11-02"
