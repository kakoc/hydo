# The three-node NATS JetStream cluster of ../storage/hydo.yaml with a stream of several 8 MB
# blocks per node: a first command publishes 24,000 messages of 1 KB before the snapshot every run
# starts from, so that a corrupted block can lie in the middle of the stream on two nodes at
# once (G= with a list, Jepsen's finding 3.2). RESULTS.md, "Several nodes' corrupted blocks".
#
#   sh ../hydo/fetch-images.sh                          # the images by digest (network, once)
#   sh ../client/build.sh amd64; sh ../client/build.sh arm64   # natsjs and natsbulk
#   hydo build hydo.yaml                                # NATS 2.12.1, default fsync (2 minutes)
#   hydo build hydo.yaml --set conf=nats-server-sync-always.conf   # fsync before every ack
format: 1
name: nats-jetstream-blocks
description: "NATS JetStream, three nodes, each store on its own file system with a stream of several blocks: corrupted blocks on several nodes"

params:
  nats: "2.12.1"               # the NATS release (../hydo/images/nats-<version>-alpine-*)
  conf: "nats-server.conf"     # the server configuration: default fsync, -sync-10s or -sync-always

network: bridge   # each service in its own network namespace at its addr:

guest:
  ram_mib: 2048

data:
  size_mib: 256   # the shared data disk: the error-log scan's files; the stores are on their own file systems
  dirs: [vol/n1-data, vol/n2-data, vol/n3-data]

root:
  files:
    - {src: "../{{conf}}", dst: /etc/hydo/compose/bind/0-nats-server.conf}
    - {src: ../bin/natsjs-arm64, dst: /bin/natsjs-aarch64, mode: "0755"}
    - {src: ../bin/natsjs-amd64, dst: /bin/natsjs-x86_64, mode: "0755"}
    - {src: ../bin/natsbulk-arm64, dst: /bin/natsbulk-aarch64, mode: "0755"}
    - {src: ../bin/natsbulk-amd64, dst: /bin/natsbulk-x86_64, mode: "0755"}
  text:
    /etc/hosts: |
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 n1
      10.89.0.12 n2
      10.89.0.13 n3

errors: true   # NATS marks errors [ERR] and [FTL]

services:
  - name: n1
    image: {x86_64: "../hydo/images/nats-{{nats}}-alpine-amd64.docker.tar", arm64: "../hydo/images/nats-{{nats}}-alpine-arm64-oci"}
    image_ref: "nats:{{nats}}-alpine"
    cmd: [nats-server, "--config", /etc/nats/nats-server.conf]
    env:
      NATS_NAME: "n1"
    port: 4222
    addr: 10.89.0.11
    ready: "timeout 2 hydo-oci n1 wget -q -O /dev/null 'http://localhost:8222/healthz?js-enabled-only=true'"
    ready_timeout: 120
    restart: "unless-stopped"
    errors:
      format: none
      match: '\[(ERR|FTL)\]'
    storage: {dir: vol/n1-data, size_mib: 384}   # n1's JetStream store, a file system of its own
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/0-nats-server.conf, dst: /etc/nats/nats-server.conf}
      - {src: /data/vol/n1-data, dst: /data}
  - name: n2
    image: {x86_64: "../hydo/images/nats-{{nats}}-alpine-amd64.docker.tar", arm64: "../hydo/images/nats-{{nats}}-alpine-arm64-oci"}
    image_ref: "nats:{{nats}}-alpine"
    cmd: [nats-server, "--config", /etc/nats/nats-server.conf]
    env:
      NATS_NAME: "n2"
    port: 4222
    addr: 10.89.0.12
    ready: "timeout 2 hydo-oci n2 wget -q -O /dev/null 'http://localhost:8222/healthz?js-enabled-only=true'"
    ready_timeout: 120
    restart: "unless-stopped"
    errors:
      format: none
      match: '\[(ERR|FTL)\]'
    storage: {dir: vol/n2-data, size_mib: 384}
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/0-nats-server.conf, dst: /etc/nats/nats-server.conf}
      - {src: /data/vol/n2-data, dst: /data}
  - name: n3
    image: {x86_64: "../hydo/images/nats-{{nats}}-alpine-amd64.docker.tar", arm64: "../hydo/images/nats-{{nats}}-alpine-arm64-oci"}
    image_ref: "nats:{{nats}}-alpine"
    cmd: [nats-server, "--config", /etc/nats/nats-server.conf]
    env:
      NATS_NAME: "n3"
    port: 4222
    addr: 10.89.0.13
    ready: "timeout 2 hydo-oci n3 wget -q -O /dev/null 'http://localhost:8222/healthz?js-enabled-only=true'"
    ready_timeout: 120
    restart: "unless-stopped"
    errors:
      format: none
      match: '\[(ERR|FTL)\]'
    storage: {dir: vol/n3-data, size_mib: 384}
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/0-nats-server.conf, dst: /etc/nats/nats-server.conf}
      - {src: /data/vol/n3-data, dst: /data}

# The nodes as a group (../hydo/hydo-groups.yaml): G=nodes.majority corrupts two of the three,
# K=nodes.primary aims at the JetStream meta leader.
groups:
  - name: nodes
    services: [n1, n2, n3]
    primary: |
      for n in n1 n2 n3; do
        l=$(timeout 3 wget -q -T 2 -O - "http://$n:8222/jsz" 2>/dev/null | sed -n 's/.*"leader": *"\([a-z0-9_]*\)".*/\1/p' | head -n 1)
        if [ -n "$l" ]; then echo "$l"; exit 0; fi
      done
      exit 1

# the stream exists before the window under test (Jepsen's test creates it at setup)
provision: /bin/natsjs-$(uname -m) create

# 300 rounds of 500 ms: 150 s of guest time, as in ../storage. The stream group takes its first
# snapshot a few minutes after it starts, and drops the log entries before it.
workload:
  steps: 300
  timeout: 1200

test:
  parallel: 4
  per_round: 2
  round_ms: 500
  command_timeout: 180   # also the checks' timeout: the final read takes every message of the stream
  drain_timeout: 30
  first_records: true    # the 24,000 messages of first_fill are among the acknowledged ones

faults: [kill, pause, network, oneway, cut, clock, disk, corrupt, powerloss]
