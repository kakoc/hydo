# A three-node Redpanda cluster sized small, as in hydo/hydo.yaml: one core and 1 GiB per node,
# overprovisioned. Each node reads its own conf/n<k>.yaml and the cluster's conf/bootstrap.yaml.
# RP_BOOTSTRAP=bootstrap-write-caching.yaml turns write caching on.
x-node: &node
  image: redpandadata/redpanda:${RP_VERSION:-v26.2.7}
  entrypoint: ["/opt/redpanda/bin/redpanda"]
  command: ["--redpanda-cfg", "/etc/redpanda/redpanda.yaml", "--smp", "1", "--memory", "1G",
            "--reserve-memory", "0M", "--overprovisioned"]
  restart: unless-stopped
services:
  n1:
    <<: *node
    hostname: n1
    volumes:
      - ./conf/n1.yaml:/etc/redpanda/redpanda.yaml:ro
      - ./conf/${RP_BOOTSTRAP:-bootstrap.yaml}:/etc/redpanda/.bootstrap.yaml:ro
      - n1-data:/var/lib/redpanda/data
  n2:
    <<: *node
    hostname: n2
    volumes:
      - ./conf/n2.yaml:/etc/redpanda/redpanda.yaml:ro
      - ./conf/${RP_BOOTSTRAP:-bootstrap.yaml}:/etc/redpanda/.bootstrap.yaml:ro
      - n2-data:/var/lib/redpanda/data
  n3:
    <<: *node
    hostname: n3
    volumes:
      - ./conf/n3.yaml:/etc/redpanda/redpanda.yaml:ro
      - ./conf/${RP_BOOTSTRAP:-bootstrap.yaml}:/etc/redpanda/.bootstrap.yaml:ro
      - n3-data:/var/lib/redpanda/data
  client:
    image: busybox:1.36
    command: ["sleep", "100000"]
    volumes:
      - ./bin:/rp:ro
volumes:
  n1-data:
  n2-data:
  n3-data:
