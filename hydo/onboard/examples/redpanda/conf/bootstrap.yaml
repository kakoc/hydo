# The cluster's properties at its first start (Redpanda reads .bootstrap.yaml next to
# redpanda.yaml once, when the cluster forms).
#
# The values of `rpk redpanda start --mode dev-container` that size a small cluster, without the
# two that change durability: write caching stays off (Redpanda's production default, set here
# explicitly) and fsync is not bypassed (no --unsafe-bypass-fsync).
auto_create_topics_enabled: false
group_topic_partitions: 3
storage_min_free_bytes: 10485760
topic_partitions_per_shard: 1000
fetch_reads_debounce_timeout: 10
group_initial_rebalance_delay: 0
log_segment_size_min: 1
write_caching_default: "false"
# Small for one guest: 3 transaction-coordinator partitions (default 50), and segments grown in
# steps of 1 MiB (default 32 MiB), so that each node's partitions fit a file system of 384 MiB.
transaction_coordinator_partitions: 3
segment_fallocation_step: 1048576
