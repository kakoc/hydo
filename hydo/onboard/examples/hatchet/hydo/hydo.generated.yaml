  clock_start: 1794614400   # 2026-11-14 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 2304   # the data disk: every volume lives here (the fault target)
  dirs: [vol/pgdata, vol/hatchet_config]

root:
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 postgres
      10.89.0.12 migration
      10.89.0.13 setup-config
      10.89.0.14 hatchet-engine-1
      10.89.0.15 hatchet-engine-2
      10.89.0.16 hatchet-api
      10.89.0.17 app-migrate
      10.89.0.18 worker-1
      10.89.0.19 worker-2
      10.89.0.20 worker-3

