# Generated by hydo compose from ../docker-compose.yaml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the Compose
# file; the workload and the invariant below are placeholders (search for TODO). `hydo guide
# services` and MANIFEST.md, "From Docker Compose", explain every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. delete workload.run and the TODO invariant below (keep workload.steps and
#    workload.timeout), and write the test as commands in hydo/workload/ and hydo/checks/
#    (or a test: section): hydo guide workflow
# 3. hydo build hydo.yaml
#
# WARNINGS (also printed by hydo-compose):
# - service temporal-setup: bind mount ./setup:/setup is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - service temporal: bind mount ./dynamicconfig:/etc/temporal/config/dynamicconfig is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - service worker: no healthcheck and no port: readiness is just `started`; write a ready: check
# - service worker: bind mount ./hydo/bin:/tw is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
#
# Notes:
# - Compose service 'temporal-setup' is hydo service 'temporal_setup' (fault tokens use temporal_setup; the name temporal-setup still resolves through /etc/hosts)
format: 1
name: temporal
description: "imported from docker-compose.yaml (4 services); TODO: what is tested"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 1536   # a guess: 1408 MiB for the services and the kernel; raise it if a service runs out
  clock_start: 1794614400   # 2026-11-14 00:00 UTC, the day of the import: the guest's clock starts here, after the images were built
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1280   # the data disk: every volume lives here (the fault target)
  dirs: [vol/pgdata]

root:
  files:                 # bind-mount sources, copied into the read-only root
    - {src: ../setup, dst: /etc/hydo/compose/bind/0-setup}
    - {src: ../dynamicconfig, dst: /etc/hydo/compose/bind/1-dynamicconfig}
    - {src: bin, dst: /etc/hydo/compose/bind/2-bin}
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 postgresql
      10.89.0.12 temporal-setup
      10.89.0.13 temporal
      10.89.0.14 worker

services:
  # Compose service postgresql
  # image postgres:16-alpine = docker.io/library/postgres@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
  #   linux/amd64: sha256:a2f7e20374cd8fd8ed4a588b79549e10589bea7b1686e77922f5ac741b80b8a1
  #   linux/arm64/v8: sha256:40e58641410e030f5769096bca8372f68f243e1859c8ecdf11f227da390d514d
  # port from the image's EXPOSE [5432]
  # ready: from Compose healthcheck
  - name: postgresql
    image: {x86_64: images/postgres-16-alpine-amd64.docker.tar, arm64: images/postgres-16-alpine-arm64-oci}
    image_ref: "postgres:16-alpine"
    env:
      POSTGRES_PASSWORD: "temporal"
      POSTGRES_USER: "temporal"
    port: 5432
    addr: 10.89.0.11
    ready: "timeout 5 hydo-oci postgresql /bin/sh -c 'pg_isready -U temporal -h localhost -p 5432'"
    ready_timeout: 120
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/pgdata, dst: /var/lib/postgresql/data, copy_up: true}
  # Compose service temporal-setup
  # image temporalio/admin-tools:1.32.2 = docker.io/temporalio/admin-tools@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
  #   linux/amd64: sha256:d6655e288364110b61204fbae5f103232b2c5c78e647a27bc11603d274145809
  #   linux/arm64: sha256:df920de90e0d8a02bd65480524de7e76addc0b6c889696d76229f8c507c90e84
  # a one-shot job (others depend on it with service_completed_successfully): it idles here, its command runs in the setup: of each service that waits for it, and job: true keeps the explorer's faults off it
  - name: temporal_setup
    image: {x86_64: images/temporalio-admin-tools-1.32.2-amd64.docker.tar, arm64: images/temporalio-admin-tools-1.32.2-arm64-oci}
    image_ref: "temporalio/admin-tools:1.32.2"
    entrypoint: [/.hydo/busybox, sleep, "2147483647"]
    env:
      POSTGRES_SEEDS: "postgresql"
      DB_PORT: "5432"
      POSTGRES_USER: "temporal"
      POSTGRES_PWD: "temporal"
    addr: 10.89.0.12
    depends_on: [postgresql]
    ready: "true"
    job: true   # a one-shot job: never a fault target (MANIFEST.md "One-shot jobs")
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/0-setup, dst: /setup}
  # Compose service temporal
  # image temporalio/server:1.32.2 = docker.io/temporalio/server@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
  #   linux/amd64: sha256:3e11544607762c3187c12a63e289e03beddf46c21ebb52b47ccb77db179d6313
  #   linux/arm64: sha256:a2d55f913eb0f646dd6d8026d02a3f851b87051beaa6d0be57be44c51506ee7b
  # ready: no healthcheck; a TCP connect to its port (TODO: a real readiness check, e.g. a query, if the port opens before the service can serve)
  - name: temporal
    image: {x86_64: images/temporalio-server-1.32.2-amd64.docker.tar, arm64: images/temporalio-server-1.32.2-arm64-oci}
    image_ref: "temporalio/server:1.32.2"
    env:
      DB: "postgres12"
      DB_PORT: "5432"
      POSTGRES_USER: "temporal"
      POSTGRES_PWD: "temporal"
      POSTGRES_SEEDS: "postgresql"
      DYNAMIC_CONFIG_FILE_PATH: "config/dynamicconfig/development-sql.yaml"
      BIND_ON_IP: "0.0.0.0"
    port: 7233
    addr: 10.89.0.13
    depends_on: [temporal_setup]
    setup: "[ -f /tmp/hydo/job.temporal_setup.done ] || { hydo-oci temporal_setup /.hydo/busybox chpst -u temporal /setup/setup-schema.sh && : > /tmp/hydo/job.temporal_setup.done; }"
    ready: "nc -z -w 2 10.89.0.13 7233"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/1-dynamicconfig, dst: /etc/temporal/config/dynamicconfig}
  # Compose service worker
  # image alpine:3.22 = docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
  #   linux/amd64: sha256:9db2934886712d877c932e07249c75a59e6ca27adfbccc05261987a17bef2d63
  #   linux/arm64/v8: sha256:e233f2058b0628266762f745a2c17e623b418e0090f47d223909d1f9a7d4367e
  # depends_on temporal (short form: Compose's service_started): hydo starts it once the services before it have started, without waiting for their readiness (start_after: started)
  # ready: TODO no healthcheck and no port -- `true` means started
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: worker
    image: {x86_64: images/alpine-3.22-amd64.docker.tar, arm64: images/alpine-3.22-arm64-oci}
    image_ref: "alpine:3.22"
    cmd: [/tw/tw, worker]
    env:
      TEMPORAL_ADDRESS: "temporal:7233"
    addr: 10.89.0.14
    depends_on: [temporal]
    start_after: started   # Compose's service_started: no wait for readiness
    ready: "true"
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /etc/hydo/compose/bind/2-bin, dst: /tw}

# TODO(workload): one step = one client operation against the system (an HTTP request, a
# query), appended to $HYDO_ACKED only when the system acknowledged it. Faults are placed
# at step numbers. Each Compose service name resolves (e.g. postgresql -> 10.89.0.11); run tools inside
# an image with `hydo-oci <service> <command>`. Ask the onboard skill (/hydo:onboard) to write it.
workload:
  steps: 20
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      # TODO: one operation, e.g.
      #   wget -q -T 5 -O /dev/null --post-data "id=$i" http://postgresql:5432/ && echo $i >> $HYDO_ACKED
      echo "hydo-compose: TODO write the workload (hydo.yaml)" > /dev/console; exit 1
      i=$((i + 1))
    done
  timeout: 300

# TODO(invariants): shell commands, exit 0 = holds, 1 = violated, 2 = cannot check now.
# Typical: every id in $HYDO_ACKED can be read back after the run (and after a power cut);
# type: eventually for "processed within N s". `hydo guide invariant-patterns`
invariants:
  - id: todo.acked_operations_survive
    msg: TODO every acknowledged operation is still there at the end
    cmd: |
      echo "TODO: write the invariants (hydo.yaml)"; exit 2

faults: [kill, pause, network, oneway, cut, clock, disk]
