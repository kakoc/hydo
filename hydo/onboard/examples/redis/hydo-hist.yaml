# examples/redis/hydo.yaml with recorded histories and the host's ready-made checkers instead of
# a hand-written invariant (hvx/HISTORIES.md). Each step does three operations, each recorded
# with hydo_hist: SET k:<i> v<i> (history kv, a register per key), RPUSH l<i mod 3> <i> and
# LRANGE of that list (history log, append-only lists). At the end -- in the same boot, or in the
# recovery boot after a power cut -- the final: commands read every key and list back into the
# histories. The host then checks kv for linearizability and log with the list-append checker.
# Build on the build box:
#   HYDO_SEEDRNG=<pinned hvx_seedrng> hvx/onboard/hydo-build hvx/onboard/examples/redis/hydo-hist.yaml --out explore-ob-redis-hist
# Try:  disk=cut | run C=12              -> OK: every acknowledged SET and RPUSH survives
#       disk=cut | run C=12 R=everysec   -> VIOLATION: an acknowledged write is lost (Redis's
#                                          documented everysec window; both checks see it)
name: redis-hist
description: Redis with an append-only file; histories checked for linearizability and lost appends.

root:
  files:
    - {src: ~/hydo/build/redis-server, dst: /bin/redis-server, mode: "0755"}
    - {src: ~/hydo/build/redis-cli, dst: /bin/redis-cli, mode: "0755"}
  text:
    /etc/redis.conf: |
      port 6379
      bind 127.0.0.1
      dir /data/redis
      save ""
      appendonly yes
      appendfsync always
      hz 1
      dynamic-hz no

data:
  size_mib: 64
  dirs: [redis]

shell: |
  rc() { timeout 2 /bin/redis-cli "$@" 2>/dev/null; }      # a 2 s client deadline
  list_tok() { local l; l=$(tr '\n' ',' | sed 's/,$//'); echo "[$l]"; }   # LRANGE lines -> [e1,e2,...]

services:
  - name: redis
    cmd: /bin/redis-server /etc/redis.conf
    ready: /bin/redis-cli ping | grep -q PONG
    port: 6379

workload:
  steps: 20                         # step i: SET k:i v<i>; RPUSH l<i%3> <i>; LRANGE l<i%3>
  process: redis-cli
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      hydo_hist kv 0 invoke write k:$i v$i
      if [ "$(rc SET k:$i v$i)" = OK ]; then echo $i >> $HYDO_ACKED; hydo_hist kv 0 ok write k:$i v$i
      else hydo_hist kv 0 info write k:$i v$i; fi
      l=l$((i % 3))
      hydo_hist log 1 invoke append $l $i
      case "$(rc RPUSH $l $i)" in [0-9]*) hydo_hist log 1 ok append $l $i;; *) hydo_hist log 1 info append $l $i;; esac
      hydo_hist log 2 invoke read $l
      if out=$(rc LRANGE $l 0 -1); then hydo_hist log 2 ok read $l $(printf '%s' "$out" | list_tok)
      else hydo_hist log 2 info read $l; fi
      i=$((i + 1))
    done

knobs:
  - token: R
    name: Redis appendfsync
    default: always
    values: [always, everysec, "no"]
    set: /bin/redis-cli CONFIG SET appendfsync $HYDO_VALUE

checks:
  - id: redis.kv_linearizable
    type: linearizable
    model: register
    history: kv
    msg: every SET and GET is linearizable per key (an acknowledged SET is never lost)
    final: |
      i=0
      while [ $i -lt $HYDO_STEPS ]; do
        hydo_hist kv 9 invoke read k:$i
        if v=$(rc GET k:$i); then hydo_hist kv 9 ok read k:$i ${v:-nil}; else hydo_hist kv 9 info read k:$i; fi
        i=$((i + 1))
      done
  - id: redis.lists_append
    type: list-append
    consistency: strict-serializable
    history: log
    msg: the lists never lose an acknowledged RPUSH, never duplicate one, and reads never go back in time
    final: |
      for l in l0 l1 l2; do
        hydo_hist log 9 invoke read $l
        if out=$(rc LRANGE $l 0 -1); then hydo_hist log 9 ok read $l $(printf '%s' "$out" | list_tok)
        else hydo_hist log 9 info read $l; fi
      done

faults: [kill, pause, cut, clock, disk]
