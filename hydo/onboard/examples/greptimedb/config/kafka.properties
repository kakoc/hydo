# One Kafka 3.9 broker in KRaft mode, the remote WAL of GreptimeDB's regions. Production runs
# three brokers and replicates each record; with one broker, each record is synced to the disk
# before the broker answers (log.flush.interval.messages=1), so that an acknowledged WAL entry
# survives the broker's crash and a power cut as it would on three replicas.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://kafka:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=/var/lib/kafka/data
num.partitions=1
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
min.insync.replicas=1
log.flush.interval.messages=1
log.retention.hours=-1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true
