# Upgrade testing (Milestone 238, docs/design/upgrades.md): a three-member etcd cluster that was
# grown one member at a time, as clusters are grown in practice: etcd1 starts alone, etcd2 and
# etcd3 join as learners and are promoted to voting members. Each member can run three versions
# of etcd, all three in the image (/opt/etcd-<version>/etcd); `U=` switches a member to another
# version in the middle of a run, on the same data directory.
#
# Build (from the repository root; downloads the official release tarballs and checks them):
#   hydo/onboard/examples/etcd-upgrade/build.sh                       # 3.5.5, 3.6.0-rc.2, 3.5.26
#   hydo/onboard/examples/etcd-upgrade/build.sh 3.5.5 3.6.0 3.5.26     # old, new, intermediate
# Try:
#   disk=none dseed=0 | run U=etcd1@5:new                    -> etcd's issue 19557: the new version
#                                                               cannot start on the old one's data
#   disk=none dseed=0 | run U=etcd.all@5/3:mid U=etcd.all@15/3:new   -> the documented path: every
#                                                               member to the intermediate version
#                                                               first, then to the new one
#   hydo explore --upgrades --seeds 1-40                     -> upgrades drawn among the other faults
#
# The version names are the build's parameters, so a schedule names the real versions:
# U=etcd1@5:3.6.0-rc.2. Every command of a member sees its version as $HYDO_VERSION.
name: etcd-upgrade
description: an etcd cluster grown with learners, upgraded member by member under faults

params:
  old: "3.5.5"
  new: "3.6.0-rc.2"
  mid: "3.5.26"

root:
  files:
    - {src: "etcd-v{{old}}/etcd", dst: "/opt/etcd-{{old}}/etcd", mode: "0755"}
    - {src: "etcd-v{{new}}/etcd", dst: "/opt/etcd-{{new}}/etcd", mode: "0755"}
    - {src: "etcd-v{{mid}}/etcd", dst: "/opt/etcd-{{mid}}/etcd", mode: "0755"}
    - {src: "etcd-v{{old}}/etcdctl", dst: /bin/etcdctl, mode: "0755"}
  text:
    /etc/etcd-member: |
      # etcd-member <n> <addr> <client-port> <peer-port> <initial-cluster> <state>: member n as
      # user etcd<n>, on the version in $HYDO_VERSION. exec all the way down, so the service's
      # PID is etcd itself (kills, pauses and an upgrade's SIGTERM hit etcd).
      exec su etcd$1 -s /bin/sh -c "exec /opt/etcd-$HYDO_VERSION/etcd --name etcd$1 \
        --data-dir /data/etcd$1 \
        --listen-client-urls http://$2:$3 --advertise-client-urls http://$2:$3 \
        --listen-peer-urls http://$2:$4 --initial-advertise-peer-urls http://$2:$4 \
        --initial-cluster $5 --initial-cluster-token hydo --initial-cluster-state $6 \
        --log-level warn"
    /etc/passwd: |
      root:x:0:0:root:/tmp:/bin/sh
      etcd1:x:1001:1001:etcd1:/tmp:/bin/sh
      etcd2:x:1002:1002:etcd2:/tmp:/bin/sh
      etcd3:x:1003:1003:etcd3:/tmp:/bin/sh
    /etc/group: |
      root:x:0:
      etcd1:x:1001:
      etcd2:x:1002:
      etcd3:x:1003:

data:
  size_mib: 512

env:
  IPR: /nix/store/dx4fsbxs5v82l9lzmjkpkhx5ygqcwm69-iproute2-6.8.0/bin/ip   # in the image with tc
  EPS: 127.0.0.11:2379,127.0.0.12:12379,127.0.0.13:22379
  C1: etcd1=http://127.0.0.11:2380
  C2: etcd1=http://127.0.0.11:2380,etcd2=http://127.0.0.12:12380
  C3: etcd1=http://127.0.0.11:2380,etcd2=http://127.0.0.12:12380,etcd3=http://127.0.0.13:22380

shell: |
  ectl() { /bin/etcdctl --dial-timeout=1s --command-timeout=2s "$@"; }
  ep_of() { case $1 in 0) echo 127.0.0.11:2379;; 1) echo 127.0.0.12:12379;; *) echo 127.0.0.13:22379;; esac; }
  rev_of() { printf '%s' "$1" | sed -n 's/.*"header":{[^}]*"revision":\([0-9]*\).*/\1/p'; }
  member_setup() {   # <n> <addr>: data dir owned by etcd<n>; uid 100<n> sends from <addr>
    mkdir -p /data/etcd$1 && chown etcd$1:etcd$1 /data/etcd$1 && chmod 700 /data/etcd$1 || return 1
    $IPR rule show | grep -q '^100:.*lookup local' || { $IPR rule add pref 100 lookup local && $IPR rule del pref 0; } || return 1
    $IPR route show table 10$1 | grep -q "src $2" || $IPR route add local 127.0.0.0/8 dev lo src $2 table 10$1 || return 1
    $IPR rule show | grep -q "uidrange 100$1-100$1" || $IPR rule add pref 10 uidrange 100$1-100$1 lookup 10$1
  }
  retry() {   # <seconds> <command...>: until it succeeds, at most that long
    local n=0 max=$1
    shift
    until "$@" > /tmp/hydo/retry.out 2>&1; do
      n=$((n + 1)); [ $n -lt $max ] || { cat /tmp/hydo/retry.out; return 1; }; sleep 1
    done
  }
  member_id() {   # <peer url>: the member's id in the cluster's member list
    ectl --endpoints=$EPS member list 2>/dev/null | grep "$1" | cut -d, -f1
  }
  join_learner() {   # <n> <peer url>: add member n as a learner, once (not on a restart)
    [ -d /data/etcd$1/member ] && return 0
    [ -n "$(member_id $2)" ] && return 0
    retry 60 ectl --endpoints=$EPS member add etcd$1 --learner --peer-urls=$2
  }
  promote() {   # <peer url>: promote that learner (it must have caught up first)
    local id; id=$(member_id $1)
    [ -n "$id" ] || return 1
    ectl --endpoints=$EPS member list 2>/dev/null | grep "$1" | grep -q ', true$' || return 0
    retry 60 ectl --endpoints=$EPS member promote $id
  }
  wait_quorum() {   # up to 60 s for a linearizable read through any member
    local n=0
    until ectl --endpoints=$EPS get hydo-probe > /dev/null 2>&1; do
      n=$((n + 1)); [ $n -lt 60 ] || return 1; sleep 1
    done
  }
  observe() {   # <client> <revision> <what>: a revision below this client's last one is a violation
    local f=/tmp/hydo/rev.$1 last
    last=$(tail -1 $f 2>/dev/null | cut -d' ' -f1)
    if [ -n "$last" ] && [ "$2" -lt "$last" ]; then
      echo "HYDO-ASSERT {\"t\":\"always\",\"id\":\"client.revisions_monotonic\",\"ok\":false,\"msg\":\"each client's observed revisions never go backwards\",\"details\":{\"out\":\"client $1 saw revision $2 ($3) after $last\"}}" > /dev/console
    fi
    echo "$2 $3" >> $f
  }
  client_op() {   # <client> <step>: put k<id>=v<id>, then read it back, through one member
    local c=$1 id ep out r
    id=$(($2 * 3 + $1)); ep=$(ep_of $((($1 + $2) % 3)))
    if out=$(ectl --endpoints=$ep -w json put k$id v$id 2>/dev/null) && r=$(rev_of "$out") && [ -n "$r" ]; then
      echo $id >> $HYDO_ACKED; echo "$id ack" >> $HYDO_OUTCOMES; observe $c $r put-k$id@$ep
    else
      echo "$id unknown" >> $HYDO_OUTCOMES
    fi
    out=$(ectl --endpoints=$ep -w json get k$id 2>/dev/null) && r=$(rev_of "$out") && [ -n "$r" ] && observe $c $r get-k$id@$ep
    return 0
  }

groups:
  - name: etcd
    services: [etcd1, etcd2, etcd3]

services:
  - name: etcd1
    addr: 127.0.0.11
    port: 2379
    version: "{{old}}"
    versions: [{name: "{{new}}"}, {name: "{{mid}}"}]
    setup: member_setup 1 127.0.0.11
    cmd: sh /etc/etcd-member 1 127.0.0.11 2379 2380 $C1 new
    ready: wget -q -T 2 -O /dev/null http://127.0.0.11:2380/version
  - name: etcd2
    addr: 127.0.0.12
    port: 12379
    version: "{{old}}"
    versions: [{name: "{{new}}"}, {name: "{{mid}}"}]
    setup: member_setup 2 127.0.0.12 && join_learner 2 http://127.0.0.12:12380
    cmd: sh /etc/etcd-member 2 127.0.0.12 12379 12380 $C2 existing
    ready: wget -q -T 2 -O /dev/null http://127.0.0.12:12380/version
  - name: etcd3
    addr: 127.0.0.13
    port: 22379
    version: "{{old}}"
    versions: [{name: "{{new}}"}, {name: "{{mid}}"}]
    # etcd allows one learner at a time: etcd2 is promoted before etcd3 joins
    setup: member_setup 3 127.0.0.13 && promote http://127.0.0.12:12380 && join_learner 3 http://127.0.0.13:22380
    cmd: sh /etc/etcd-member 3 127.0.0.13 22379 22380 $C3 existing
    ready: wget -q -T 2 -O /dev/null http://127.0.0.13:22380/version

provision: |
  promote http://127.0.0.13:22380 && wait_quorum && ectl --endpoints=$EPS put hydo-probe up &&
  ectl --endpoints=$EPS member list

workload:
  steps: 30                          # step i: clients 0,1,2 at once each put k<3i+c> and read it
                                     #   back, through members (c+i) mod 3
  timeout: 600
  process: etcdctl
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      client_op 0 $i & client_op 1 $i & client_op 2 $i &
      wait
      i=$((i + 1))
    done
  retry: |
    wait_quorum || exit 0
    i=0
    while [ $i -lt $((HYDO_STEPS * 3)) ]; do
      if ! grep -qx $i $HYDO_ACKED; then
        for a in 1 2 3; do
          ectl --endpoints=$EPS put k$i v$i > /dev/null 2>&1 && { echo $i >> $HYDO_ACKED; echo "$i ack" >> $HYDO_OUTCOMES; break; }
          sleep 1
        done
      fi
      i=$((i + 1))
    done

invariants:
  - id: etcd.acked_puts_readable
    msg: every put a client saw acknowledged is readable with its value after recovery
    cmd: |
      wait_quorum || { echo "no quorum within 60 s"; exit 2; }
      ectl --endpoints=$EPS get --prefix k > /tmp/hydo/kv 2>/dev/null || { echo "range read failed"; exit 2; }
      awk 'FILENAME == ARGV[1] { if (FNR % 2) k = $0; else v[k] = $0; next }
           { if (v["k" $1] != "v" $1) { print "acked put k" $1 " lost (read \"" v["k" $1] "\")"; bad = 1; exit } }
           END { if (bad) exit 1 }' /tmp/hydo/kv $HYDO_ACKED || exit 1
      echo "acked=$(wc -l < $HYDO_ACKED) all readable"
  - id: client.revisions_monotonic
    msg: each client's observed revisions never go backwards
    cmd: |
      n=0
      for f in /tmp/hydo/rev.0 /tmp/hydo/rev.1 /tmp/hydo/rev.2; do
        [ -f $f ] || continue
        n=$((n + $(wc -l < $f)))
        awk -v f=$f '$1 < last { print f ": revision " $1 " (" $2 ") after " last " (" what ")"; exit 1 } { last = $1; what = $2 }' $f || exit 1
      done
      echo "observations=$n monotonic"
  - id: etcd.voting_members
    msg: after the run the cluster has three voting members and no learner
    cmd: |
      wait_quorum || { echo "no quorum within 60 s"; exit 2; }
      l=$(ectl --endpoints=$EPS member list 2>/dev/null) || { echo "member list failed"; exit 2; }
      n=$(printf '%s\n' "$l" | grep -c ', false$')
      [ "$n" = 3 ] || { printf '%s\n' "$l"; echo "voting members: $n of 3"; exit 1; }
      echo "3 voting members"

faults: [kill, pause, network, oneway, cut, clock, disk]
