# hydo-mac.yaml: hydo.yaml for the Mac backend (Milestone 99), different in two places only: the
# arm64 images are `docker save` archives fetched by fetch-images-mac.sh (hvx/onboard/fetch_image.py,
# the same digests as fetch-images.sh's OCI copies; a Mac has no skopeo), and guest.ram_mib is 3072,
# because on the Mac the whole root (1.1 GB unpacked) is the initramfs in guest RAM. network: bridge
# makes the arm64 build use the second guest kernel, Image-explore-netns (recorded in the image).
#   sh fetch-images-mac.sh && hydo build hydo-mac.yaml      (the Mac release)
# Docker's example voting app (github.com/dockersamples/example-voting-app, commit 63e9150c,
# docker-compose.images.yml copied unmodified as docker-compose.yml) imported with hydo-compose:
#   hvx/onboard/hydo-compose docker-compose.yml     # -> hydo.generated.yaml (kept for comparison)
# then edited BY HAND in three places, each marked "hand-written:": the workload, the invariants and
# guest.ram_mib. vote (Python) pushes each vote to a Redis list; worker (.NET) pops it and upserts it
# into PostgreSQL; result (Node) reads PostgreSQL.
# network: bridge (Milestone 95): every service runs in its own network namespace at its addr:, so
# vote and result both listen on 0.0.0.0:80 as under Compose, and a fault on the link between two
# services acts on their real traffic. hydo-loopback.yaml is the Milestone 84 version (one shared
# loopback network, result moved to port 81), kept byte for byte.
# Try:  disk=none | run            -> OK: every acknowledged vote is counted in PostgreSQL
#       disk=none | run K=worker@5+5   -> OK: votes queue in Redis while the worker is down
#       disk=none | run N=vote-redis@5-12:loss,100%   -> OK, 13 of 20 acknowledged: vote cannot reach
#                                          Redis during steps 5..11, those votes get no answer
#
# Generated by hvx/onboard/hydo-compose from docker-compose.yml.
# A STARTING POINT: the services, images, readiness checks and volumes come from the Compose
# file; the workload and the invariants are TODO (search for TODO). The hydo-onboard skill
# (.claude/skills/hydo-onboard) fills them in. MANIFEST.md, "From Docker Compose", explains
# every mapping.
#
# 1. sh fetch-images.sh           # fetch the images by digest (needs network, once)
# 2. write the workload and the invariants below
# 3. HYDO_SEEDRNG=<pinned hvx_seedrng> hvx/onboard/hydo-build hydo.yaml   (or: hydo build)
#
# WARNINGS (also printed by hydo-compose):
# - service worker: no healthcheck and no port: readiness is just `started`; write a ready: check
# - service redis: bind mount ./healthchecks:/healthchecks is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - service db: bind mount ./healthchecks:/healthchecks is copied into the READ-ONLY root at build time; if the program writes there, make it a named volume (then it lives on the data disk)
# - networks front-tier, back-tier: all services share one bridge network in the guest, so the isolation between Compose networks is not modelled (every service can reach every other)
name: compose-voting
description: "imported from docker-compose.yml (5 services); TODO: what is tested"

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
