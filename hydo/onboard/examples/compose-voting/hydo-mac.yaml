  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1280   # the data disk: every volume lives here (the fault target)
  dirs: [vol/db-data]

root:
  files:                 # bind-mount sources, copied into the read-only root
    - {src: healthchecks, dst: /etc/hydo/compose/bind/0-healthchecks}
  text:
