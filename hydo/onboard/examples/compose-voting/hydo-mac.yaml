# hand-written: step i = one vote by voter<i> (a on even steps, b on odd) through the vote app's
# web form; acknowledged = HTTP 200 (the vote is then in the Redis list "votes").
workload:
  steps: 20
  run: |
    i=$HYDO_FROM
    while [ $i -lt $HYDO_TO ]; do
      v=a; [ $((i % 2)) = 1 ] && v=b
      if wget -q -T 5 -O /dev/null --header "Cookie: voter_id=voter$i" --post-data "vote=$v" http://vote/ 2>/dev/null; then
        echo voter$i >> $HYDO_ACKED; echo "voter$i ack" >> $HYDO_OUTCOMES
      else
        echo "voter$i unknown" >> $HYDO_OUTCOMES
      fi
      i=$((i + 1))
    done
  timeout: 300
  process: wget

shell: |
  # hand-written: every acknowledged vote is a row (voter, vote) in PostgreSQL's votes table.
  # The message says what the check saw (Milestone 134): the database did not answer, the votes
  # table is not there yet (the .NET worker creates it only after its first database connection),
  # or too few votes are counted. A check that cannot decide exits 2, a missing vote 1.
  votes_counted() {
    got=$(hydo-oci db psql -U postgres -tAc "select id || ' ' || vote from votes" 2>/tmp/votes_counted.err) || {
      if grep -q 'relation "votes" does not exist' /tmp/votes_counted.err; then
        echo "no vote counted yet: the votes table does not exist (the worker creates it at its first database connection)"
      else
        echo "db not answering: $(head -1 /tmp/votes_counted.err)"
      fi
      return 2; }
    n=0; total=0; missing=""
    for id in $(cat $HYDO_ACKED); do
      i=${id#voter}; v=a; [ $((i % 2)) = 1 ] && v=b
      total=$((total + 1))
      if echo "$got" | grep -qx "$id $v"; then n=$((n + 1)); else [ -n "$missing" ] || missing="$id (vote $v)"; fi
    done
    [ -z "$missing" ] || { echo "too few votes counted: $n of $total acknowledged votes are in PostgreSQL; $missing is not"; return 1; }
    echo "all $n acknowledged votes counted"
  }

# hand-written invariants
invariants:
  - id: votes.counted_soon
    msg: every acknowledged vote reaches PostgreSQL within 60 s after the faults end
    type: eventually
    within: 60
    cmd: votes_counted
  - id: votes.counted
    msg: every acknowledged vote is counted, with the choice the voter made
    cmd: votes_counted

faults: [kill, pause, network, oneway, cut, clock, disk]
