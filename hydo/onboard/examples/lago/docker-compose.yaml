# Lago v1.57.0 (open-source usage-based billing) as its docker-compose.yml runs it, cut down to
# the billing core: PostgreSQL, Redis, the one-shot migration, the Rails API, one Sidekiq worker
# and the clock (clockwork, which starts the hourly billing). Left out of Lago's file: the web
# front end (`front`, a UI), and the PDF renderer (`pdf`, Gotenberg; PDF generation is turned off
# with LAGO_DISABLE_PDF_GENERATION). The values that Lago's file reads from the shell are written
# out here: the organization and its API key are created by the migration (LAGO_CREATE_ORG), and
# LAGO_RSA_PRIVATE_KEY is a throwaway key made for this example with
# `openssl genrsa 2048 | base64` (it signs the UI's session tokens, which no test uses).
volumes:
  lago_postgres_data:
  lago_redis_data:
  lago_storage_data:

x-backend-environment: &backend-env
  DATABASE_URL: postgresql://lago:changeme@db:5432/lago?search_path=public
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ""
  SECRET_KEY_BASE: your-secret-key-base-hex-64
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_RSA_PRIVATE_KEY: 
  LAGO_SIDEKIQ_WEB: "true"
  LAGO_ENCRYPTION_PRIMARY_KEY: your-encryption-primary-key
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: your-encryption-deterministic-key
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: your-encryption-derivation-salt
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_PDF_URL: http://pdf:3000
  LAGO_DATA_API_URL: http://data-api
  LAGO_REDIS_CACHE_URL: redis://redis:6379
  LAGO_DISABLE_SEGMENT: "true"
  LAGO_DISABLE_SIGNUP: "false"
  LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
  LAGO_DISABLE_PDF_GENERATION: "true"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
  LAGO_CREATE_ORG: "true"
  LAGO_ORG_USER_PASSWORD: changeme-hydo
  LAGO_ORG_USER_EMAIL: billing@example.com
  LAGO_ORG_NAME: hydo
  LAGO_ORG_API_KEY: hydo-test-api-key
  LAGO_API_URL: http://localhost:3000
  LAGO_FRONT_URL: http://localhost

services:
  db:
    image: getlago/postgres-partman:15.0-alpine
    container_name: lago-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: changeme
      PGDATA: /data/postgres
      PGPORT: 5432
      POSTGRES_SCHEMA: public
    volumes:
      - lago_postgres_data:/data/postgres
    ports:
      - 5432:5432

  redis:
    image: redis:7.4.7-alpine
    container_name: lago-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --port 6379
    volumes:
      - lago_redis_data:/data
    ports:
      - 6379:6379

  migrate:
    image: getlago/api:v1.57.0
    container_name: lago-migrate
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: ["./scripts/migrate.sh"]
    environment:
      <<: *backend-env

  api:
    image: getlago/api:v1.57.0
    container_name: lago-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.api.sh"]
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s
      start_period: 30s
      timeout: 60s
      start_interval: 2s
    environment:
      <<: *backend-env
    volumes:
      - lago_storage_data:/app/storage
    ports:
      - 3000:3000

  api-worker:
    image: getlago/api:v1.57.0
    container_name: lago-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.worker.sh"]
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 10s
      start_period: 30s
      timeout: 60s
      start_interval: 2s
    environment:
      <<: *backend-env
    volumes:
      - lago_storage_data:/app/storage

  api-clock:
    image: getlago/api:v1.57.0
    container_name: lago-clock
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.clock.sh"]
    environment:
      <<: *backend-env
