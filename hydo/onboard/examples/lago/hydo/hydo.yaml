# Lago v1.57.0 (usage-based billing: a Rails API, a Sidekiq worker and a clock on PostgreSQL and
# Redis), cut down to its billing core. From `hydo compose ../docker-compose.yaml --out hydo.yaml
# --images-dir images` (the raw import is hydo.generated.yaml); hand changes are marked `hand:`.
# RESULTS.md (next to this folder) says what was hunted and found.
#
#   sh fetch-images.sh                       # the three images by digest (network, once)
#   hydo build hydo.yaml
#   hydo run "disk=none | run"
#   hydo explore --seeds 1-20 --strategy process --new-faults
format: 1
hydo_version: "0.3"
name: lago
description: "Lago billing usage events: every acknowledged event is billed exactly once, invoices add up, one invoice per period, and faults do not change what is billed"

params:
  redis_aof: "no"   # hand: Redis's appendonly setting; Lago's docker-compose.yml leaves it at Redis's default, no

network: bridge   # each service in its own network namespace at its addr: (MANIFEST.md "Service networks")

guest:
  ram_mib: 4096   # hand: the importer guessed 1792; three Rails processes, PostgreSQL, and the image roots (in guest RAM on the Mac)
  clock_start: 1796082900   # hand: 2026-11-30 23:55 UTC, so that the workload runs across the end of November (the billing period)
  clock_after_cut: 60       # hand: the recovery boot continues the clock (billing periods depend on it)
  outcomes_after_cut: true  # hand: the business-result check reads $HYDO_OUTCOMES, also after a power cut
  # cpu: v3     # uncomment if a service stops with "invalid opcode" (an image built for AVX2)

data:
  size_mib: 1792   # the data disk: every volume lives here (the fault target)
  dirs: [vol/lago_postgres_data, vol/anon-db-var-lib-postgresql-data, vol/lago_redis_data, vol/lago_storage_data]

root:
  share_images: true   # hand: migrate, api, api_worker and api_clock run one image; one unpacked tree in guest RAM, not four
  text:
    /etc/hosts: |   # Compose service names -> each service's addr:
      127.0.0.1 localhost
      ::1 localhost ip6-localhost ip6-loopback
      10.89.0.11 db lago-db
      10.89.0.12 redis lago-redis
      10.89.0.13 migrate lago-migrate
      10.89.0.14 api lago-api
      10.89.0.15 api-worker lago-worker
      10.89.0.16 api-clock lago-clock

services:
  # Compose service db
  # image getlago/postgres-partman:15.0-alpine = docker.io/getlago/postgres-partman@sha256:27a1e3a1138a69b5a0911ce125dfa613b9ced07604a2d781b9d31141f7f96036
  #   linux/amd64: sha256:ff4616c24367f3643aac27061a0c4e757ca8f78af967249cb4b3fd64049d290d
  #   linux/arm64: sha256:4bfb4eb22be0f9149efb04724ecb573ad1374a6b8b717bece93cae50491cc68f
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  # the image declares VOLUME /var/lib/postgresql/data: an anonymous volume on the data disk
  - name: db
    image: {x86_64: images/getlago-postgres-partman-15.0-alpine-amd64.docker.tar, arm64: images/getlago-postgres-partman-15.0-alpine-arm64-oci}
    image_ref: "getlago/postgres-partman:15.0-alpine"
    env:
      POSTGRES_DB: "lago"
      POSTGRES_USER: "lago"
      POSTGRES_PASSWORD: "changeme"
      PGDATA: "/data/postgres"
      PGPORT: "5432"
      POSTGRES_SCHEMA: "public"
    port: 5432
    addr: 10.89.0.11
    ready: "timeout 5 hydo-oci db /bin/sh -c 'pg_isready -U lago -d lago -h localhost -p 5432'"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/lago_postgres_data, dst: /data/postgres, copy_up: true}
      - {src: /data/vol/anon-db-var-lib-postgresql-data, dst: /var/lib/postgresql/data, copy_up: true}
  # Compose service redis
  # image redis:7.4.7-alpine = docker.io/library/redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
  #   linux/amd64: sha256:b9f6cf0cab55fdd102fd2182deeae150457943d33439d18c6e2fc5666d3228c1
  #   linux/arm64/v8: sha256:eaa5baba4031beadea0a970d578807f96ff6caf9282f1878f316059ed889a178
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: redis
    image: {x86_64: images/redis-7.4.7-alpine-amd64.docker.tar, arm64: images/redis-7.4.7-alpine-arm64-oci}
    image_ref: "redis:7.4.7-alpine"
    # hand: the append-only file is a build parameter: Lago's file runs Redis with its defaults
    # (no append-only file), `hydo build --set redis_aof=yes` builds the variant that keeps every
    # queued job on disk (appendfsync always). With "no" the extra options change nothing.
    cmd: ["--port", "6379", "--appendonly", "{{redis_aof}}", "--appendfsync", "always"]
    port: 6379
    addr: 10.89.0.12
    ready: "timeout 5 hydo-oci redis redis-cli -p 6379 ping"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/lago_redis_data, dst: /data}
  # Compose service migrate
  # image getlago/api:v1.57.0 = docker.io/getlago/api@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
  #   linux/amd64: sha256:8ccbea4191f30d85ee98dd0fa9b7091128286f764aedb122831e78180fa69faa
  #   linux/arm64: sha256:8e74b935cc902b363ecbd2050fef0375721ce5e21f2f59e39aece35e79c63d4c
  # a one-shot job (others depend on it with service_completed_successfully): it idles here, its command runs in the setup: of each service that waits for it, and job: true keeps the explorer's faults off it
  - name: migrate
    image: {x86_64: images/getlago-api-v1.57.0-amd64.docker.tar, arm64: images/getlago-api-v1.57.0-arm64-oci}
    image_ref: "getlago/api:v1.57.0"
    entrypoint: [/.hydo/busybox, sleep, "2147483647"]
    env:
      DATABASE_URL: "postgresql://lago:changeme@db:5432/lago?search_path=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD: ""
      SECRET_KEY_BASE: "your-secret-key-base-hex-64"
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_RSA_PRIVATE_KEY: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_ENCRYPTION_PRIMARY_KEY: "your-encryption-primary-key"
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: "your-encryption-deterministic-key"
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "your-encryption-derivation-salt"
      LAGO_USE_AWS_S3: "false"
      LAGO_USE_GCS: "false"
      LAGO_PDF_URL: "http://pdf:3000"
      LAGO_DATA_API_URL: "http://data-api"
      LAGO_REDIS_CACHE_URL: "redis://redis:6379"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
      LAGO_DISABLE_PDF_GENERATION: "true"
      LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_USER_PASSWORD: "changeme-hydo"
      LAGO_ORG_USER_EMAIL: "billing@example.com"
      LAGO_ORG_NAME: "hydo"
      LAGO_ORG_API_KEY: "hydo-test-api-key"
      LAGO_API_URL: "http://localhost:3000"
      LAGO_FRONT_URL: "http://localhost"
    addr: 10.89.0.13
    depends_on: [db]
    ready: "true"
    job: true   # a one-shot job: never a fault target (MANIFEST.md "One-shot jobs")
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
  # Compose service api
  # image getlago/api:v1.57.0 = docker.io/getlago/api@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
  #   linux/amd64: sha256:8ccbea4191f30d85ee98dd0fa9b7091128286f764aedb122831e78180fa69faa
  #   linux/arm64: sha256:8e74b935cc902b363ecbd2050fef0375721ce5e21f2f59e39aece35e79c63d4c
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: api
    image: {x86_64: images/getlago-api-v1.57.0-amd64.docker.tar, arm64: images/getlago-api-v1.57.0-arm64-oci}
    image_ref: "getlago/api:v1.57.0"
    cmd: [./scripts/start.api.sh]
    env:
      DATABASE_URL: "postgresql://lago:changeme@db:5432/lago?search_path=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD: ""
      SECRET_KEY_BASE: "your-secret-key-base-hex-64"
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_RSA_PRIVATE_KEY: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_ENCRYPTION_PRIMARY_KEY: "your-encryption-primary-key"
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: "your-encryption-deterministic-key"
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "your-encryption-derivation-salt"
      LAGO_USE_AWS_S3: "false"
      LAGO_USE_GCS: "false"
      LAGO_PDF_URL: "http://pdf:3000"
      LAGO_DATA_API_URL: "http://data-api"
      LAGO_REDIS_CACHE_URL: "redis://redis:6379"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
      LAGO_DISABLE_PDF_GENERATION: "true"
      LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_USER_PASSWORD: "changeme-hydo"
      LAGO_ORG_USER_EMAIL: "billing@example.com"
      LAGO_ORG_NAME: "hydo"
      LAGO_ORG_API_KEY: "hydo-test-api-key"
      LAGO_API_URL: "http://localhost:3000"
      LAGO_FRONT_URL: "http://localhost"
    port: 3000
    addr: 10.89.0.14
    depends_on: [migrate, db, redis]
    setup: "[ -f /tmp/hydo/job.migrate.done ] || { hydo-oci migrate /.hydo/busybox chpst -u nonroot ./scripts/migrate.sh && : > /tmp/hydo/job.migrate.done; }"
    ready: "timeout 30 hydo-oci api /.hydo/busybox chpst -u nonroot /bin/sh -c 'curl -f http://localhost:3000/health || exit 1'"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/lago_storage_data, dst: /app/storage, copy_up: true}
      - {src: /hydo/workload, dst: /hydo/workload}   # hand: the test client runs with the image's Ruby
  # Compose service api-worker
  # image getlago/api:v1.57.0 = docker.io/getlago/api@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
  #   linux/amd64: sha256:8ccbea4191f30d85ee98dd0fa9b7091128286f764aedb122831e78180fa69faa
  #   linux/arm64: sha256:8e74b935cc902b363ecbd2050fef0375721ce5e21f2f59e39aece35e79c63d4c
  # ready: from Compose healthcheck
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: api_worker
    image: {x86_64: images/getlago-api-v1.57.0-amd64.docker.tar, arm64: images/getlago-api-v1.57.0-arm64-oci}
    image_ref: "getlago/api:v1.57.0"
    cmd: [./scripts/start.worker.sh]
    env:
      DATABASE_URL: "postgresql://lago:changeme@db:5432/lago?search_path=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD: ""
      SECRET_KEY_BASE: "your-secret-key-base-hex-64"
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_RSA_PRIVATE_KEY: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_ENCRYPTION_PRIMARY_KEY: "your-encryption-primary-key"
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: "your-encryption-deterministic-key"
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "your-encryption-derivation-salt"
      LAGO_USE_AWS_S3: "false"
      LAGO_USE_GCS: "false"
      LAGO_PDF_URL: "http://pdf:3000"
      LAGO_DATA_API_URL: "http://data-api"
      LAGO_REDIS_CACHE_URL: "redis://redis:6379"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
      LAGO_DISABLE_PDF_GENERATION: "true"
      LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_USER_PASSWORD: "changeme-hydo"
      LAGO_ORG_USER_EMAIL: "billing@example.com"
      LAGO_ORG_NAME: "hydo"
      LAGO_ORG_API_KEY: "hydo-test-api-key"
      LAGO_API_URL: "http://localhost:3000"
      LAGO_FRONT_URL: "http://localhost"
    addr: 10.89.0.15
    depends_on: [migrate, db, redis]
    setup: "[ -f /tmp/hydo/job.migrate.done ] || { hydo-oci migrate /.hydo/busybox chpst -u nonroot ./scripts/migrate.sh && : > /tmp/hydo/job.migrate.done; }"
    ready: "timeout 30 hydo-oci api_worker /.hydo/busybox chpst -u nonroot /bin/sh -c 'curl -f http://localhost:8080 || exit 1'"
    ready_timeout: 120
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/lago_storage_data, dst: /app/storage, copy_up: true}
  # Compose service api-clock
  # image getlago/api:v1.57.0 = docker.io/getlago/api@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
  #   linux/amd64: sha256:8ccbea4191f30d85ee98dd0fa9b7091128286f764aedb122831e78180fa69faa
  #   linux/arm64: sha256:8e74b935cc902b363ecbd2050fef0375721ce5e21f2f59e39aece35e79c63d4c
  # ready: TODO no healthcheck and no port -- `true` means started
  # restart: unless-stopped: an agent image starts the service again when its process ends by itself while the test runs (MANIFEST.md "Restart policies"); hydo's kill faults keep their own restart points
  - name: api_clock
    image: {x86_64: images/getlago-api-v1.57.0-amd64.docker.tar, arm64: images/getlago-api-v1.57.0-arm64-oci}
    image_ref: "getlago/api:v1.57.0"
    cmd: [./scripts/start.clock.sh]
    env:
      DATABASE_URL: "postgresql://lago:changeme@db:5432/lago?search_path=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD: ""
      SECRET_KEY_BASE: "your-secret-key-base-hex-64"
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_RSA_PRIVATE_KEY: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_ENCRYPTION_PRIMARY_KEY: "your-encryption-primary-key"
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: "your-encryption-deterministic-key"
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "your-encryption-derivation-salt"
      LAGO_USE_AWS_S3: "false"
      LAGO_USE_GCS: "false"
      LAGO_PDF_URL: "http://pdf:3000"
      LAGO_DATA_API_URL: "http://data-api"
      LAGO_REDIS_CACHE_URL: "redis://redis:6379"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
      LAGO_DISABLE_PDF_GENERATION: "true"
      LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"
      LAGO_CREATE_ORG: "true"
      LAGO_ORG_USER_PASSWORD: "changeme-hydo"
      LAGO_ORG_USER_EMAIL: "billing@example.com"
      LAGO_ORG_NAME: "hydo"
      LAGO_ORG_API_KEY: "hydo-test-api-key"
      LAGO_API_URL: "http://localhost:3000"
      LAGO_FRONT_URL: "http://localhost"
    addr: 10.89.0.16
    depends_on: [migrate, db, redis]
    setup: "[ -f /tmp/hydo/job.migrate.done ] || { hydo-oci migrate /.hydo/busybox chpst -u nonroot ./scripts/migrate.sh && : > /tmp/hydo/job.migrate.done; }"
    ready: "true"
    restart: "unless-stopped"
    mounts:
      - {src: /etc/hosts, dst: /etc/hosts}
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}

workload:
  steps: 10
  timeout: 600

test:
  parallel: 4
  per_round: 2
  round_ms: 1500
  command_timeout: 90
  drain_timeout: 120
  check_within: 180
  first_records: true   # hand: the seed's acknowledged events (first_seed) are among the run's records

faults: [kill, pause, network, oneway, cut, clock, disk]
# hand: Lago's clock service starts the biller at minute 10 of every hour, and November is billed on
# December 1; the explorer's clock faults also step to 2 s before such a tick and to the month's
# first tick (MANIFEST.md "Clock steps to a time")
clock_points: ["@:10-2s", "@month+9m58s"]

