# Known error kinds: lines a service writes to its log that are expected (hydo/onboard/MANIFEST.md,
# "Error logs as findings"). Each entry needs a reason; `hydo errors accept` appends them.
#   sig:    the kind's signature (or match: a regular expression on its template)
#   with:   only in runs whose schedule has one of these faults (K=mysql, C, disk, R=everysec)
#   during: only for lines written while one of these faults was on
format: 1
unknown: report       # report: a new kind is a finding; fail: it also fails the run
known:
  - sig: 1a5f5dc37e59
    service: restate
    tpl: "<time> ERROR octocrab"
    example: "2026-11-17T00:00:00.219741Z ERROR octocrab"
    reason: "Restate's check for a newer release on GitHub at start (server/src/build_info.rs): the guest has no network"
    date: "2026-11-17"
  - sig: 4ce100431748
    service: restate
    tpl: "<time> ERROR restate_server"
    example: "2026-11-17T00:00:06.837067Z ERROR restate_server"
    with: [G]
    reason: "Restate stops at start on a damaged file of its storage (G=): it detects the damage, and the run is the class corrupted-files"
    date: "2026-11-17"
