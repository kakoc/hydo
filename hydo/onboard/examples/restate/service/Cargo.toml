[package]
name = "rsv"
version = "0.1.0"
edition = "2024"
description = "The Restate example's service (rsv serve, on restate-sdk) and its test client (the workload's operations and the checks)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rsv"
path = "src/main.rs"

[dependencies]
restate-sdk = "=0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 2
debug = false
strip = true
codegen-units = 4

# A crate of its own: not a member of hydo's workspace.
[workspace]
