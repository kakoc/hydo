# Garage v2.5.0, the configuration of all three nodes (RESULTS.md, "The project"). Each node
# finds its own address in the guest's service network (rpc_public_addr_subnet). The durability
# settings metadata_fsync and data_fsync are true here; hydo.yaml's build parameter fsync picks
# this file or its twin. Garage's own default is false for both.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
lmdb_map_size = "4G"
metadata_fsync = true
data_fsync = true

replication_factor = 3
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"
rpc_public_addr_subnet = "10.89.0.0/24"
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "hydo-garage-admin-token"
