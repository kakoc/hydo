# Gitea as its documentation runs it with Docker, the rootless image and SQLite
# (https://docs.gitea.com/installation/install-with-docker-rootless): one container, the
# data and the configuration in two volumes. The installation is locked by the environment, so
# the first account that registers is the administrator.
services:
  server:
    image: docker.gitea.com/gitea:28.4.0-rootless
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://server:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/var/lib/gitea
      - ./config:/etc/gitea
    restart: always
