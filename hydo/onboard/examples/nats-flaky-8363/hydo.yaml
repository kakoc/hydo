# A flaky Go unit test inside one program: nats-server issue 8363, TestRegisterAndUnregister in
# server/ats. No services: the workload runs the compiled test binary once, as one process with
# -test.count={{count}} (the failure needs two iterations in one process: the goroutine left by
# one iteration's deferred Unregister is counted by the next iteration's baseline), and the
# invariant turns a "--- FAIL" into a violation with the test's own output.
# Build the binaries first: sh build-test.sh (bin/ats-buggy.test, bin/ats-fixed.test).
#   hydo build hydo.yaml                                     # buggy, count 2, GOMAXPROCS default
#   hydo build hydo.yaml --set variant=fixed                 # pull request 8794
#   hydo build hydo.yaml --set procs=2                       # GOMAXPROCS=2 (needs 2+ vCPUs)
# RESULTS.md has the schedules, rates and fingerprints.
name: nats-flaky-8363
description: nats-server's flaky TestRegisterAndUnregister (issue 8363), one test process per run.

params:
  variant: buggy        # buggy | fixed: which binary of build-test.sh runs
  count: "2"            # -test.count: iterations in the one process
  procs: ""             # GOMAXPROCS for the test; empty: Go's default (the guest's CPUs)

root:
  files:
    - {src: "bin/ats-{{variant}}.test", dst: /bin/ats.test, mode: "0755"}

data:
  size_mib: 64
  dirs: [t]

workload:
  steps: 4                # the explorer needs at least 4 steps; the test runs in step 0 only
  run: |
    [ "$HYDO_FROM" = 0 ] || exit 0
    procs="{{procs}}"
    [ -n "$procs" ] && export GOMAXPROCS=$procs
    echo "hydo-ats: cpus=$(grep -c ^processor /proc/cpuinfo) GOMAXPROCS=${GOMAXPROCS:-default} count={{count}} variant={{variant}}" > /dev/console
    cd /data/t
    /bin/ats.test -test.run '^TestRegisterAndUnregister$' -test.count={{count}} -test.v > out 2>&1
    echo "rc=$?" >> out
    sed 's/^/hydo-ats: /' out > /dev/console
    sync
    echo 0 >> $HYDO_ACKED

invariants:
  - id: ats.test_passes
    msg: every iteration of TestRegisterAndUnregister passes in one test process
    cmd: |
      [ -f /data/t/out ] || { echo "no test output"; exit 1; }
      pass=$(grep -c -- '^--- PASS' /data/t/out)
      fail=$(grep -c -- '^--- FAIL' /data/t/out)
      if [ "$fail" = 0 ] && [ "$pass" = "{{count}}" ]; then echo "pass=$pass of {{count}}"; exit 0; fi
      line=$(grep -m1 'ats_test.go' /data/t/out | sed 's/^ *//')
      seq=$(grep -- '^--- ' /data/t/out | cut -c5-8 | tr '\n' ' ')
      echo "pass=$pass fail=$fail order=[$seq] $line"; exit 1

faults: [clock]
