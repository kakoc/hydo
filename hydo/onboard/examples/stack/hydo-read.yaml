# The four-service stack (examples/stack/hydo.yaml) with its invariants written with the
# ready-made store readers (hvx/readers: hydo-read, hydo-check; MANIFEST.md "Reading the
# stores") instead of hand-written shell and the order service's own oracle role. Everything
# else (services, workload, knobs, faults) is the same as hydo.yaml, except one shell helper
# that records the old order service's failures (see `place` below).
#
# Build on the build box: FRONT=fix|old hvx/onboard/examples/stack/build-read.sh
#   -> build/explore-ob-stack-read-<fix|old>-disk.img
name: stack
description: MySQL + Kafka + Redis behind a gRPC front door; orders must be exactly-once.

guest:
  ram_mib: 1024
  clock_start: 1767225600         # 2026-01-01; the guest has no RTC

root:
  size_mib: 1792
  nix:                            # store paths; each full closure is staged at the same path
    - /nix/store/aw6ljbiwgds7yw8x2jc3340dm46s7i2k-mysql-8.4.10
    - /nix/store/vjcrra860yal7fzk1m81ddirrafqrccz-openjdk-headless-17.0.7+7
  files:
    - {src: /nix/store/prk07apdgqqjcqyxr5fqww1y8bxpw7z9-apache-kafka-2.13-3.5.0/libs, dst: /opt/kafka/libs}
    - {src: ~/hydo/build/redis-server, dst: /bin/redis-server, mode: "0755"}
    - {src: ~/hydo/build/redis-cli, dst: /bin/redis-cli, mode: "0755"}
    - {src: front-door, dst: /bin/hydostack, mode: "0755"}   # build.sh links the chosen binary here
  text:
    /etc/redis.conf: |
      port 6379
      bind 127.0.0.1
      protected-mode no
      dir /data/redis
      save ""
      appendonly yes
      appendfsync always
      appenddirname appendonlydir
      appendfilename appendonly.aof
      auto-aof-rewrite-percentage 0
      aof-load-truncated yes
      aof-timestamp-enabled no
      daemonize no
      loglevel notice
      hz 1
      dynamic-hz no
    /etc/my.cnf: |
      [mysqld]
      user=root
      datadir=/data/mysql
      socket=/tmp/mysql.sock
      pid-file=/tmp/mysqld.pid
      log-error=/tmp/mysqld.err
      bind-address=127.0.0.1
      port=3306
      mysqlx=OFF
      skip-name-resolve
      skip-log-bin
      performance_schema=OFF
      auto_generate_certs=OFF
      caching_sha2_password_auto_generate_rsa_keys=OFF
      innodb_buffer_pool_size=32M
      innodb_redo_log_capacity=8M
      innodb_use_native_aio=OFF
      innodb_flush_method=fsync
      innodb_read_io_threads=1
      innodb_write_io_threads=1
      innodb_page_cleaners=1
      innodb_purge_threads=1
      max_connections=8
      table_open_cache=64
      default-time-zone=+00:00
      init-file=/etc/mysql-init.sql
      innodb_flush_log_at_trx_commit=1
    /etc/mysql-init.sql: |
      CREATE USER IF NOT EXISTS 'hydo'@'%' IDENTIFIED BY '';
      GRANT ALL PRIVILEGES ON *.* TO 'hydo'@'%';
    /etc/kafka/server.properties: |
      process.roles=broker,controller
      node.id=1
      controller.quorum.voters=1@127.0.0.1:9093
      listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
      inter.broker.listener.name=PLAINTEXT
      controller.listener.names=CONTROLLER
      listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      advertised.listeners=PLAINTEXT://127.0.0.1:9092
      log.dirs=/data/kafka-logs
      num.partitions=1
      default.replication.factor=1
      offsets.topic.replication.factor=1
      offsets.topic.num.partitions=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      auto.create.topics.enable=true
      num.network.threads=2
      num.io.threads=2
      background.threads=2
      log.index.size.max.bytes=1048576
      log.segment.bytes=16777216
      metadata.log.segment.bytes=8388608
      group.initial.rebalance.delay.ms=0
      log.flush.interval.messages=1
    /etc/kafka/log4j.properties: |
      log4j.rootLogger=WARN, stdout
      log4j.appender.stdout=org.apache.log4j.ConsoleAppender
      log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
      log4j.appender.stdout.layout.ConversionPattern=%p %c %m%n
      log4j.logger.kafka.server.KafkaRaftServer=INFO

data:
  size_mib: 512
  mount: rw
  dirs: [redis, kafka-logs]

env:
  MYSQL: /nix/store/aw6ljbiwgds7yw8x2jc3340dm46s7i2k-mysql-8.4.10
  JAVA: /nix/store/vjcrra860yal7fzk1m81ddirrafqrccz-openjdk-headless-17.0.7+7/bin/java
  NORDERS: "30"
  GOMAXPROCS: "1"
  KAFKA_CLUSTER_ID: P0hH8j92QAKKXdQ2D7Aw7A
  JCOMMON: >-
    -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-BackgroundCompilation -XX:+UseSerialGC
    -XX:-UsePerfData -XX:-UseContainerSupport -XX:ActiveProcessorCount=1 -Xshare:off
    -Djava.security.egd=file:/dev/urandom -Duser.name=hydo -Duser.home=/tmp -Duser.timezone=UTC
    -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp
    -Dlog4j.configuration=file:/etc/kafka/log4j.properties

shell: |
  SQL() { "$MYSQL/bin/mysql" --no-defaults --protocol=TCP -h127.0.0.1 -P3306 -uhydo --ssl-mode=DISABLED -N -B "$@"; }
  # The pre-M39 order service's client (FRONT=old) writes no $HYDO_OUTCOMES: for it every
  # error the server returned is a definite failure ("hydostack: place <id> failed: ..."). Record
  # those as `failed`, so the told-failed check below sees what that client was told. The fixed
  # client records its own outcomes ("failed (unknown): ...") and is not matched here.
  place() {
    local prc; /bin/hydostack "$@" > /tmp/hydo/place.out 2>&1; prc=$?
    cat /tmp/hydo/place.out
    sed -n 's/^hydostack: place \([0-9][0-9]*\) failed: .*/\1 failed/p' /tmp/hydo/place.out >> $HYDO_OUTCOMES
    return $prc
  }

services:
  - name: redis
    cmd: /bin/redis-server /etc/redis.conf
    ready: /bin/redis-cli -p 6379 ping | grep -q PONG
    ready_timeout: 60
    port: 6379
  - name: mysql
    setup: '[ -d /data/mysql/mysql ] || "$MYSQL/bin/mysqld" --defaults-file=/etc/my.cnf --initialize-insecure'
    cmd: '"$MYSQL/bin/mysqld" --defaults-file=/etc/my.cnf'
    ready: SQL -e "SELECT 1"
    ready_timeout: 600
    port: 3306
  - name: kafka
    setup: $JAVA $JCOMMON -Xms96m -Xmx96m -cp "/opt/kafka/libs/*" kafka.tools.StorageTool format -t $KAFKA_CLUSTER_ID -c /etc/kafka/server.properties --ignore-formatted
    cmd: $JAVA $JCOMMON -Xms256m -Xmx256m -cp "/opt/kafka/libs/*" kafka.Kafka /etc/kafka/server.properties
    ready: grep -qa "Kafka Server started" $HYDO_LOG
    ready_timeout: 600
    port: 9092
  - name: front
    description: the gRPC front door (creates the schema and the topic at start)
    cmd: /bin/hydostack server
    ready: grep -qa "server listening" $HYDO_LOG
    depends_on: [redis, mysql, kafka]
    recovery: false                 # the recovery check reads the stores directly

workload:
  steps: 30                         # one step = one order
  run: place place $HYDO_FROM $HYDO_TO              # ACKed ids -> $HYDO_ACKED, outcomes -> $HYDO_OUTCOMES
  retry: /bin/hydostack retry $NORDERS $HYDO_ACKED  # re-place every un-ACKed order with the same id
  process: hydostack (place|retry)

knobs:
  - token: M
    name: MySQL innodb_flush_log_at_trx_commit
    default: "1"
    safe: "1"
    values: ["0", "1", "2"]
    set: SQL -e "SET GLOBAL innodb_flush_log_at_trx_commit=$HYDO_VALUE"
  - token: R
    name: Redis appendfsync
    default: always
    safe: always
    values: [always, everysec, "no"]
    set: /bin/redis-cli -p 6379 CONFIG SET appendfsync $HYDO_VALUE

invariants:
  # The stores, as sources (one argument each, see hydo-check --help):
  #   MySQL   mysql hydo:@tcp(127.0.0.1:3306)/ "<query>"      rows
  #   Kafka   kafka 127.0.0.1:9092 orders                     every record, item = its key
  #   Redis   redis 127.0.0.1:6379 scan "order:*"             every cached order
  #   client  hydo acked | hydo told-failed                   $HYDO_ACKED, $HYDO_FAILED - acked
  - id: mysql.amounts_valid
    msg: every order row in MySQL has the amount its id implies (100000 + id)
    type: always_or_unreachable
    every: 1                        # checked once per guest second while the workload runs
    final: true
    cmd: >-
      hydo-check count --eq 0
      --in 'wrong_amount=mysql hydo:@tcp(127.0.0.1:3306)/ "SELECT id FROM stack.orders WHERE amount <> 100000 + id"'
  - id: redis.cache_never_wrong
    msg: a cached order in Redis never holds a wrong amount (a missing key is allowed)
    type: always_or_unreachable
    final: true
    cmd: >-
      hydo-check never-wrong-value
      --cache 'redis=redis 127.0.0.1:6379 scan "order:*" --strip-prefix order:'
      --truth 'mysql=mysql hydo:@tcp(127.0.0.1:3306)/ "SELECT id, amount FROM stack.orders" --key id --value amount'
  # The final cross-service checks: a store that cannot be read after recovery is a
  # violation (--unreadable violation), as in the order service's own oracle.
  - id: order.in_mysql
    msg: every ACKed order is in MySQL with its amount
    cmd: >-
      hydo-check subset --unreadable violation --left 'acked=hydo acked'
      --right 'mysql=mysql hydo:@tcp(127.0.0.1:3306)/ "SELECT id FROM stack.orders WHERE amount = 100000 + id"'
  - id: order.in_kafka_once
    msg: every ACKed order is in the Kafka topic exactly once
    cmd: >-
      hydo-check exactly-once --unreadable violation --left 'acked=hydo acked'
      --right 'kafka=kafka 127.0.0.1:9092 orders'
  - id: order.kafka_value_right
    msg: every Kafka record carries the amount MySQL has for its order
    cmd: >-
      hydo-check never-wrong-value --allow-orphans --unreadable violation
      --cache 'kafka=kafka 127.0.0.1:9092 orders'
      --truth 'mysql=mysql hydo:@tcp(127.0.0.1:3306)/ "SELECT id, amount FROM stack.orders" --key id --value amount'
  - id: order.acked_published
    msg: every ACKed order is marked published in MySQL
    cmd: >-
      hydo-check subset --unreadable violation --left 'acked=hydo acked'
      --right 'published=mysql hydo:@tcp(127.0.0.1:3306)/ "SELECT id FROM stack.orders WHERE published = 1"'
  - id: order.told_failed_not_applied
    msg: an order the client was told definitely failed (and never ACKed later) is not in Kafka
    cmd: >-
      hydo-check disjoint --unreadable violation --left 'told_failed=hydo told-failed'
      --right 'kafka=kafka 127.0.0.1:9092 orders'

faults: [kill, pause, network, oneway, cut, clock, disk]
