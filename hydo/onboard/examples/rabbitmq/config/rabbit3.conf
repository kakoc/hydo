# rabbit@rabbit3: one node of the three-node cluster (../docker-compose.yaml)
# The nodes find each other from fixed names (classic peer discovery).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit3
# the test client logs in as guest from another host
loopback_users = none
listeners.tcp.default = 5672
# streams: the stream protocol's port, and the name a client connects to for this node
stream.listeners.tcp.1 = 5552
stream.advertised_host = rabbit3
stream.advertised_port = 5552
# the guest's memory and disk are shared by three nodes
vm_memory_high_watermark.absolute = 640MiB
disk_free_limit.absolute = 32MiB
# quorum queues: a smaller WAL than the default 512 MiB, for a data disk of 384 MiB per node
raft.wal_max_size_bytes = 67108864
log.console = true
log.console.level = info
log.file = false
# a consumer that holds a message 30 s without acknowledging it loses its channel, and the
# message comes back (the default is 30 minutes; the check declares this lease)
consumer_timeout = 30000
