# One service's own wall clock (Milestone 372, docs/design/service-clocks.md). Two nodes share a
# lease in a file. Each reads its own wall clock with clockprobe, a static Go program, and counts
# itself the leader until the lease it wrote runs out by that clock (lease.sh). With clock: own,
# T=<svc>@<at>:<change> moves one node's clock alone; the checks keep the guest's clock.
# Build (x86_64, hvx): ./build.sh, then hydo build hydo.yaml with HYDO_CLOCKBIN naming the
# hydo-clock of hydo/crates/hydo-clock/build.sh.
# Try:  disk=none | run              -> OK: n1 holds the lease, the lead never changes
#       disk=none | run T=3:5        -> OK: both clocks jump together
#       disk=none | run T=n2@3:5     -> VIOLATION [lease.one_leader]: n2's clock alone runs 5 s
#                                       ahead, n2 takes the lease while n1 still leads
#       disk=none | run T=n2@3:-5    -> OK: n2's clock behind never sees the lease run out
name: service-clocks
description: Two lease holders that trust their own wall clocks; one node's clock moves alone.

root:
  files:
    - {src: lease.sh, dst: /bin/lease.sh, mode: "0755"}
    - {src: clockprobe.bin, dst: /bin/clockprobe, mode: "0755"}

services:
  - name: n1
    cmd: /bin/lease.sh n1
    ready: test -s /tmp/lease
    clock: own
  - name: n2
    cmd: /bin/lease.sh n2
    ready: test -s /tmp/clock.n2
    clock: own

workload:
  steps: 8                          # each step waits 1 s of guest time
  run: |
    i=$HYDO_FROM
    if [ "$i" = 0 ]; then   # the cost of a read of the wall clock, without and with hydo-clock
      echo "hydo-clocks: guest $(/bin/clockprobe bench 20000)" > /dev/ttyS0
      echo "hydo-clocks: own $(/bin/hydo-clock /tmp/clock.none /bin/clockprobe bench 20000)" > /dev/ttyS0
    fi
    while [ $i -lt $HYDO_TO ]; do
      sleep 1
      echo $i >> $HYDO_ACKED
      i=$((i + 1))
    done

invariants:
  - id: lease.one_leader
    msg: at most one node counts itself the leader at a time (the lead changes at most once)
    cmd: |
      [ -s /tmp/leads ] || { echo "no node led"; exit 1; }
      awk '{ if (p != "" && $2 != p) { s++; if (s == 2) at = $1 } p = $2 }
        END { if (s >= 2) { printf "two leaders at once: the lead changed %d times, the second time at uptime %s\n", s, at; exit 1 }
              printf "the lead changed %d times\n", s }' /tmp/leads
  - id: clocks.offset
    msg: the clocks the two nodes read, against the guest kernel's uptime
    cmd: |
      a=$(tail -1 /tmp/clock.n1); b=$(tail -1 /tmp/clock.n2)
      echo "$a $b" | awk '{ printf "n2 reads %d ms ahead of n1 (n1 %s ms at uptime %s, n2 %s ms at uptime %s)\n", ($4 - $3 * 1000) - ($2 - $1 * 1000), $2, $1, $4, $3 }'

faults: [clock]
