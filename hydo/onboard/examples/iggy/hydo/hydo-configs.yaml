# The Iggy example (hydo.yaml beside this file) with the topics' durability as a setting that hydo
# explores (Milestone 299): `hydo explore --configs hydo/hydo-configs.yaml` builds one image per
# value (Iggy's default `replicated`, then `persisted`), explores each with the same seeds, and
# says which value loses acknowledged messages or stored offsets under which faults. The fault
# kinds are kills and power cuts, and the workload has 30 steps, so that one exploration is short.
# The commands and checks are the ones of hydo.yaml (workload/ and checks/ beside this file).
#
#   sh ../client/build.sh amd64; sh fetch-images.sh   (as hydo.yaml)
#   hydo explore --configs hydo/hydo-configs.yaml --seeds 1-12
#
format: 1
name: iggy
description: "Apache Iggy 0.10.0 with the topics' durability as a setting to explore: acknowledged messages and stored consumer-group offsets must survive kills and power cuts"
hydo_version: "0.3"

params:
  durability: replicated  # replicated | persisted: the topics' durability and consumer_offset_durability (Iggy's default first)
  expiry_s: "20"          # the message expiry of the topic x, in seconds

# The topic option `durability` (and `consumer_offset_durability`) as a setting to explore. The
# client creates t and x with the parameter's value (IGGY_DURABILITY). Iggy's server README,
# "Replication factor", and its config.toml, [partition].
configs:
  durability:
    values: [replicated, persisted]
    service: iggy
    doc: "https://github.com/apache/iggy/blob/server-0.10.0/core/server/README.md#replication-factor"
    tradeoff:
      replicated: "Iggy's default: with a replication factor of 1 the default replicated durability acknowledges a write before that copy reaches the disk, so a restart can lose acknowledged writes; crash-safe send retries require persisted, and weaker policies can lose data and receipts on a crash (Iggy's server README)"

guest:
  ram_mib: 2048
  clock_start: 1794960000   # 2026-11-18 00:00 UTC, the day of the import
  clock_after_cut: 60       # a real machine's clock runs on across a power cut: the recovery boot starts 60 s after the cut
  outcomes_after_cut: true  # the checks skip operations whose request got no answer, also after a power cut

data:
  size_mib: 1536   # the data disk (the fault target); Iggy's directory is a file system of its own on it

errors: true       # Iggy's ERROR lines become findings (hydo/known-errors.yaml)

env:
  IGGY_DURABILITY: "{{durability}}"   # the client creates the topics with it
  IGGY_X_EXPIRY_S: "{{expiry_s}}"     # the client creates x with it, and the expiry check reads it

root:
  files:
    - {src: ../bin/iggyc-amd64, dst: /bin/iggyc, mode: "0755"}

services:
  # image apache/iggy:0.10.0, linux/amd64 sha256:df58f48fc1cc677355d9961f7bfccfab452acdd1aaee2577c6a69d4193b73fee (as hydo.yaml)
  - name: iggy
    image: {x86_64: images/apache-iggy-0.10.0-amd64.docker.tar, arm64: images/apache-iggy-0.10.0-arm64-oci}
    image_ref: "apache/iggy:0.10.0"
    env:
      IGGY_PATH: "/app/local_data/data"
      IGGY_NODE_ADVERTISED_ADDRESS: "127.0.0.1"
      IGGY_ROOT_USERNAME: "iggy"
      IGGY_ROOT_PASSWORD: "iggy"
      IGGY_TCP_ADDRESS: "127.0.0.1:8090"
      IGGY_QUIC_ENABLED: "false"
      IGGY_HTTP_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
      IGGY_SHARDING_CPU_ALLOCATION: "1"
      IGGY_SHARDING_PIN_CORES: "false"
      IGGY_MEMORY_POOL_SIZE: "512 MiB"
      IGGY_LOGGING_FILE_ENABLED: "false"
      IGGY_DATA_MAINTENANCE_MESSAGES_INTERVAL: "5 s"
      NO_COLOR: "1"
    port: 8090
    ready: "timeout 8 /bin/iggyc ready"
    ready_timeout: 180
    restart: "on-failure"
    storage: {dir: vol/iggy, size_mib: 1024}
    mounts:
      - {tmpfs: true, dst: /run, copy_up: true}
      - {tmpfs: true, dst: /dev/shm, size: 64m}
      - {src: /data/vol/iggy, dst: /app/local_data}

provision: /bin/iggyc create

workload:
  steps: 30
  timeout: 300

test:
  parallel: 3
  per_round: 2
  round_ms: 500
  command_timeout: 60
  drain_timeout: 30

checks:
  - id: ig
    type: messages
    history: ig
    msg: what Iggy promises its producers and consumer groups
    final: /bin/iggyc drain
    acknowledgement: explicit
    claims:
      delivery: at-least-once
      duplicates: forbidden
      order: {kind: log, scope: key}
      fan_out: every-group
      after_ack: no-redelivery

faults: [kill, cut]
