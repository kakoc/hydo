# hydo's continuous integration, the per-push tier. docs/CI.md says what runs, what is skipped
# where and why, and how long it takes; ci-full.yml is the full tier (every test, release mode).
#
# - rust: the Cargo workspace on Linux (x86_64) and macOS (Apple Silicon): formatting, clippy
#   with every warning an error, and the `fast` tests (ci/test-tiers.txt) of the packages the
#   change can affect (ci/affected-packages.sh), with cargo-nextest in the `ci` profile (the
#   release profile without link-time optimisation). No test boots a guest: a GitHub runner has
#   neither the hvx kernel module nor access to Hypervisor.framework.
# - guest-programs: the guest agent and the store reader, which keep their own Cargo
#   workspaces and lock files (their bytes are inside recorded images), on Linux.
# - sdks: the assertion SDKs: the Rust reference, the Rust test SDK, and the Go (sdk/go and the
#   order service's copy), Python and JavaScript SDKs against the shared cases in sdk/cases.
#
# Every action is pinned by commit. The workflow needs no secret and only reads the repository.
# The compile cache (sccache) lives in this repository's GitHub Actions cache only: no developer
# machine reads or writes it, and no outside cache server or bucket is used.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Named explicitly, bash runs with -eo pipefail: a failing test before a `| grep` fails its step.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nextest: cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
          - os: macos-15
            nextest: cargo-nextest-0.9.148-universal-apple-darwin.tar.gz
            nextest_sha256: 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # sccache with the GitHub Actions cache as its only storage (set up by sccache-action)
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the history, for the change's base commit (ci/affected-packages.sh)
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # the Cargo registry and the compiled dependencies (the workspace's own crates come from
      # sccache: a fresh checkout's files are newer than any cached build, so Cargo compiles them)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-nextest 0.9.148 (checked against its sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/${{ matrix.nextest }}"
          echo "${{ matrix.nextest_sha256 }}  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-nextest" nextest --version
      # The skill check (hydo-agents' skill_check) also runs the Agent Skills reference
      # validator when HYDO_SKILLS_REF names it; its PyPI package installs it as `agentskills`.
      - name: Install the Agent Skills validator (skills-ref 0.1.1)
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet skills-ref==0.1.1
          echo "HYDO_SKILLS_REF=$RUNNER_TEMP/skills-ref/bin/agentskills" >> "$GITHUB_ENV"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      # every crate's integration tests are one program (docs/CI.md, "One test program per crate")
      - name: One test program per crate
        run: sh ci/consolidate-tests.sh --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Which packages the change can affect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          packages=$(sh ci/affected-packages.sh "${BASE:-none}")
          echo "$packages"
          if [ "$packages" = ALL ]; then
            echo "PACKAGES=--workspace" >> "$GITHUB_ENV"
          else
            # the tier check and the tracked-files check run on every change
            echo "PACKAGES=$(printf '%s\nhydo-release\nhydo-agents\n' "$packages" | sort -u | sed 's/^/-p /' | tr '\n' ' ')" >> "$GITHUB_ENV"
          fi
      - name: Tests (the fast tier, cargo nextest, profile ci)
        run: |
          filter=$(sh ci/tier-filter.sh fast)
          echo "packages: $PACKAGES"
          cargo nextest run --locked --cargo-profile ci --profile ci $PACKAGES -E "$filter"
      - name: sccache's statistics
        if: always()
        run: sccache --show-stats

  guest-programs:
    name: guest programs (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            hydo/crates/hydo-agent -> target
            hydo/crates/hydo-read -> target
            hydo/crates/hydo-sql -> target
      - name: hydo-agent (the guest agent's native tests, as an unprivileged user)
        working-directory: hydo/crates/hydo-agent
        run: cargo test --locked
      # The ignored test needs `sudo -n` (the agent as PID 1 of its own PID and mount
      # namespace); a GitHub Linux runner has password-less sudo.
      - name: hydo-agent (the agent as PID 1 in a namespace, with sudo)
        working-directory: hydo/crates/hydo-agent
        run: cargo test --locked --test native -- --ignored
      # The store tests need live MySQL, PostgreSQL, Kafka, Redis and etcd servers
      # (native-test.sh starts them); without their address variables each one says so.
      - name: hydo-read (the store reader and its checks)
        working-directory: hydo/crates/hydo-read
        run: |
          cargo test --locked
          cargo test --locked --test stores -- --nocapture --test-threads=1 2>&1 | grep 'skipped'
      # The outcome rules against scripted sqld and PostgreSQL servers, the configuration, the
      # SQL of each dialect, the world source (no database needed).
      - name: hydo-sql (the ready-made SQL workloads and checks)
        working-directory: hydo/crates/hydo-sql
        run: cargo test --locked

  sdks:
    name: sdks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            sdk/rust -> target
            sdk/rust-test -> target
      - name: Rust SDK (sdk/rust, the reference; compares with sdk/cases)
        working-directory: sdk/rust
        run: cargo test
      - name: Rust test SDK (sdk/rust-test)
        working-directory: sdk/rust-test
        run: cargo test --locked --workspace
      # Go 1.26.5 is the Go of the guest images and gives the shared cases' exact bytes; with Go
      # 1.27 or later the cases that need invalid UTF-8 are skipped (cases_test.go says why).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: hydo/stack/go.sum
      # -v for the shared cases' summary (how many ran, which were skipped and why)
      - name: Go SDK (sdk/go, the public module)
        working-directory: sdk/go
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test -count=1 -v ./... 2>&1 | grep -E 'cases_test.go:|^(ok|FAIL|--- FAIL)'
      - name: Go SDK, the copy the order service builds with (hydo/stack/hydoassert, hydo/stack/hydohist)
        working-directory: hydo/stack
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 -v ./hydoassert/... ./hydohist/... 2>&1 | grep -E 'cases_test.go:|^(ok|FAIL|--- FAIL)'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.9
            3.13
      - name: Python SDK (sdk/python, an old and a current Python)
        run: |
          python3.9 -m unittest discover -s sdk/python/tests
          python3.13 -m unittest discover -s sdk/python/tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: JavaScript SDK (sdk/js)
        working-directory: sdk/js
        run: node --version && node --test
