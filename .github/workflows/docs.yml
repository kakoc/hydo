# The writing standard's check (docs/STYLE.md, "How the standard is checked"): Vale on the
# documents ci/vale.sh lists. ci/vale.sh pins Vale and its two style packages by sha256.
#
# The action is pinned by commit. The workflow needs no secret and only reads the repository.
name: docs

on:
  push:
    paths:
      - "**.md"
      - ".vale.ini"
      - ".vale/**"
      - "ci/vale.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - ".vale.ini"
      - ".vale/**"
      - "ci/vale.sh"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Named explicitly, bash runs with -eo pipefail, as in ci.yml.
defaults:
  run:
    shell: bash

jobs:
  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: vale
        run: sh ci/vale.sh
