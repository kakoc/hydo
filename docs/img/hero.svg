@keyframes a13{0%,46.000%{opacity:0}46.167%,97.083%{opacity:1}100%{opacity:0}}
@keyframes c13{0%,45.833%{transform:translateX(0);opacity:0}46.000%{transform:translateX(0);opacity:1;animation-timing-function:steps(11,end)}48.062%{transform:translateX(85.8px);opacity:1}49.312%,100%{transform:translateX(85.8px);opacity:0}}
@keyframes a14{0%,50.146%{opacity:0}50.312%,97.083%{opacity:1}100%{opacity:0}}
