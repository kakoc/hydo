<rect x="0.5" y="0.5" width="919" height="34" rx="10" fill="#161b22"/>
<rect x="0.5" y="24" width="919" height="11" fill="#161b22"/>
<line x1="0" y1="35" x2="920" y2="35" stroke="#30363d"/>
<circle cx="22" cy="17.5" r="6" fill="#ff5f57"/><circle cx="42" cy="17.5" r="6" fill="#febc2e"/><circle cx="62" cy="17.5" r="6" fill="#28c840"/>
<text x="460" y="22" text-anchor="middle" class="term p">~/redis</text>
<g class="term">
<text x="24.0" y="66" style="animation:a1 28.0s linear infinite"><tspan class="p">~/redis $ </tspan><tspan class="c">hydo onboard</tspan></text>
<g class="cv" style="animation:c1 28.0s linear infinite"><rect x="102.0" y="52" width="133.6" height="19" fill="#0d1117"/><rect x="102.0" y="53" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="86" style="animation:a2 28.0s linear infinite"><tspan class="o">hydo: looking at …/redis</tspan></text>
<text x="39.6" y="106" style="animation:a3 28.0s linear infinite"><tspan class="o">hydo folder: hydo/ with hydo/hydo.yaml</tspan></text>
<text x="24.0" y="126" style="animation:a4 28.0s linear infinite"><tspan class="o">hydo: installed …/.claude/skills/hydo (onboard 2.0.0)</tspan></text>
<text x="24.0" y="146" style="animation:a5 28.0s linear infinite"><tspan class="o">Next: open Claude Code here and run </tspan><tspan class="hl">/hydo:onboard</tspan></text>
<text x="70.8" y="166" style="animation:a6 28.0s linear infinite"><tspan class="o">… It asks about your system and fills in hydo/ with you.</tspan></text>
<text x="24.0" y="196" style="animation:a7 28.0s linear infinite"><tspan class="ai">Claude Code › </tspan><tspan class="hl">/hydo:onboard</tspan></text>
<g class="cv" style="animation:c7 28.0s linear infinite"><rect x="133.2" y="182" width="141.4" height="19" fill="#0d1117"/><rect x="133.2" y="183" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="226" style="animation:a8 28.0s linear infinite"><tspan class="p">~/redis $ </tspan><tspan class="c">hydo explore --seeds 1-30 --strategy swarm</tspan></text>
<g class="cv" style="animation:c8 28.0s linear infinite"><rect x="102.0" y="212" width="367.6" height="19" fill="#0d1117"/><rect x="102.0" y="213" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="246" style="animation:a9 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="24.0" y="266" style="animation:a10 28.0s linear infinite"><tspan class="o">hydo ran your system 30 times: </tspan><tspan class="bad">13 failed, in 3 different ways</tspan><tspan class="o">. Each failing run</tspan></text>
<text x="24.0" y="286" style="animation:a11 28.0s linear infinite"><tspan class="ok">failed again the same way when hydo replayed it</tspan><tspan class="o">.</tspan></text>
<text x="24.0" y="306" style="animation:a12 28.0s linear infinite"><tspan class="o">See them: hydo report   (as one web page: hydo report --html)</tspan></text>
<text x="24.0" y="326" style="animation:a13 28.0s linear infinite"><tspan class="p">~/redis $ </tspan><tspan class="c">hydo report</tspan></text>
<g class="cv" style="animation:c13 28.0s linear infinite"><rect x="102.0" y="312" width="125.8" height="19" fill="#0d1117"/><rect x="102.0" y="313" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="346" style="animation:a14 28.0s linear infinite"><tspan class="c">hydo found 3 problems in your Redis setup (13 of 30 runs failed)</tspan></text>
<text x="24.0" y="366" style="animation:a15 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="24.0" y="386" style="animation:a16 28.0s linear infinite"><tspan class="c">1. redis did not start again after disk errors</tspan></text>
<text x="47.4" y="406" style="animation:a17 28.0s linear infinite"><tspan class="o"></tspan><tspan class="bad">Worth a look</tspan><tspan class="o">, 5 of 30 runs.</tspan></text>
<text x="47.4" y="426" style="animation:a18 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="47.4" y="446" style="animation:a19 28.0s linear infinite"><tspan class="o">See it again: </tspan><tspan class="c">hydo run "disk=ioerr:3 dseed=fd403ef8d08fa636 | run K=redis@16+1 N=redis@0-8:loss,7%"</tspan></text>
<text x="24.0" y="466" style="animation:a20 28.0s linear infinite"><tspan class="c">2. Redis lost data it had confirmed, after a power cut, with Redis appendfsync set to no</tspan></text>
<text x="47.4" y="486" style="animation:a21 28.0s linear infinite"><tspan class="o"></tspan><tspan class="hl">Expected for this setting</tspan><tspan class="o">, 2 of 30 runs.</tspan></text>
<text x="47.4" y="506" style="animation:a22 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="47.4" y="526" style="animation:a23 28.0s linear infinite"><tspan class="o">See it again: </tspan><tspan class="c">hydo run "disk=cut dseed=1f16055b6d41c6d9 | run C=9 R=no"</tspan></text>
<text x="24.0" y="546" style="animation:a24 28.0s linear infinite"><tspan class="c">3. Redis lost data it had confirmed, with a faulty disk</tspan></text>
<text x="47.4" y="566" style="animation:a25 28.0s linear infinite"><tspan class="o"></tspan><tspan class="ok">Expected</tspan><tspan class="o">, 6 of 30 runs.</tspan></text>
<text x="47.4" y="586" style="animation:a26 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="47.4" y="606" style="animation:a27 28.0s linear infinite"><tspan class="o">See it again: </tspan><tspan class="c">hydo run "disk=lying:3 dseed=eac0b527c5ac67d9 | run C=20"</tspan></text>
<text x="24.0" y="626" style="animation:a28 28.0s linear infinite"><tspan class="o">…</tspan></text>
<text x="24.0" y="646" style="animation:a29 28.0s linear infinite"><tspan class="p">~/redis $ </tspan></text>
<g style="animation:a_end 28.0s linear infinite"><rect x="102.0" y="633" width="8" height="17" fill="#e6edf3" style="animation:blink 1s step-end infinite"/></g>
</g>
</svg>
