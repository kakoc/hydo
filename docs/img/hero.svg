<svg xmlns="http://www.w3.org/2000/svg" width="920" height="476" viewBox="0 0 920 476" role="img" aria-labelledby="t d">
<title id="t">hydo onboard, hydo explore and hydo report on a Compose project</title>
<desc id="d">An animated terminal. In Blnk&#x27;s repository (a ledger on PostgreSQL and Redis), hydo onboard finds the Compose file with 8 services, starts the hydo folder and installs the Claude Code skill. In Claude Code, /hydo:onboard asks about the system and writes a client and rules. hydo explore runs 20 fault schedules: 9 fail, and all 9 fail again on a replay. hydo report gives each kind of failure one hydo run command: a Redis pause that makes an atomic bulk keep its first transfer, a Blnk bug, and a Redis kill that loses two operations the ledger had confirmed. Output shortened from real runs: hydo onboard on Blnk&#x27;s repository, and the Blnk example&#x27;s exploration on a Mac.</desc>
