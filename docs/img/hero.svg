<rect x="0.5" y="0.5" width="919" height="475" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="919" height="34" rx="10" fill="#161b22"/>
<rect x="0.5" y="24" width="919" height="11" fill="#161b22"/>
<line x1="0" y1="35" x2="920" y2="35" stroke="#30363d"/>
<circle cx="22" cy="17.5" r="6" fill="#ff5f57"/><circle cx="42" cy="17.5" r="6" fill="#febc2e"/><circle cx="62" cy="17.5" r="6" fill="#28c840"/>
<text x="460" y="22" text-anchor="middle" class="term p">~/blnk</text>
<g class="term">
<text x="24.0" y="66" style="animation:a1 24.0s linear infinite"><tspan class="p">~/blnk $ </tspan><tspan class="c">hydo onboard</tspan></text>
<g class="cv" style="animation:c1 24.0s linear infinite"><rect x="94.2" y="52" width="133.6" height="19" fill="#0d1117"/><rect x="94.2" y="53" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="86" style="animation:a2 24.0s linear infinite"><tspan class="o">hydo: looking at …/blnk</tspan></text>
<text x="39.6" y="106" style="animation:a3 24.0s linear infinite"><tspan class="o">Compose file: docker-compose.yaml, 8 services: init, server, worker, redis, postgres, …</tspan></text>
<text x="39.6" y="126" style="animation:a4 24.0s linear infinite"><tspan class="o">main language: Go (281 files; then JavaScript 9, Python 3)</tspan></text>
<text x="24.0" y="146" style="animation:a5 24.0s linear infinite"><tspan class="o">hydo: starting hydo/ from docker-compose.yaml: hydo compose …</tspan></text>
<text x="24.0" y="166" style="animation:a6 24.0s linear infinite"><tspan class="o">hydo: installed …/.claude/skills/hydo (onboard 2.0.0)</tspan></text>
<text x="24.0" y="186" style="animation:a7 24.0s linear infinite"><tspan class="o">Next: open Claude Code here and run </tspan><tspan class="hl">/hydo:onboard</tspan></text>
<text x="24.0" y="216" style="animation:a8 24.0s linear infinite"><tspan class="ai">Claude Code › </tspan><tspan class="hl">/hydo:onboard</tspan></text>
<g class="cv" style="animation:c8 24.0s linear infinite"><rect x="133.2" y="202" width="141.4" height="19" fill="#0d1117"/><rect x="133.2" y="203" width="8" height="17" fill="#e6edf3"/></g>
<text x="39.6" y="236" style="animation:a9 24.0s linear infinite"><tspan class="m"># it asks about your system, then writes a client (hydo/workload/) and rules (hydo/checks/)</tspan></text>
<text x="24.0" y="266" style="animation:a10 24.0s linear infinite"><tspan class="p">~/blnk $ </tspan><tspan class="c">hydo explore --seeds 1-20 --strategy process --new-faults</tspan></text>
<g class="cv" style="animation:c10 24.0s linear infinite"><rect x="94.2" y="252" width="484.6" height="19" fill="#0d1117"/><rect x="94.2" y="253" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="286" style="animation:a11 24.0s linear infinite"><tspan class="o">{"schedules": 20, "strategy": "process", … </tspan><tspan class="bad">"failures": 9</tspan><tspan class="o">, </tspan><tspan class="ok">"reproduced": 9</tspan><tspan class="o">}</tspan></text>
<text x="39.6" y="306" style="animation:a12 24.0s linear infinite"><tspan class="m"># 9 of 20 runs broke a rule, and each one failed again when hydo ran it a second time</tspan></text>
<text x="24.0" y="326" style="animation:a13 24.0s linear infinite"><tspan class="p">~/blnk $ </tspan><tspan class="c">hydo report</tspan></text>
<g class="cv" style="animation:c13 24.0s linear infinite"><rect x="94.2" y="312" width="125.8" height="19" fill="#0d1117"/><rect x="94.2" y="313" width="8" height="17" fill="#e6edf3"/></g>
<text x="24.0" y="346" style="animation:a14 24.0s linear infinite"><tspan class="o">## Minimal reproducers</tspan></text>
<text x="24.0" y="366" style="animation:a15 24.0s linear infinite"><tspan class="o">- by hand: </tspan><tspan class="c">hydo run --image … "disk=none … | run P=redis@9+4 W=…"</tspan></text>
<text x="39.6" y="386" style="animation:a16 24.0s linear infinite"><tspan class="m"># Redis paused: an atomic bulk keeps its first transfer (a Blnk bug)</tspan></text>
<text x="24.0" y="406" style="animation:a17 24.0s linear infinite"><tspan class="o">- by hand: </tspan><tspan class="c">hydo run --image … "disk=none … | run K=redis@21+1 N=… W=…"</tspan></text>
<text x="39.6" y="426" style="animation:a18 24.0s linear infinite"><tspan class="m"># Redis killed: two operations the ledger had confirmed are lost (Redis kept no log on disk)</tspan></text>
<text x="24.0" y="446" style="animation:a19 24.0s linear infinite"><tspan class="p">~/blnk $ </tspan></text>
<g style="animation:a_end 24.0s linear infinite"><rect x="94.2" y="433" width="8" height="17" fill="#e6edf3" style="animation:blink 1s step-end infinite"/></g>
</g>
</svg>
