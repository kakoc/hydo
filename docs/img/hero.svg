@keyframes c10{0%,27.854%{transform:translateX(0);opacity:0}28.021%{transform:translateX(0);opacity:1;animation-timing-function:steps(57,end)}38.708%{transform:translateX(444.6px);opacity:1}39.958%,100%{transform:translateX(444.6px);opacity:0}}
@keyframes a11{0%,40.792%{opacity:0}40.958%,97.083%{opacity:1}100%{opacity:0}}
