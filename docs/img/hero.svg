<svg xmlns="http://www.w3.org/2000/svg" width="920" height="676" viewBox="0 0 920 676" role="img" aria-labelledby="t d">
<title id="t">hydo onboard, hydo explore and hydo report on the Redis example</title>
<desc id="d">An animated terminal in a repository with the Redis example&#x27;s hydo folder. hydo onboard finds the hydo folder and installs the Claude Code skill, whose command is /hydo:onboard. hydo explore runs Redis 30 times with different faults: 13 runs fail, in 3 different ways, and each failing run fails again the same way when hydo replays it. hydo report lists the 3 problems, each with a label, how many runs show it, and the hydo run command that shows it again: Redis does not start again after disk errors (worth a look), Redis loses confirmed data after a power cut with appendfsync set to no (expected for this setting), and Redis loses confirmed data with a faulty disk (expected). Output shortened from real runs on a Mac.</desc>
