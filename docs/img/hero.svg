@keyframes c8{0%,17.500%{transform:translateX(0);opacity:0}17.667%{transform:translateX(0);opacity:1;animation-timing-function:steps(13,end)}20.104%{transform:translateX(101.4px);opacity:1}21.354%,100%{transform:translateX(101.4px);opacity:0}}
@keyframes a9{0%,22.188%{opacity:0}22.354%,97.083%{opacity:1}100%{opacity:0}}
