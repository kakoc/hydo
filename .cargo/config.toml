# The Linux release's `hydo` is a static musl binary. Rust's bundled lld links it from any host
# (the musl target ships its own crt objects and libc), so a Mac can build it too.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# hydo-world, the in-guest program of fakes: and proxies:, also runs in arm64 guests (the Mac
# backend): the same static link for aarch64 (hydo/crates/hydo-world/build.sh).
# The arm64 guest client hydo-grpc (hydo/grpcgen/build-client.sh), linked the same way.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
