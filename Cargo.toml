# The hydo workspace: the product's Rust crates (hydo/crates/). The language policy is in AGENTS.md.
#
# Not members, on purpose: the SDK crates (sdk/rust = hydo-assert, sdk/rust-test = hydo-test) and the
# Rust examples under hydo/onboard/examples/ keep their own workspaces and lock files. They are compiled
# into guest programs whose bytes are inside recorded images, they must build with the user's own
# toolchain and with no dependency of this workspace, and Cargo derives symbol hashes from a package's
# path and lock file, so making them members would change those binaries (docs/HISTORY.md, M100).
[workspace]
resolver = "2"
members = [
    "hydo/crates/hydo-config",
    "hydo/crates/hydo-schedule",
    "hydo/crates/hydo-manifest",
    "hydo/crates/hydo-engine-proto",
    "hydo/crates/hydo-engine",
    "hydo/crates/hydo-build",
    "hydo/crates/hydo-cli",
    "hydo/crates/hydo-explore",
    "hydo/crates/hydo-composer",
    "hydo/crates/hydo-errors",
    "hydo/crates/hydo-agents",
    "hydo/crates/hydo-compose",
    "hydo/crates/hydo-history",
    "hydo/crates/hydo-bench",
    "hydo/crates/hydo-tools",
    "hydo/crates/hydo-world",
    "hydo/crates/hydo-grpc",
    "hydo/crates/hydo-grpc-gen",
    "hydo/crates/hydo-results",
    "hydo/crates/hydo-image",
    "hydo/crates/hydo-schema-compat",
    "hydo/crates/hydo-agent-proto",
    "hydo/crates/hydo-control",
    "hydo/crates/hydo-hvx",
    "hydo/crates/hydo-hvm",
    "hydo/crates/hydo-release",
    "hydo/crates/hydo-kvm",
]
exclude = ["sdk", "hydo/onboard/examples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/kakoc/hydo"
homepage = "https://github.com/kakoc/hydo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
hydo-config = { version = "0.1.0", path = "hydo/crates/hydo-config" }
hydo-schedule = { version = "0.1.0", path = "hydo/crates/hydo-schedule" }
hydo-manifest = { version = "0.1.0", path = "hydo/crates/hydo-manifest" }
hydo-engine = { version = "0.1.0", path = "hydo/crates/hydo-engine" }
hydo-engine-proto = { version = "0.1.0", path = "hydo/crates/hydo-engine-proto" }
hydo-explore = { version = "0.1.0", path = "hydo/crates/hydo-explore" }
hydo-composer = { version = "0.1.0", path = "hydo/crates/hydo-composer" }
hydo-errors = { version = "0.1.0", path = "hydo/crates/hydo-errors" }
hydo-agents = { version = "0.1.0", path = "hydo/crates/hydo-agents" }
hydo-compose = { version = "0.1.0", path = "hydo/crates/hydo-compose" }
hydo-history = { version = "0.1.0", path = "hydo/crates/hydo-history" }
hydo-build = { version = "0.1.0", path = "hydo/crates/hydo-build" }
hydo-grpc = { version = "0.1.0", path = "hydo/crates/hydo-grpc" }
hydo-grpc-gen = { version = "0.1.0", path = "hydo/crates/hydo-grpc-gen" }
hydo-results = { version = "0.1.0", path = "hydo/crates/hydo-results" }
hydo-image = { version = "0.1.0", path = "hydo/crates/hydo-image" }
hydo-agent-proto = { version = "0.1.0", path = "hydo/crates/hydo-agent-proto" }
hydo-control = { version = "0.1.0", path = "hydo/crates/hydo-control" }
hydo-hvx = { version = "0.1.0", path = "hydo/crates/hydo-hvx" }
hydo-hvm = { version = "0.1.0", path = "hydo/crates/hydo-hvm" }
hydo-kvm = { version = "0.1.0", path = "hydo/crates/hydo-kvm" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The tests' profile for the per-push tier and for development (Milestone 171; docs/CI.md): the
# release profile's code and semantics (opt-level 3, no debug assertions, no overflow checks, so
# a test behaves as under `cargo test --release`), without its link-time optimisation and with
# parallel code generation, which made every test program a minutes-long link. Release binaries
# (`--release`, the tarballs, the pinned guest programs) keep [profile.release].
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
strip = false # symbols kept for test backtraces

# The gRPC client's tests generate deeply nested messages (recursive schemas); unoptimized,
# they take minutes. Only debug builds are affected (the release client is built with --release).
[profile.dev.package.hydo-grpc]
opt-level = 2
[profile.dev.package.prost-reflect]
opt-level = 2
[profile.dev.package.prost]
opt-level = 2
